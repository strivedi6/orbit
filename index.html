  pickTeam(el) { A.teamId = el.dataset.id; Motion.haptic(); $$('#lock .teamlist .li').forEach(b => b.classList.toggle('on', b === el)); const c = $('#lock [data-auth="toDetails"]'); if (c) c.disabled = false; },
  toDetails() { if (A.teamId) { A.username = ''; go('details'); } },
  toNewPin() {
    A.name = $('#a-name').value.trim(); A.jobTitle = $('#a-job').value.trim(); A.username = $('#a-user').value.trim().toLowerCase();
    if (A.name.length < 2) { A.err = 'Enter your full name.'; renderLock(); return; }
    if (!/^[a-z0-9._-]{3,20}$/.test(A.username)) { A.err = 'Usernames are 3–20 letters, numbers, dots or dashes.'; renderLock(); return; }
    go('newpin');
  }
};

/* ======================================================================
   Motion — screen transitions, gliding selections, scroll reveal,
   numbers that count up, cards that trail the scroll, pull to refresh, haptics.
   ====================================================================== */
const Motion = (() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SETTLE = 'cubic-bezier(.32,.72,0,1)', SPRING = 'cubic-bezier(.34,1.25,.64,1)', GLIDE = 'cubic-bezier(.22,.8,.22,1)';
  const anim = (el, frames, opts) => (reduce || !el || !el.animate ? null : el.animate(frames, opts));
  const M = { nextKind: '', pillIdx: undefined, pinKeys: null };
  M.bounce = el => anim(el, [{ transform: 'scale(1)' }, { transform: 'scale(1.14)', offset: 0.45 }, { transform: 'scale(1)' }], { duration: 520, easing: SETTLE });

  M.after = (kind, opts) => {
    const page = $('#page'); if (!page) return;
    morphSegs(page);
    if (kind && !opts.soft) enter(page, kind);
    countUp(page, kind === 'tab' || kind === 'push');
    observeReveal(page);
    M.armHaptics(app());
    follow.reset();
  };
  function enter(page, kind) {
    const items = Array.from(page.children).flatMap(el => el.classList.contains('pgrid') || el.classList.contains('smart') ? Array.from(el.children) : [el]);
    const vh = innerHeight; let n = 0;
    items.forEach(el => {
      const r = el.getBoundingClientRect(); if (r.top > vh + 40) return;
      const delay = Math.min(n++, 7) * 32;
      const from = kind === 'push' ? 'translateX(28px)' : kind === 'pop' ? 'translateX(-28px)' : kind === 'fade' ? 'translateY(8px)' : 'translateY(14px) scale(.985)';
      anim(el, [{ opacity: 0, transform: from }, { opacity: 1, transform: 'none' }], { duration: 460, delay, easing: SETTLE, fill: 'backwards' });
    });
    const nb = $('.nb-title'); if (nb && kind !== 'fade') anim(nb, [{ opacity: 0 }, { opacity: getComputedStyle(nb).opacity }], { duration: 300 });
  }
  /* Segmented controls: the selected pill glides from the old choice to the new one. */
  const segPos = {};
  const rectIn = b => ({ left: b.offsetLeft, top: b.offsetTop, width: b.offsetWidth, height: b.offsetHeight });
  function morphSegs(root) {
    $$('.seg[id]', root).forEach(box => {
      const on = $(':scope > .on', box); if (!on) return;
      const to = rectIn(on), from = segPos[box.id]; segPos[box.id] = to;
      if (!from || reduce || (Math.abs(from.left - to.left) < 1 && Math.abs(from.width - to.width) < 1)) return;
      const ghost = document.createElement('span'); ghost.className = 'seg-ghost';
      const px = r => ({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
      Object.assign(ghost.style, px(to)); box.appendChild(ghost); on.classList.add('seg-hold');
      const a = ghost.animate([px(from), px(to)], { duration: 550, easing: GLIDE });
      a.onfinish = a.oncancel = () => { ghost.remove(); on.classList.remove('seg-hold'); };
    });
  }
  let io = null;
  function observeReveal(page) {
    if (reduce || !('IntersectionObserver' in window)) return;
    if (io) io.disconnect();
    const sc = $('#sc');
    io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { root: sc, rootMargin: '0px 0px -30px 0px', threshold: 0.04 });
    const vh = innerHeight;
    $$('.menu, .pcard, .section-title, .card', page).forEach(el => { if (el.getBoundingClientRect().top < vh) return; el.classList.add('reveal'); io.observe(el); });
  }
  const ease = t => 1 - Math.pow(1 - t, 4);
  function countUp(page, fromZero) {
    if (reduce || !fromZero) return;
    $$('[data-count]', page).forEach(el => {
      const val = parseInt(el.textContent, 10); if (!val) return;
      const t0 = performance.now(), dur = 900;
      const tick = now => { if (!el.isConnected) return; const k = Math.min(1, (now - t0) / dur); el.textContent = Math.round(val * ease(k)); if (k < 1) requestAnimationFrame(tick); };
      el.textContent = '0'; requestAnimationFrame(tick);
    });
  }
  /* Cards trail the finger a little while scrolling, then spring back into place (phones). */
  const follow = (() => {
    if (reduce) return { reset() { } };
    let items = [], lastY = 0, touchY = null, running = false, bound = null;
    const STRETCH = 0.4, MAXO = 42, K = 0.075, DAMP = 0.8;
    const collect = () => { const page = $('#page'); if (!page) return []; return $$(':scope > *, .pgrid > *, .smart > *', page).filter(el => !el.classList.contains('pgrid') && !el.classList.contains('smart') && !el.classList.contains('large-title') && !el.classList.contains('hello')).map(el => ({ el, o: 0, v: 0 })); };
    const frame = () => {
      let moving = false;
      items.forEach(it => { it.v = (it.v - it.o * K) * DAMP; it.o += it.v; if (Math.abs(it.o) < 0.15 && Math.abs(it.v) < 0.15) { it.o = 0; it.v = 0; } else moving = true; it.el.style.translate = it.o ? '0 ' + it.o.toFixed(2) + 'px' : ''; });
      running = moving; if (moving) requestAnimationFrame(frame);
    };
    const onScroll = () => {
      const sc = $('#sc'); if (!sc || innerWidth >= 1024) return;
      const y = sc.scrollTop, d = y - lastY; lastY = y;
      if (!d || y < 0 || y > sc.scrollHeight - sc.clientHeight || touchY === null && Math.abs(d) < 2) return;
      if (!items.length || !items[0].el.isConnected) items = collect();
      const vh = innerHeight, anchor = touchY !== null ? touchY : (d > 0 ? vh * 0.25 : vh * 0.75);
      items.forEach(it => { const r = it.el.getBoundingClientRect(); if (r.bottom < -80 || r.top > vh + 80) return; const mid = Math.min(Math.max(anchor, r.top), r.bottom); const w = Math.min(1, Math.abs(mid - anchor) / vh); it.o = Math.max(-MAXO, Math.min(MAXO, it.o + d * w * STRETCH)); });
      if (!running) { running = true; requestAnimationFrame(frame); }
    };
    addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
    addEventListener('touchmove', e => { touchY = e.touches[0].clientY; }, { passive: true });
    addEventListener('touchend', () => { touchY = null; }, { passive: true });
    return { reset() { items.forEach(it => { it.el.style.translate = ''; }); items = []; const sc = $('#sc'); lastY = sc ? sc.scrollTop : 0; if (sc && bound !== sc) { bound = sc; sc.addEventListener('scroll', onScroll, { passive: true }); } } };
  })();

  /* Pull down to refresh: the page stretches like a rubber band and a soft glow ripples behind the top bar. */
  (function pull() {
    const aur = document.createElement('div'); aur.id = 'aurora'; aur.setAttribute('aria-hidden', 'true');
    aur.innerHTML = '<div class="glow">' + '<i></i>'.repeat(5) + '</div>';
    document.body.appendChild(aur);
    const MAX = 150, TRIGGER = 66;
    const rubber = dy => MAX * (1 - Math.exp(-dy / 270));
    let startY = null, pulling = false, dist = 0, busy = false;
    const navH = () => { const n = $('#nav'); return n ? n.getBoundingClientRect().height : 90; };
    const setPull = (d, tr) => {
      const v = $('#page'); if (!v) return;
      v.style.transition = tr ? 'transform .6s ' + SPRING : 'none';
      v.style.transform = d ? 'translateY(' + d + 'px)' : '';
      const p = Math.min(1, d / TRIGGER);
      aur.style.transition = tr ? 'height .6s ' + SPRING + ', opacity .5s ease' : 'none';
      aur.style.height = (navH() + Math.min(d * 0.35, 26)) + 'px';
      if (!busy) aur.style.opacity = d > 2 ? p.toFixed(3) : '0';
      aur.classList.toggle('live', d > 2 || busy);
      const lt = $('#page .large-title'); if (lt) { lt.style.transition = v.style.transition; lt.style.transform = d ? 'scale(' + (1 + Math.min(d, 120) / 1400) + ')' : ''; }
    };
    const canPull = e => Session.token && S.data && !S.taskId && !DLG && !$('#lockroot').innerHTML && innerWidth < 1024 && e.target.closest && e.target.closest('#sc') && $('#sc').scrollTop <= 0;
    document.addEventListener('touchstart', e => { if (busy || e.touches.length !== 1 || !canPull(e)) { startY = null; return; } startY = e.touches[0].clientY; pulling = false; dist = 0; }, { passive: true });
    document.addEventListener('touchmove', e => {
      if (startY === null) return;
      const dy = e.touches[0].clientY - startY, sc = $('#sc');
      if (!pulling) { if (sc.scrollTop > 0 || dy < -6) { startY = null; return; } if (dy < 4) return; }
      pulling = true; if (e.cancelable) e.preventDefault();
      dist = rubber(Math.max(0, dy)); setPull(dist, false);
    }, { passive: false });
    const release = async () => {
      if (startY === null || !pulling) { startY = null; return; }
      startY = null; pulling = false;
      if (dist >= TRIGGER) {
        busy = true; M.haptic(); aur.classList.add('busy'); aur.style.opacity = '1'; setPull(0, true);
        const t0 = Date.now();
        await Outbox.flush(); await sync({ soft: true, force: true });
        await sleep(Math.max(0, 1500 - (Date.now() - t0)));
        busy = false; aur.classList.remove('busy'); setPull(0, true);
        setTimeout(() => { if (!busy && !pulling) aur.classList.remove('live'); }, 650);
        toast(Outbox.state === 'offline' ? 'Offline: changes will save later' : 'Up to date');
      } else setPull(0, true);
      dist = 0;
    };
    document.addEventListener('touchend', release, { passive: true });
    document.addEventListener('touchcancel', release, { passive: true });
  })();

  /* Haptics: iPhone has no vibration API, but a tap that lands on a hidden iOS switch plays the system tick. */
  const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  M.haptic = () => { try { if (!IOS && navigator.vibrate) navigator.vibrate(8); } catch (e) { } };
  const HAPTIC = '.btn, .circle, .fab, .tab, .seg button, .keypad button, .check, .smart button, .pcard';
  M.armHaptics = root => {
    if (!IOS || !root) return;
    $$(HAPTIC, root).forEach(el => {
      if (el.querySelector(':scope > [data-haptic]') || el.tagName === 'LABEL' || el.tagName === 'INPUT') return;
      const lb = document.createElement('label'); lb.setAttribute('data-haptic', ''); lb.setAttribute('aria-hidden', 'true');
      const sw = document.createElement('input'); sw.type = 'checkbox'; sw.setAttribute('switch', ''); sw.tabIndex = -1;
      sw.addEventListener('click', e => e.stopPropagation());
      lb.appendChild(sw);
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.appendChild(lb);
    });
  };
  return M;
})();

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-auth]');
  if (a) { AUTH[a.dataset.auth](a, e); return; }
  if (e.target.closest('#ov [data-dact], #menu, #alert, #lockroot')) return;
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.closest('#ov') && !['openTask', 'openProject'].includes(el.dataset.act)) return;
  if (el.closest('#ov')) closeDialog();
  const fn = ACT[el.dataset.act];
  if (fn) { e.stopPropagation(); Promise.resolve().then(() => fn(el, e)).catch(() => { }); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if ($('#lockroot').innerHTML) {
    if (Motion.pinKeys && $('#dots') && !(t.tagName === 'INPUT')) { Motion.pinKeys(e); return; }
    if (e.key === 'Enter' && t.tagName === 'INPUT') { const b = $('#lock .btn.primary'); if (b && !b.disabled) b.click(); }
    return;
  }
  if (e.key === 'Enter' && t.dataset && t.dataset.enter && ACT[t.dataset.enter]) { e.preventDefault(); ACT[t.dataset.enter](t); return; }
  if (e.key === 'Enter' && !e.shiftKey && t.dataset && t.dataset.enterSend && innerWidth >= 1024) { e.preventDefault(); ACT.sendComment(t); return; }
  if (e.key === 'Enter' && t.id === 'ttl') { e.preventDefault(); t.blur(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role=button][data-act]')) { e.preventDefault(); t.click(); return; }
  if (e.key === 'Escape') {
    if ($('#alert').innerHTML) return;
    if ($('#menu').innerHTML) { $('#menu').innerHTML = ''; return; }
    if (DLG) { closeDialog(); return; }
    if (S.addingCol) { S.addingCol = null; render(); return; }
    if (S.taskId) { S.taskId = null; render({ soft: true }); }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const q = $('#q'); if (q && q.offsetParent) q.focus(); else ACT.go({ dataset: { v: 'search' } }); }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.change && ACT[t.dataset.change]) ACT[t.dataset.change](t); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.input === 'search') { S.q = t.value.trim(); renderContent(); }
  if (t.dataset.input === 'search2') { S.q = t.value.trim(); const r = $('#results'); if (r) r.innerHTML = S.q ? searchResultsHtml(S.q, true) : ''; }
  if (t.classList.contains('ttl-edit') || t.id === 'cmt') autosize();
});
document.addEventListener('focusout', e => { if (e.target.id === 'addcol' && !e.target.value.trim()) setTimeout(() => { if (S.addingCol) { S.addingCol = null; render(); } }, 150); });
function autosize() { $$('.ttl-edit, #cmt').forEach(t => { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, t.id === 'cmt' ? 140 : 400) + 'px'; }); }
document.addEventListener('scroll', e => { if (e.target.id === 'sc') { const nb = $('#nav'); if (nb) nb.classList.toggle('scrolled', e.target.scrollTop > 34); } }, true);

/* board drag & drop */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return; dragId = c.dataset.drag; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) { } });
document.addEventListener('dragend', e => { const c = e.target.closest && e.target.closest('[data-drag]'); c && c.classList.remove('dragging'); $$('.col.drop').forEach(x => x.classList.remove('drop')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-col]'); if (!col || !dragId) return; e.preventDefault(); $$('.col.drop').forEach(x => x !== col && x.classList.remove('drop')); col.classList.add('drop'); });
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('[data-col]'); if (!col || !dragId) return; e.preventDefault();
  const t = taskById(dragId); const st = col.dataset.col; dragId = null; col.classList.remove('drop');
  if (t && t.status !== st) saveTask({ id: t.id, status: st, order: Date.now() }, 'Moved to ' + STATUS[st].l);
});

/* Keep changes safe when the app is closed while they're still saving. */
addEventListener('beforeunload', e => {
  if (Outbox.q.length || Outbox.busy) {
    Outbox.flush();
    e.preventDefault(); e.returnValue = 'Your latest changes are still saving. Wait a few seconds, then close.';
    return e.returnValue;
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (Outbox.q.length && !Outbox.busy) API.beacon({ action: 'batch', ops: Outbox.q.slice(0, 40) }); }
  else if (Session.token && S.data && API.live) { Outbox.flush(); sync({ soft: true }); }
});
addEventListener('online', () => { Outbox.kick(0); });

/* theme */
function applyTheme() { const t = store.get('orbit_theme', 'system'); if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }

/* boot */
(function boot() {
  ['insp-scrim:div', 'insp:aside', 'tabroot:div', 'lockroot:div'].forEach(s => { const [id, tag] = s.split(':'); if (!document.getElementById(id)) { const el = document.createElement(tag); el.id = id; if (id === 'insp') el.className = 'insp'; if (id === 'insp-scrim') { el.className = 'insp-scrim'; el.dataset.act = 'closeTask'; } document.body.appendChild(el); } });
  if (!$('#toast')) { const t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  applyTheme();
  setInterval(() => { if (!document.hidden && Session.token && S.data && API.live) sync({ soft: true }); }, 20000);
  if (Session.token) {
    applyAccent(store.get('orbit_last', {}).color);
    const cached = store.get('orbit_cache', null);
    if (cached && cached.me && Session.user && cached.me.id === Session.user.id) { acceptData(cached); S.welcomed = false; render(); setTimeout(() => { S.welcomed = true; }, 4000); }
    else app().innerHTML = `<div class="loading"><span class="spin"></span></div>`;
    sync().then(() => { if (!S.data && Session.token) app().innerHTML = `<div class="loading"><div style="text-align:center;padding:24px"><p class="sub" style="margin-bottom:14px">Couldn’t reach the server. Check your connection.</p><button class="btn primary sm" onclick="location.reload()">Try Again</button></div></div>`; });
    Outbox.kick(300);
  } else showLock();
})();
/* Keep a copy on this device so the app opens instantly next time. */
setInterval(() => { if (S.data && Session.token) store.set('orbit_cache', S.data); }, 15000);
addEventListener('pagehide', () => { if (S.data && Session.token) store.set('orbit_cache', S.data); });

</script>
