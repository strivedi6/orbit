/* ---------------- workload: who is carrying what, and how the work is moving ---------------- */
function workloadHtml() {
  const teams = myTeamIds().filter(inScope).filter(id => { const t = teamById(id) || {}; return (S.teamProp === 'all' || t.propertyCode === S.teamProp) && (S.teamDept === 'all' || t.name === S.teamDept); });
  const people = D().users.filter(u => u.status === 'active' && visibleUser(u) && userTeamsC(u).some(t => teams.includes(t)));
  const taskTeams = t => { const p = projById(t.projectId); return p ? projTeamsC(p) : [t.teamId]; };
  const tasks = D().tasks.filter(t => taskInScope(t) && taskTeams(t).some(x => teams.includes(x)) && !(projById(t.projectId) || {}).archived);
  const today = todayStr(), now = new Date();
  const per = S.wlPeriod || 'week';
  const startOf = (k, back) => { const d = new Date(now); d.setHours(0, 0, 0, 0);
    if (k === 'week') { d.setDate(d.getDate() - ((d.getDay() + 6) % 7) - 7 * back); } else if (k === 'month') { d.setDate(1); d.setMonth(d.getMonth() - back); } else return new Date(0); return d; };
  const pStart = startOf(per, 0), prevStart = startOf(per, 1);
  const inP = t => t.completedAt && new Date(t.completedAt) >= pStart;
  const inPrev = t => t.completedAt && new Date(t.completedAt) >= prevStart && new Date(t.completedAt) < pStart;
  const open = tasks.filter(t => !isDone(t)), done = tasks.filter(t => isDone(t) && inP(t)), donePrev = tasks.filter(t => isDone(t) && inPrev(t));
  const overdue = open.filter(t => t.due && t.due < today), soon = open.filter(t => t.due && t.due >= today && dayDiff(t.due) <= 7);
  const unassigned = open.filter(t => !(t.assignees || []).length);
  const locDay = iso => { const d = new Date(iso); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const dated = done.filter(t => t.due), onTime = dated.filter(t => locDay(t.completedAt) <= t.due).length;
  const projs = D().projects.filter(p => projInScope(p) && !p.archived && projTeamsC(p).some(x => teams.includes(x)));
  const perLabel = { week: 'this week', month: 'this month', all: 'all time' }[per], prevLabel = { week: 'last week', month: 'last month' }[per];

  const rows = people.map(u => {
    const mine = open.filter(t => (t.assignees || []).includes(u.id));
    return { u, open: mine.length, overdue: mine.filter(t => t.due && t.due < today).length, soon: mine.filter(t => t.due && t.due >= today && dayDiff(t.due) <= 7).length,
      urgent: mine.filter(t => t.priority === 'urgent' || t.priority === 'high').length, done: done.filter(t => (t.assignees || []).includes(u.id)).length,
      projects: new Set(mine.map(t => t.projectId).filter(Boolean)).size };
  }).sort((a, b) => b.open - a.open || b.overdue - a.overdue || a.u.name.localeCompare(b.u.name));
  const totalLoad = rows.reduce((s, r) => s + r.open, 0) || 0, avg = rows.length ? totalLoad / rows.length : 0;
  const pct = r => totalLoad ? Math.round(r.open / totalLoad * 100) : 0;
  const level = r => !r.open ? ['Free', 'gray'] : avg && r.open >= avg * 1.5 ? ['Heavy', 'red'] : avg && r.open <= avg * 0.5 ? ['Light', 'teal'] : ['Balanced', 'green'];

  const insights = [];
  const top = rows[0];
  if (top && top.open && rows.length > 1 && avg && top.open >= avg * 1.5) insights.push(['alert', 'orange', `<b>${esc(firstName(top.u.name))}</b> carries ${pct(top)}% of open work, ${(top.open / avg).toFixed(1)}× the team average. Consider moving some tasks.`]);
  const free = rows.filter(r => !r.open); if (free.length && open.length) insights.push(['person', 'teal', `${free.map(r => '<b>' + esc(firstName(r.u.name)) + '</b>').join(', ')} ${free.length === 1 ? 'has' : 'have'} no open tasks and can take on more.`]);
  if (overdue.length) { const byP = {}; overdue.forEach(t => { const k = t.projectId || ''; byP[k] = (byP[k] || 0) + 1; }); const worst = Object.keys(byP).sort((a, b) => byP[b] - byP[a])[0]; const wp = projById(worst);
    insights.push(['clock', 'red', `${overdue.length} ${overdue.length === 1 ? 'task is' : 'tasks are'} overdue${wp ? `, ${byP[worst]} in <b>${esc(wp.name)}</b>` : ''}.`]); }
  if (unassigned.length) insights.push(['personPlus', 'indigo', `${unassigned.length} open ${unassigned.length === 1 ? 'task has' : 'tasks have'} nobody assigned.`]);
  if (per !== 'all') { const d = done.length - donePrev.length; insights.push(['chart', d >= 0 ? 'green' : 'orange', `${done.length} ${done.length === 1 ? 'task' : 'tasks'} completed ${perLabel}, ${d === 0 ? 'the same as' : Math.abs(d) + (d > 0 ? ' more than' : ' fewer than')} ${prevLabel}.`]); }
  if (dated.length) insights.push(['done', onTime / dated.length >= .7 ? 'green' : 'orange', `${onTime} of ${dated.length} completed tasks with a due date (${Math.round(onTime / dated.length * 100)}%) were finished on time.`]);
  if (soon.length) insights.push(['cal', 'blue', `${soon.length} ${soon.length === 1 ? 'task is' : 'tasks are'} due in the next 7 days.`]);

  const stat = (n, label, color, sub = '') => `<div class="wl-stat"><span class="num tnum" data-count style="color:${cvar(color)}">${n}</span><span class="nm">${label}</span>${sub ? `<span class="ws">${sub}</span>` : ''}</div>`;
  const stageAgg = {}; open.filter(t => !t.parentId).forEach(t => { const s = stageOf(t); const k = s.l; (stageAgg[k] = stageAgg[k] || { n: 0, c: s.c }).n++; });
  const stageMax = Math.max(1, ...Object.values(stageAgg).map(x => x.n));
  const segs = rows.filter(r => r.open);

  return `<div style="display:flex;align-items:flex-end;gap:8px"><h1 class="large-title" style="flex:1;min-width:0">Workload</h1></div>
    <p class="lt-sub">How open work is shared across ${people.length} ${people.length === 1 ? 'person' : 'people'}${teams.length > 1 ? ' in ' + teams.length + ' teams' : ''}.</p>${scopePill()}
    <div class="ctl-row"><div class="seg" id="seg-wl">${[['week', 'This Week'], ['month', 'This Month'], ['all', 'All Time']].map(([k, l]) => `<button class="${per === k ? 'on' : ''}" data-act="wlPeriod" data-p="${k}">${l}</button>`).join('')}</div>${teams.length > 1 || S.teamProp !== 'all' || S.teamDept !== 'all' ? filterPills() : ''}</div>
    <div class="wl-stats">${stat(open.length, 'Open tasks', 'blue', soon.length + ' due in 7 days')}${stat(overdue.length, 'Overdue', overdue.length ? 'red' : 'gray', open.length ? Math.round(overdue.length / open.length * 100) + '% of open' : '')}
      ${stat(done.length, 'Completed', 'green', per === 'all' ? 'all time' : perLabel + (per !== 'all' ? ' · ' + donePrev.length + ' ' + prevLabel : ''))}${stat(projs.length, 'Active projects', 'indigo', unassigned.length + ' unassigned tasks')}</div>
    <div class="section-title">Share of Open Work</div>
    <div class="card wl-dist">${segs.length ? `<div class="wl-bar">${segs.map(r => `<i style="width:${r.open / totalLoad * 100}%;background:${cvar(r.u.avatarColor || 'gray')}" title="${esc(r.u.name)} · ${pct(r)}%"></i>`).join('')}</div>
      <div class="wl-legend">${segs.map(r => `<span><span class="dot" style="background:${cvar(r.u.avatarColor || 'gray')}"></span>${esc(firstName(r.u.name))} <b class="tnum">${pct(r)}%</b></span>`).join('')}</div>`
      : `<p class="sub" style="margin:0">No open tasks are assigned yet.</p>`}</div>
    ${insights.length ? `<div class="section-title">Insights</div><div class="menu">${insights.map(([i, c, h]) => `<div class="li wl-ins" style="--inset:58px"><span class="ico" style="background:${cvar(c)};border-radius:50%">${ic(i)}</span><span class="lbl">${h}</span></div>`).join('')}</div>` : ''}
    <div class="section-title">People <span class="n tnum">${rows.length}</span><span class="sp"></span><span class="wl-key"><i style="background:var(--red)"></i>Overdue<i style="background:var(--orange)"></i>Due in 7 days<i style="background:var(--accent)"></i>Later</span></div>
    <div class="menu">${rows.length ? rows.map(r => { const [lv, lc] = level(r); const later = r.open - r.overdue - r.soon; const w = totalLoad ? Math.max(r.open ? 6 : 0, r.open / (rows[0].open || 1) * 100) : 0;
      return `<button class="li wl-row" data-act="openUser" data-id="${r.u.id}" style="--inset:72px">${av(r.u, 'lg')}<div class="lbl">
        <div class="wl-top"><b>${esc(r.u.name)}</b><span class="chip" style="background:color-mix(in srgb,${cvar(lc)} 15%,transparent);color:${cvar(lc)}">${lv}</span><span class="sp"></span><span class="wl-pct tnum">${pct(r)}%</span></div>
        <div class="wl-track"><div style="width:${w}%">${r.overdue ? `<i style="flex:${r.overdue};background:var(--red)"></i>` : ''}${r.soon ? `<i style="flex:${r.soon};background:var(--orange)"></i>` : ''}${later > 0 ? `<i style="flex:${later};background:var(--accent)"></i>` : ''}</div></div>
        <div class="wl-meta tnum"><span><b>${r.open}</b> open</span>${r.overdue ? `<span style="color:var(--red)"><b>${r.overdue}</b> overdue</span>` : ''}${r.urgent ? `<span><b>${r.urgent}</b> high priority</span>` : ''}<span><b>${r.done}</b> done ${perLabel}</span><span><b>${r.projects}</b> ${r.projects === 1 ? 'project' : 'projects'}</span></div>
      </div></button>`; }).join('') : emptyState('people', 'gray', 'Nobody here', 'No one matches these filters.')}</div>
    ${Object.keys(stageAgg).length ? `<div class="section-title">Open Tasks by Stage</div><div class="card wl-stages">${Object.entries(stageAgg).sort((a, b) => b[1].n - a[1].n).map(([k, v]) => `<div class="wl-sg"><span class="nm"><span class="dot" style="background:${cvar(v.c)}"></span>${esc(k)}</span><span class="wl-sgbar"><i style="width:${v.n / stageMax * 100}%;background:${cvar(v.c)}"></i></span><b class="tnum">${v.n}</b></div>`).join('')}</div>` : ''}
    ${projs.length ? `<div class="section-title">Projects <span class="n tnum">${projs.length}</span></div><div class="menu">${projs.map(p => { const pr = progress(p.id); const po = topTasks(p.id).filter(t => !isDone(t)); const pov = po.filter(t => t.due && t.due < today).length; return { p, pr, po, pov }; })
      .sort((a, b) => b.pov - a.pov || a.pr.pct - b.pr.pct).map(({ p, pr, po, pov }) => `<button class="li wl-proj" data-act="openProject" data-id="${p.id}" style="--inset:44px">${pdot(p)}<div class="lbl"><div class="wl-top"><b>${esc(p.name)}</b>${pov ? `<span class="chip" style="background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)">${pov} overdue</span>` : ''}<span class="sp"></span><span class="wl-pct tnum">${pr.pct}%</span></div>
        <div class="bar" style="margin:6px 0 4px"><i style="width:${pr.pct}%;background:${cvar(p.color)}"></i></div><div class="wl-meta tnum"><span><b>${pr.done}</b> of ${pr.total} done</span><span><b>${po.length}</b> open</span>${p.due ? `<span>Due ${fmtDay(p.due)}</span>` : ''}</div></div>${avs([...new Set(po.flatMap(t => t.assignees || []))], 4)}</button>`).join('')}</div>` : ''}`;
}

function actRow(a) {
  const u = userById(a.userId), forMe = (a.targets || []).includes(me().id);
  const pj = projById(actProject(a)), d = new Date(a.createdAt), today = localDay(a.createdAt) === todayStr();

  return `<button class="act ${forMe ? 'me' : ''}" data-act="openActivity" data-id="${a.id}">${av(u)}<div class="tx"><b>${esc(u ? u.name : 'Someone')}</b> ${esc(a.text)}${pj && a.type !== 'project' ? `<div class="act-p">${pdot(pj)}${esc(pj.name)}</div>` : ''}</div><time>${when}</time></button>`;
}
function activityHtml() {
  const all = D().activity.filter(a => S.scope === 'all' || inScope(a.teamId) || (taskById(a.refId) && taskInScope(taskById(a.refId))));
  const base = S.actTab === 'me' ? all.filter(a => (a.targets || []).includes(me().id)) : all;
  const from = S.actDate === 'all' ? '' : (() => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ({ today: 0, week: 6, month: 29 }[S.actDate] || 0)); return d.toISOString(); })();
  const list = base.filter(a => (S.actWho === 'all' || a.userId === S.actWho) && (S.actProj === 'all' || actProject(a) === S.actProj) && (!from || a.createdAt >= from))
    .sort((a, b) => b.createdAt < a.createdAt ? -1 : 1);
  const groups = []; list.forEach(a => { const k = localDay(a.createdAt); const g = groups[groups.length - 1]; if (g && g[0] === k) g[1].push(a); else groups.push([k, [a]]); });
  const dayLabel = k => { const n = dayDiff(k); return n === 0 ? 'Today' : n === -1 ? 'Yesterday' : (() => { const d = parseDay(k); return DAYS[d.getDay()].slice(0, 3) + ', ' + d.getDate() + ' ' + MON[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); })(); };
  const filtered = S.actWho !== 'all' || S.actProj !== 'all' || S.actDate !== 'all';
  const who = userById(S.actWho), pj = projById(S.actProj);
  return `<h1 class="large-title">Activity</h1><p class="lt-sub">Assignments, comments, files and approvals.</p>
    <div class="ctl-row"><div class="seg" id="seg-act"><button class="${S.actTab === 'me' ? 'on' : ''}" data-act="actTab" data-t="me">For Me</button><button class="${S.actTab === 'all' ? 'on' : ''}" data-act="actTab" data-t="all">Everything</button></div>
      <div class="filters">${filtered ? '<button class="link" data-act="actFilter" data-k="clear" style="font-size:15px">Clear</button>' : ''}
        <button class="pill flt ${S.actWho !== 'all' ? 'on' : ''}" data-act="actFilter" data-k="who">${ic('person', 's')}${esc(who ? who.name : 'Everyone')}${ic('chevD', 'xs')}</button>
        <button class="pill flt ${S.actProj !== 'all' ? 'on' : ''}" data-act="actFilter" data-k="proj">${ic('folder', 's')}${esc(pj ? pj.name : 'All Projects')}${ic('chevD', 'xs')}</button>
        <button class="pill flt ${S.actDate !== 'all' ? 'on' : ''}" data-act="actFilter" data-k="date">${ic('cal', 's')}${esc(ACT_DATES[S.actDate])}${ic('chevD', 'xs')}</button></div></div>
    ${groups.length ? groups.map(([k, l]) => `<div class="section-title">${esc(dayLabel(k))} <span class="n tnum">${l.length}</span></div><div class="menu">${l.map(actRow).join('')}</div>`).join('')
      : `<div class="menu" style="margin-top:14px">${emptyState('bell', 'gray', 'No activity', filtered ? 'Nothing matches these filters.' : S.actTab === 'me' ? 'When someone assigns you a task or comments on yours, it shows here.' : 'Team updates will show here.')}</div>`}`;
}
const ACT_DATES = { all: 'All Time', today: 'Today', week: 'Last 7 Days', month: 'Last 30 Days' };
function actProject(a) { if (a.type === 'project') return a.refId; const t = taskById(a.refId); return t ? t.projectId || '' : ''; }
function localDay(iso) { const d = new Date(iso); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function searchHtml() {
  return `<h1 class="large-title">Search</h1>
    <label class="search" style="height:44px;width:100%;margin:6px 0 4px">${ic('search', 's')}<input id="q2" type="search" placeholder="Tasks, projects, people" value="${esc(S.q)}" data-input="search2" aria-label="Search"></label>
    <div id="results">${S.q ? searchResultsHtml(S.q, true) : `<p class="lt-sub" style="margin-top:12px">Search task titles, notes, projects and people.</p>`}</div>`;
}
function searchResultsHtml(q, inner) {
  const s = q.toLowerCase();
  const tasks = D().tasks.filter(t => taskInScope(t) && ((t.title || '').toLowerCase().includes(s) || (t.notes || '').toLowerCase().includes(s))).slice(0, 40);
  const projs = D().projects.filter(p => projInScope(p) && p.name.toLowerCase().includes(s));
  const people = D().users.filter(u => visibleUser(u) && userInScope(u) && u.status === 'active' && (u.name.toLowerCase().includes(s) || (u.jobTitle || '').toLowerCase().includes(s)));
  const none = !tasks.length && !projs.length && !people.length;

(function dragDown() {

/* ---------------- images: shrink on this device before saving ---------------- */
function readImage(file, { max = 256, square = false, keepAlpha = false, limit = 45000 } = {}) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('Choose an image file (JPG, PNG or WebP).'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
      if (square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; w = h = m; }
      const k = Math.min(1, max / Math.max(w, h)), cw = Math.round(w * k), chh = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = cw; c.height = chh;
      const x = c.getContext('2d');
      if (!keepAlpha) { x.fillStyle = '#fff'; x.fillRect(0, 0, cw, chh); }
      x.imageSmoothingQuality = 'high'; x.drawImage(img, sx, sy, sw, sh, 0, 0, cw, chh);
      let out = keepAlpha ? c.toDataURL('image/png') : '';
      if (!out || out.length > limit) out = c.toDataURL('image/webp', 0.86);
      if (!/^data:image\/webp/.test(out) || out.length > limit) { if (keepAlpha) { x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, cw, chh); } out = c.toDataURL('image/jpeg', 0.84); }
      for (let q = 0.75; out.length > limit && q > 0.3; q -= 0.12) out = c.toDataURL('image/jpeg', q);
      if (out.length > limit) return rej(new Error('That image is too detailed. Try a simpler one.'));
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That image couldn’t be opened.')); };
    img.src = url;
  });
}
function pickImage(opts) {
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => { const f = inp.files[0]; if (!f) return res(null); try { res(await readImage(f, opts)); } catch (e) { toast(e.message, true); res(null); } };
    inp.click();
  });
}

  async upload(el) {
    const files = [...el.files]; el.value = '';
    const limit = API.live ? 10 * 1048576 : 1.5 * 1048576, taskId = el.dataset.id;
    for (const f of files) {
      if (f.size > limit) { toast(`${f.name} is larger than ${API.live ? '10 MB' : '1.5 MB (demo limit)'}.`, true); continue; }
      const t = taskById(taskId); if (!t) return;
      const tmp = { id: uidC('f'), name: f.name, size: f.size, uploading: true };
      t.attachments = (t.attachments || []).concat([tmp]); renderInsp();
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
      try {
        if (Outbox.q.length) { await Outbox.flush(); }
        const att = await API.call('upload', { taskId, name: f.name, type: f.type, size: f.size, data });
        const t2 = taskById(taskId); if (t2) t2.attachments = (t2.attachments || []).filter(a => a.id !== tmp.id).concat([att]);
        toast('Uploaded ' + f.name);
      } catch (e) {
        const t2 = taskById(taskId); if (t2) t2.attachments = (t2.attachments || []).filter(a => a.id !== tmp.id);

      }
      renderInsp(); render({ soft: true });
    }

  projMenu(el) {

  openUser(el) { const u = userById(el.dataset.id); if (u) userDialog(u, false); },

  async resetDemo() { if (!await confirmBox({ title: 'Reset demo data?', msg: 'All demo projects and changes on this device go back to the starting example.', ok: 'Reset', danger: true })) return; LocalDB.reset(); store.del('orbit_photos'); for (const k in PH) delete PH[k]; signedOut('Demo data reset. Sign in again.'); },
  async signOut() {

function addMemberDialog() {
  const teams = isAdminU() ? D().teams : D().teams.filter(t => t.id === me().teamId);
  const roles = isAdminU() ? ['member', 'head', 'admin'] : ['member', 'head'];
  const defTeam = isAdminU() && S.scope !== 'all' ? S.scope : me().teamId;
  let photo = '';
  openDialog({ title: 'Add Member', ok: 'Add', body: `
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 16px">
      <button class="photo-pick" id="am-photo" aria-label="Add photo"><span class="av xl" style="background:var(--fill)">${ic('camera', 'l')}</span><span class="edit">${ic('plus')}</span></button>
      <span class="sub" style="font-size:13px">Photo (optional)</span></div>
    <label class="field"><span>Full name</span><input class="input" id="am-name" placeholder="e.g. Maria Santos" autocomplete="off" autofocus></label>
    <label class="field"><span>Job title</span><input class="input" id="am-job" placeholder="e.g. Graphic Designer" autocomplete="off"></label>
    <label class="field"><span>Username</span><input class="input" id="am-user" placeholder="e.g. maria" autocapitalize="none" autocomplete="off"></label>
    <label class="field"><span>4-digit PIN</span><input class="input" id="am-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="They can change it later"></label>
    <div class="menu" style="margin-top:6px"><div class="li"><span class="ico" style="background:var(--indigo)">${ic('people')}</span><span class="lbl">Team</span>
      <select class="sel" id="am-team" aria-label="Team">${teams.map(t => `<option value="${t.id}" ${t.id === defTeam ? 'selected' : ''}>${esc(teamLabel(t))}</option>`).join('')}</select></div></div>
    <div class="section-title">Role</div><div class="seg" id="am-role" style="display:flex">${roles.map(r => `<button data-role="${r}" class="${r === 'member' ? 'on' : ''}" style="flex:1">${ROLE[r]}</button>`).join('')}</div>
    <p class="section-foot">They can sign in straight away with property code, username and this PIN. Share the PIN with them privately.</p>`,
    onOpen: root => {
      $$('[data-role]', root).forEach(b => b.onclick = () => { $$('[data-role]', root).forEach(x => x.classList.remove('on')); b.classList.add('on'); Motion.haptic(); });
      const nm = $('#am-name', root), us = $('#am-user', root);
      nm.oninput = () => { if (!us.dataset.touched) us.value = firstName(nm.value).toLowerCase().replace(/[^a-z0-9._-]/g, ''); };
      us.oninput = () => { us.dataset.touched = '1'; };
      $('#am-photo', root).onclick = async () => { const d = await pickImage({ max: 256, square: true }); if (!d) return; photo = d; $('#am-photo .av', root).outerHTML = `<span class="av xl"><img src="${d}" alt=""></span>`; };
    },
    onOk: async root => {
      const user = { name: $('#am-name', root).value.trim(), jobTitle: $('#am-job', root).value.trim(), username: $('#am-user', root).value.trim().toLowerCase(),
        pin: $('#am-pin', root).value, teamId: $('#am-team', root).value, role: ($('#am-role .on', root) || {}).dataset ? $('#am-role .on', root).dataset.role : 'member', photo };
      const nu = await run('addUser', { user }, user.name + ' added');
      if (photo) { PH[nu.id] = { v: nu.photoV, data: photo }; store.set('orbit_photos', PH); }
      await sync({ force: true });
    } });
}

function swatchesHtml(sel, name) {
  const custom = sel && sel[0] === '#';
  return `<div class="swatches" data-sw-group="${name}">${PCOLORS.map(c => `<button type="button" data-sw="${c}" class="${sel === c ? 'on' : ''}" style="background:${cvar(c)}" aria-label="${c}"></button>`).join('')}
    <label class="${custom ? 'on' : ''}" title="Custom colour" style="${custom ? 'background:' + sel : ''}"><input type="color" value="${custom ? sel : '#1e3a8a'}" aria-label="Custom colour"></label></div>`;
}
function wireSwatches(root, onPick) {
  const box = $('[data-sw-group]', root);
  $$('[data-sw]', box).forEach(b => b.onclick = () => { $$('.on', box).forEach(x => x.classList.remove('on')); b.classList.add('on'); Motion.haptic(); onPick(b.dataset.sw); });
  const lab = $('label', box), inp = $('input', lab);
  inp.oninput = () => { $$('.on', box).forEach(x => x.classList.remove('on')); lab.classList.add('on'); lab.style.background = inp.value; onPick(inp.value); };
}

function projectDialog(p) {
  const isNew = !p; p = p || { name: '', description: '', color: 'blue', status: 'on_track', due: '' };
  const teams = D().teams;
  let color = p.color || 'blue';
  openDialog({ title: isNew ? 'New Project' : 'Edit Project', ok: isNew ? 'Create' : 'Save', body: `
    <div style="display:flex;flex-direction:column;gap:10px"><input class="input" id="pj-name" placeholder="Project name" value="${esc(p.name)}" autofocus aria-label="Project name">
    <textarea class="input" id="pj-desc" placeholder="What is this project about?" style="min-height:76px" aria-label="Description">${esc(p.description || '')}</textarea></div>
    <div class="section-title">Colour</div>
    <div class="menu">${swatchesHtml(color, 'pj')}</div>
    <div class="section-title">Details</div>
    <div class="menu">
      ${isNew && multiScope() ? `<div class="li"><span class="ico" style="background:var(--indigo)">${ic('people')}</span><span class="lbl">Team</span><select class="sel" id="pj-team" aria-label="Team">${teams.filter(t => myTeamIds().includes(t.id)).map(t => `<option value="${t.id}" ${t.id === scopeTeamId() ? 'selected' : ''}>${esc(teamLabel(t))}</option>`).join('')}</select></div>` : ''}
      <div class="li"><span class="ico" style="background:var(--green)">${ic('flag')}</span><span class="lbl">Status</span><select class="sel" id="pj-status" aria-label="Status">${Object.keys(PSTATUS).map(k => `<option value="${k}" ${p.status === k ? 'selected' : ''}>${PSTATUS[k].l}</option>`).join('')}</select></div>
      <div class="li"><span class="ico" style="background:var(--red)">${ic('cal')}</span><span class="lbl">Deadline</span><input type="date" class="date" id="pj-due" value="${esc(p.due || '')}" aria-label="Deadline"></div>
    </div>
    <div id="pj-share-box"></div>
    <div class="section-title">Who Can See and Manage</div>
    <div class="seg" id="pj-acc" style="display:flex"><button data-acc="team" class="${p.access === 'private' ? '' : 'on'}" style="flex:1">Everyone in the team</button><button data-acc="private" class="${p.access === 'private' ? 'on' : ''}" style="flex:1">Only people I choose</button></div>
    <p class="section-foot" id="pj-acc-note"></p>
    <div class="menu" id="pj-people" style="margin-top:10px"></div>`,
    onOpen: root => {
      wireSwatches(root, c => { color = c; });
      const homeTeam = () => teamById(isNew ? ($('#pj-team', root) ? $('#pj-team', root).value : scopeTeamId()) : p.teamId);
      const draw = () => {
        const ht = homeTeam(); if (!ht) return;
        const cur = Array.from(root.querySelectorAll('[data-share]:checked')).map(x => $('#pj-st-' + x.dataset.share, root).value);
        const pre = cur.length || root.dataset.drawn ? cur : (p.shareTeams || []);
        // people only see the properties they belong to (plus any the project is already shared with)
        const myProps = userTeamsC(me()).map(id => (teamById(id) || {}).propertyCode);
        const teams = isAdminU() ? D().teams : D().teams.filter(t => myProps.includes(t.propertyCode) || (p.shareTeams || []).includes(t.id));
        $('#pj-share-box', root).innerHTML = shareRowsHtml('pj', ht, pre, teams);
        wireShareRows(root, 'pj'); root.dataset.drawn = '1';
      };
      draw(); const sel = $('#pj-team', root); if (sel) sel.onchange = () => { root.dataset.drawn = ''; $('#pj-share-box', root).innerHTML = ''; draw(); drawPeople(); };
      /* People: owner is fixed; others can be Manager, or (when limited) Can view. */
      const owner = isNew ? me() : userById(p.createdBy);
      const roleOf = {}; (p.members || []).forEach(id => roleOf[id] = 'view'); (p.managers || []).forEach(id => roleOf[id] = 'manage');
      root._acc = p.access === 'private' ? 'private' : 'team'; root._roles = roleOf;
      const drawPeople = () => {
        const ht = homeTeam(); if (!ht) return;
        const teams = [ht.id, ...readShareRows(root, 'pj')];
        const priv = root._acc === 'private';
        const cands = peopleFor(teams).filter(u => !owner || u.id !== owner.id);
        $('#pj-acc-note', root).textContent = priv ? 'Only the owner and the people marked Can view or Manager see this project. Department heads of the team can still manage it.'
          : 'Everyone in the chosen teams can see it and work on tasks. Managers can also edit the project, its stages, archive and delete it.';
        const label = r => r === 'manage' ? 'Manager' : r === 'view' ? 'Can view' : (priv ? 'No access' : 'Member');
        $('#pj-people', root).innerHTML = (owner ? `<div class="li" style="--inset:58px">${av(owner)}<span class="lbl"><div style="font-weight:600">${esc(owner.name)}</div><div class="sub" style="font-size:13px">${esc(owner.jobTitle || '')}</div></span><span class="chip role-head">Owner</span></div>` : '')
          + cands.map(u => { const r = root._roles[u.id] || 'none'; const shown = !priv && r === 'view' ? 'none' : r;
            return `<button class="li" data-person="${u.id}" style="--inset:58px">${av(u)}<span class="lbl"><div style="font-weight:600">${esc(u.name)}</div><div class="sub" style="font-size:13px">${esc(u.jobTitle || '')}</div></span><span class="chip ${shown === 'manage' ? 'role-head' : shown === 'view' ? 'role-admin' : 'role-member'}">${label(shown)}</span>${ic('updown', 's')}</button>`; }).join('');
        $$('[data-person]', root).forEach(b => b.onclick = () => {
          const id = b.dataset.person, cur = root._roles[id] || 'none';
          const cycle = priv ? { none: 'view', view: 'manage', manage: 'none' } : { none: 'manage', view: 'manage', manage: 'none' };
          root._roles[id] = cycle[cur]; Motion.haptic(); drawPeople();
        });
      };
      $$('[data-acc]', root).forEach(b => b.onclick = () => { $$('[data-acc]', root).forEach(x => x.classList.toggle('on', x === b)); root._acc = b.dataset.acc; Motion.haptic(); drawPeople(); });
      $('#pj-share-box', root).addEventListener('change', drawPeople);
      drawPeople();
    },
    onOk: root => {
      const name = $('#pj-name', root).value.trim(); if (!name) { toast('Give the project a name.', true); return false; }
      const obj = Object.assign({}, isNew ? {} : p, { name, description: $('#pj-desc', root).value, color, status: $('#pj-status', root).value, due: $('#pj-due', root).value });
      if (isNew) { obj.id = uidC('p'); obj.teamId = $('#pj-team', root) ? $('#pj-team', root).value : scopeTeamId(); }
      obj.shareTeams = readShareRows(root, 'pj');
      obj.access = root._acc;
      obj.managers = Object.keys(root._roles).filter(id => root._roles[id] === 'manage');
      obj.members = root._acc === 'private' ? Object.keys(root._roles).filter(id => root._roles[id] === 'view' || root._roles[id] === 'manage') : [];
      op({ action: 'saveProject', project: obj });
      if (isNew) nav(() => { S.view = 'project'; S.projectId = obj.id; }, 'push'); else render();
      toast(isNew ? 'Project created' : 'Project saved');
    } });
}

/* "Also at other properties" rows: a switch per property, and which team there. Used for shared projects and cluster colleagues. */
function shareRowsHtml(k, home, selected, teams, forUser) {
  const props = D().properties.filter(p => p.code !== home.propertyCode && teams.some(t => t.propertyCode === p.code));
  if (!props.length) return '';
  return `<div class="section-title">${forUser ? 'Cluster Access' : 'Visible at Other Properties'}</div><div class="menu">${props.map(p => {
    const ts = teams.filter(t => t.propertyCode === p.code);
    const on = ts.find(t => selected.includes(t.id));
    const def = on || ts.find(t => t.name.toLowerCase() === home.name.toLowerCase()) || ts[0];
    return `<div class="li share-row" style="--inset:62px">${plogo(p)}<span class="lbl"><div style="font-weight:600">${esc(p.code)}</div>
      <select class="sel share-team" id="${k}-st-${p.code}" ${on ? '' : 'hidden'} aria-label="Team at ${esc(p.code)}" style="text-align:left;text-align-last:left;max-width:100%;font-size:14px">${ts.map(t => `<option value="${t.id}" ${t.id === def.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
      <div class="sub share-off" style="font-size:13px" ${on ? 'hidden' : ''}>${esc(p.name)}</div></span>
      <label class="switch"><input type="checkbox" data-share="${p.code}" ${on ? 'checked' : ''} aria-label="${forUser ? 'Give access to' : 'Show at'} ${esc(p.code)}"><span></span></label></div>`;
  }).join('')}</div><p class="section-foot">${forUser ? 'Cluster colleagues see the projects and tasks of every team they belong to. Switch on a property and choose their team there.' : 'Everyone in the chosen team at that property can see and work on this project.'}</p>`;
}
function wireShareRows(root, k) {
  $$('[data-share]', root).forEach(x => x.onchange = () => {
    const row = x.closest('.share-row'); $('.share-team', row).hidden = !x.checked; $('.share-off', row).hidden = x.checked; Motion.haptic();
  });
}

/* Turn a project's Done column on or off from the project menu (same rules as the stage editor). */
function setDoneColumn(p, on) {

    else list = list.filter(s => s.id !== 'done');

}

/* Stages editor: main admin and department heads add, rename, recolour and reorder a project's stages. Done stays last. */
function stagesDialog(p, task) {
  if (!p && !task) return;
  let list = (task ? stagesOf({ stages: task.subStages }) : stageList(p)).map(s => Object.assign({}, s));
  let useDone = hasDoneStage(list), doneAs = '';
  const newId = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const counts = id => D().tasks.filter(t => (task ? t.parentId === task.id : t.projectId === p.id && !t.parentId) && t.status === id).length;
  const row = (s, i) => {
    const done = s.id === 'done', last = list.length - (useDone ? 2 : 1);
    return `<div class="li stg" style="--inset:58px"><button class="stg-c" data-sc="${i}" style="background:${cvar(s.color)}" aria-label="Change colour of ${esc(s.name)}"></button>
      <input class="stg-n" data-sn="${i}" value="${esc(s.name)}" maxlength="30" aria-label="Stage name">
      <span class="sub tnum" style="font-size:13px">${counts(s.id) || ''}</span>
      ${done ? '<span class="sub" style="font-size:13px;width:110px;text-align:right">Always last</span>' : `<button class="circle sm" data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${ic('chevU', 's')}</button>
      <button class="circle sm" data-dn="${i}" ${i >= last ? 'disabled' : ''} aria-label="Move down">${ic('chevD', 's')}</button>
      <button class="circle sm" data-del="${i}" ${list.length <= (useDone ? 2 : 1) ? 'disabled' : ''} aria-label="Delete ${esc(s.name)}" style="color:var(--red)">${ic('trash', 's')}</button>`}</div>`;
  };
  const draw = root => {
    $('#stg-list', root).innerHTML = list.map(row).join('') + `<div class="addrow" style="--inset:58px">${ic('plus')}<input id="stg-add" placeholder="Add a stage, e.g. Waiting for Approval" maxlength="30" aria-label="New stage name"></div>`;
    $$('[data-sn]', root).forEach(x => x.oninput = () => { list[+x.dataset.sn].name = x.value; });
    $$('[data-sc]', root).forEach(x => x.onclick = () => { const s = list[+x.dataset.sc]; s.color = PCOLORS[(PCOLORS.indexOf(s.color) + 1) % PCOLORS.length]; x.style.background = cvar(s.color); Motion.haptic(); });
    $$('[data-up]', root).forEach(x => x.onclick = () => { const i = +x.dataset.up; [list[i - 1], list[i]] = [list[i], list[i - 1]]; draw(root); });
    $$('[data-dn]', root).forEach(x => x.onclick = () => { const i = +x.dataset.dn; [list[i + 1], list[i]] = [list[i], list[i + 1]]; draw(root); });
    $$('[data-del]', root).forEach(x => x.onclick = async () => {
      const i = +x.dataset.del, s = list[i], n = counts(s.id);
      if (n && !await confirmBox({ title: 'Delete “' + s.name + '”?', msg: n + (n === 1 ? ' task moves' : ' tasks move') + ' to “' + list.filter(x => x !== s)[0].name + '”.', ok: 'Delete', danger: true })) return;
      list.splice(i, 1); draw(root);
    });
    const add = $('#stg-add', root);
    const sw = $('#stg-done', root); sw.checked = useDone;
    $('#stg-done-foot', root).textContent = useDone ? 'Completing a task moves it into the last column, ' + (list.find(s => s.id === 'done') || {}).name + '.' : 'Completing a task ticks it and keeps it in its own stage. Use this when stages are outlets, places or groups rather than steps.';
    sw.onchange = () => {
      Motion.haptic(); useDone = sw.checked;
      if (!useDone) {
        const d = list.find(s => s.id === 'done');
        // a Done column renamed into something real (an outlet, say) stays as an ordinary stage
        if (d && !/^(done|completed?|finished|closed)$/i.test(d.name.trim())) { d.id = doneAs = newId(); } else { list = list.filter(s => s.id !== 'done'); doneAs = ''; }
      } else { if (!hasDoneStage(list)) list.push({ id: 'done', name: 'Done', color: 'green' }); doneAs = ''; }
      draw(root);
    };
    add.onkeydown = e => { if (e.key !== 'Enter' || !add.value.trim()) return; e.preventDefault();
      list.splice(useDone ? list.length - 1 : list.length, 0, { id: newId(), name: add.value.trim(), color: PCOLORS[(list.length * 3) % PCOLORS.length] });
      draw(root); setTimeout(() => $('#stg-add', root).focus(), 0); };
  };
  openDialog({ title: task ? 'Subtask Stages' : 'Stages', ok: 'Save', body: `<p class="lt-sub" style="margin:4px 4px 12px">${esc(task ? 'Subtasks of “' + task.title + '”' : p.name)} · tap a dot to change its colour.</p><div class="menu" id="stg-list"></div>
    <div class="menu" style="margin-top:18px"><label class="li" style="--inset:16px"><span class="lbl">Done column</span><span class="switch"><input type="checkbox" id="stg-done" aria-label="Move completed tasks into a Done column"><span></span></span></label></div>
    <p class="section-foot" id="stg-done-foot"></p>
    <p class="section-foot">${task ? 'These stages apply only to this task’s subtasks. ' : ''}Every ${task ? 'task' : 'project'} starts with To Do, In Progress, In Review, Follow Up and Done.</p>`,
    onOpen: draw,
    onOk: root => {
      const pending = $('#stg-add', root).value.trim();
      if (pending) list.splice(useDone ? list.length - 1 : list.length, 0, { id: newId(), name: pending, color: 'teal' });
      list = list.map(s => Object.assign({}, s, { name: s.name.trim() })).filter(s => s.name);
      if (list.filter(s => s.id !== 'done').length < 1) { toast(useDone ? 'Keep at least one stage before Done.' : 'Add at least one stage.', true); return false; }
      const extra = useDone ? {} : { noDone: true, doneAs };
      if (task) op(Object.assign({ action: 'saveStages', taskId: task.id, stages: list }, extra)); else op(Object.assign({ action: 'saveStages', projectId: p.id, stages: list }, extra));
      render(); toast('Stages saved');
    } });
}

/* Repeat editor: how often, and on which weekdays or day of the month. */
const FREQ = [['', 'Never'], ['daily', 'Daily'], ['weekdays', 'Weekdays'], ['weekly', 'Weekly'], ['biweekly', 'Every 2 weeks'], ['monthly', 'Monthly'], ['quarterly', 'Every 3 months'], ['yearly', 'Yearly']];
function repeatEditorHtml(k, rep, on, due) {
  return `<div class="rep-ed" id="${k}-rep" data-rep="${esc(rep)}" data-on="${esc(on)}">
    <div class="rchips">${FREQ.map(([v, l]) => `<button type="button" class="rchip ${rep === v ? 'on' : ''}" data-freq="${v}">${l}</button>`).join('')}</div>
    <div class="rep-days" hidden><div class="rep-h">On these days</div><div class="dchips">${[1, 2, 3, 4, 5, 6, 0].map(d => `<button type="button" class="dchip" data-day="${d}">${DAYS[d].slice(0, 2)}</button>`).join('')}</div></div>
    <div class="rep-dom" hidden><div class="rep-h">On this day of the month</div><div class="domgrid">${Array.from({ length: 31 }, (_, i) => `<button type="button" class="dom" data-dom="${i + 1}">${i + 1}</button>`).join('')}<button type="button" class="dom last" data-dom="last">Last day</button></div></div>
    <p class="section-foot rep-sum"></p></div>`;
}
function readRepeat(root, k) { const b = $('#' + k + '-rep', root); return { repeat: b.dataset.rep || '', on: b.dataset.on || '' }; }
function wireRepeatEditor(root, k, due, getDue) {
  const b = $('#' + k + '-rep', root);
  const anchor = () => { const d = (getDue && getDue()) || due; return d ? parseDay(d) : new Date(); };
  const draw = () => {
    const r = b.dataset.rep, on = b.dataset.on;
    $$('[data-freq]', b).forEach(x => x.classList.toggle('on', x.dataset.freq === r));
    const wk = r === 'weekly' || r === 'biweekly', mo = r === 'monthly' || r === 'quarterly';
    $('.rep-days', b).hidden = !wk; $('.rep-dom', b).hidden = !mo;
    const days = wk ? on.split(',').filter(Boolean) : [];
    $$('[data-day]', b).forEach(x => x.classList.toggle('on', days.includes(x.dataset.day)));
    $$('[data-dom]', b).forEach(x => x.classList.toggle('on', mo && x.dataset.dom === on));
    const d = (getDue && getDue()) || due;
    $('.rep-sum', b).textContent = !r ? 'This is a one-time task.' : repeatLabel(r, on) + '. ' + (d ? 'After ' + fmtDay(d) + ', the next one is due ' + fmtDay(nextDue(d, r, todayStr(), on)) + '.' : 'First one is due ' + fmtDay(firstDue(r, todayStr(), on)) + '.');
  };
  $$('[data-freq]', b).forEach(x => x.onclick = () => {
    const r = x.dataset.freq, a = anchor(); b.dataset.rep = r;
    b.dataset.on = r === 'weekly' || r === 'biweekly' ? String(a.getDay()) : r === 'monthly' || r === 'quarterly' ? String(a.getDate()) : '';
    Motion.haptic(); draw();
  });
  $$('[data-day]', b).forEach(x => x.onclick = () => {
    const set = new Set(b.dataset.on.split(',').filter(Boolean)); const d = x.dataset.day;
    if (set.has(d)) { if (set.size > 1) set.delete(d); } else set.add(d);
    b.dataset.on = [...set].join(','); Motion.haptic(); draw();
  });
  $$('[data-dom]', b).forEach(x => x.onclick = () => { b.dataset.on = x.dataset.dom; Motion.haptic(); draw(); });
  const dueInp = root.querySelector('#nt-due'); if (dueInp && getDue) dueInp.addEventListener('change', draw);
  draw();
}

    onOk: async root => {
      const name = $('#pf-name', root).value.trim(); if (name.length < 2) { toast('Enter your full name.', true); return false; }
      const profile = { name, jobTitle: $('#pf-job', root).value.trim() }; if (photo !== undefined) profile.photo = photo;
      const nu = $('#pf-user', root).value.trim().toLowerCase();
      if (nu !== m.username) {
        if (!/^[a-z0-9._-]{3,20}$/.test(nu)) { toast('Usernames are 3–20 letters, numbers, dots or dashes.', true); return false; }
        const pin = $('#pf-pin', root).value; if (pin.length !== 4) { toast('Enter your current PIN to change your username.', true); return false; }
        await Outbox.flush();
        const res = await run('updateProfile', { profile: Object.assign({}, profile, { username: nu, pin }) });
        if (photo) keepPhotoFor(res, photo);
        S.data.me = Object.assign({}, me(), res); upsert('users', Object.assign({}, userById(res.id) || {}, res));
        Session.set(Session.token, S.data.me); rememberMe(); render();
        toast('Saved. Sign in as @' + nu + ' from now on');
        return;
      }
      op({ action: 'updateProfile', profile }); render(); rememberMe(); toast('Profile saved');
    } });
}

function userDialog(u, approving) {
  const manage = userTeamsC(u).some(canManage) && !(u.role === 'admin' && !isAdminU());
  const self = u.id === me().id;
  if (self && !approving) { nav(() => { S.view = 'settings'; }, 'push'); return; }
  const roles = isAdminU() ? ['member', 'head', 'admin'] : ['member', 'head'];
  let photo;
  const body = `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 10px;text-align:center">
      ${manage ? `<button class="photo-pick" id="ud-photo" aria-label="Change photo">${av(u, 'xl')}<span class="edit">${ic('camera')}</span></button>` : av(u, 'xl')}
      <div style="font-size:22px;font-weight:700;letter-spacing:-.3px">${esc(u.name)}</div><div class="sub" style="font-size:15px">@${esc(u.username)} · ${esc(teamLabel(teamById(u.teamId)))}</div>${roleChip(u)}</div>
    ${manage ? `<label class="field" style="margin-top:14px"><span>Job title</span><input class="input" id="ud-job" value="${esc(u.jobTitle || '')}" placeholder="e.g. Graphic Designer"></label>
      <div class="section-title" style="margin-top:8px">Role</div><div class="seg" id="ud-role" style="display:flex">${roles.map(r => `<button data-role="${r}" class="${(u.role || 'member') === r ? 'on' : ''}" style="flex:1">${ROLE[r]}</button>`).join('')}</div>
      <p class="section-foot">Department heads approve people, assign roles and manage their team.${isAdminU() ? ' Main admins see every team.' : ''}</p>
      ${isAdminU() ? `<div class="section-title">Team</div><div class="menu"><div class="li"><span class="lbl">Team</span><select class="sel" id="ud-team" aria-label="Team">${D().teams.map(t => `<option value="${t.id}" ${t.id === u.teamId ? 'selected' : ''}>${esc(teamLabel(t))}</option>`).join('')}</select></div></div>` : ''}
      <div id="ud-share-box"></div>
      ${approving ? '' : `<div class="section-title">Access</div><div class="menu">
        <div class="li"><span class="ico" style="background:var(--blue)">${ic('lock')}</span><span class="lbl">Reset PIN</span><input class="input" id="ud-pin" type="password" inputmode="numeric" maxlength="4" placeholder="New PIN" style="width:110px;height:36px;font-size:15px" aria-label="New PIN"><button class="btn sm" data-local="pin">Set</button></div>
        <button class="li" data-local="toggle"><span class="ico" style="background:var(--gray)">${ic('power')}</span><span class="lbl">${u.status === 'disabled' ? 'Turn On Account' : 'Turn Off Account'}</span></button>
        <button class="li" data-local="remove" style="color:var(--red)"><span class="ico" style="background:var(--red)">${ic('trash')}</span><span class="lbl">Remove from ${CONFIG.APP_NAME}</span></button></div>`}`
    : `<div class="menu" style="margin-top:12px"><div class="li" style="--inset:16px"><span class="lbl">Job title</span><span class="val"><span>${esc(u.jobTitle || '—')}</span></span></div>
       <div class="li" style="--inset:16px"><span class="lbl">Open tasks</span><span class="val tnum">${D().tasks.filter(t => (t.assignees || []).includes(u.id) && !isDone(t)).length}</span></div></div>`}`;
  openDialog({ title: approving ? 'Approve Request' : 'Team Member', ok: manage ? (approving ? 'Approve' : 'Save') : '', cancel: manage ? 'Cancel' : 'Close', body,
    onOpen: root => {
      const box = $('#ud-share-box', root), ht = teamById(u.teamId);
      if (box && ht && manage) {
        const allowed = isAdminU() ? D().teams : D().teams.filter(t => myTeamIds().includes(t.id) || (u.teamIds || []).includes(t.id));
        box.innerHTML = shareRowsHtml('ud', ht, u.teamIds || [], allowed, true);
        wireShareRows(root, 'ud');
      }
      $$('[data-role]', root).forEach(b => b.onclick = () => { $$('[data-role]', root).forEach(x => x.classList.remove('on')); b.classList.add('on'); Motion.haptic(); });
      const ph = $('#ud-photo', root); if (ph) ph.onclick = async () => { const d = await pickImage({ max: 256, square: true }); if (!d) return; photo = d; $('.av', ph).outerHTML = `<span class="av xl"><img src="${d}" alt=""></span>`; };
      $$('[data-local]', root).forEach(b => b.onclick = async () => {
        const k = b.dataset.local;
        try {
          if (k === 'pin') { await run('resetPin', { userId: u.id, pin: $('#ud-pin', root).value }, 'PIN reset for ' + firstName(u.name)); $('#ud-pin', root).value = ''; }
          if (k === 'toggle') { op({ action: 'updateUser', userId: u.id, patch: { status: u.status === 'disabled' ? 'active' : 'disabled' } }); closeDialog(); render(); toast(u.status === 'disabled' ? 'Account turned off' : 'Account turned on'); }
          if (k === 'remove') { if (!await confirmBox({ title: 'Remove ' + u.name + '?', msg: 'They’ll be signed out and lose access. Their tasks and comments stay.', ok: 'Remove', danger: true })) return;
            op({ action: 'removeUser', userId: u.id }); closeDialog(); render(); toast('Removed ' + u.name); }
        } catch (e) { }
      });
    },
    onOk: root => {
      const patch = { jobTitle: $('#ud-job', root).value };
      const r = $('#ud-role .on', root); if (r) patch.role = r.dataset.role;
      const tm = $('#ud-team', root); if (tm) patch.teamId = tm.value;
      if ($('#ud-share-box [data-share]', root)) patch.teamIds = readShareRows(root, 'ud');
      if (photo !== undefined) patch.photo = photo;
      if (approving) patch.status = 'active';
      op({ action: 'updateUser', userId: u.id, patch }); render();
      toast(approving ? firstName(u.name) + ' can now sign in' : 'Saved');
    } });
}

const demoNote = () => API.live ? '' : `<div class="demo"><b>Preview with sample data.</b> Property <code>DXBAI</code> · <code>shri</code> / <code>1234</code> (main admin), <code>aisha</code> / <code>1111</code> (department head), <code>rahul</code> / <code>2222</code> (team member).</div>`;
const keypadHtml = (left, leftAct) => `<div class="keypad">${[[1, ''], [2, 'ABC'], [3, 'DEF'], [4, 'GHI'], [5, 'JKL'], [6, 'MNO'], [7, 'PQRS'], [8, 'TUV'], [9, 'WXYZ']].map(n => `<button data-n="${n[0]}">${n[0]}<small>${n[1] || '&nbsp;'}</small></button>`).join('')}
  <button class="fn" data-k="${leftAct || ''}">${left || ''}</button><button data-n="0">0<small>&nbsp;</small></button><button class="fn" data-k="del" aria-label="Delete">Delete</button></div>`;
function renderLock(first) {
  const root = lockRoot();
  const last = store.get('orbit_last', {});
  const back = (to, label = 'Back') => `<button class="back" data-auth="back" data-to="${to}">${ic('chevL')}<span>${label}</span></button>`;
  const err = `<div class="err" role="alert">${esc(A.err)}</div>`;
  let c = '', pinMode = false;
  switch (A.step) {
    case 'welcome':
      c = `${identHtml('app')}<h1>${CONFIG.APP_NAME}</h1><p class="sub">Projects, tasks and deadlines for every team at your property.</p>
        <div class="actions"><button class="btn primary block" data-auth="toCreds">Sign In</button><button class="btn block" data-auth="toCode" style="background:var(--glass)">Create Account</button></div>${demoNote()}`;
      break;
    case 'creds':
      c = `${back('welcome')}${identHtml('prop')}<h1>Sign In</h1><p class="sub">Enter your property code and username.</p>
        <div class="form"><input class="input" id="a-code" placeholder="Property code" value="${esc(A.code)}" autocapitalize="characters" autocomplete="organization" aria-label="Property code" style="text-transform:uppercase">
        <input class="input" id="a-user" placeholder="Username" value="${esc(A.username)}" autocapitalize="none" autocomplete="username" aria-label="Username"></div>${err}
        <div class="actions"><button class="btn primary block" data-auth="doCreds" ${A.busy ? 'disabled' : ''}>${A.busy ? '<span class="spin" style="border-top-color:#fff"></span>' : 'Continue'}</button></div>${demoNote()}`;
      break;
    case 'pin': {
      pinMode = true;
      const known = last.username === A.username && last.name;
      c = `${identHtml('user')}<div class="hello-s">Welcome back</div><h1>${esc(known ? firstName(last.name) : '@' + A.username)}</h1><p class="sub">Enter your 4-digit PIN</p>
        <div class="pin-stage"><div class="pin-dots" id="dots">${'<i></i>'.repeat(4)}</div></div><div class="pin-msg ${A.err ? 'neg' : ''}" id="pinmsg">${esc(A.err)}</div>
        ${keypadHtml(known ? 'Not you?' : 'Back', 'creds')}`;
      break;
    }
    case 'code':
      c = `${back('welcome')}${identHtml('app')}<h1>Join Your Team</h1><p class="sub">Enter the property code your department head shared, such as DXBAI.</p>
        <div class="form"><input class="input" id="a-code" placeholder="Property code" value="${esc(A.code)}" autocapitalize="characters" aria-label="Property code" style="text-transform:uppercase;text-align:center;letter-spacing:.12em;font-weight:600"></div>${err}
        <div class="actions"><button class="btn primary block" data-auth="doCode" ${A.busy ? 'disabled' : ''}>${A.busy ? '<span class="spin" style="border-top-color:#fff"></span>' : 'Continue'}</button></div>`;
      break;
    case 'team':
      c = `${back('code')}${identHtml('prop')}<h1>${esc(A.property.name)}</h1><p class="sub">Choose your team</p>
        <div class="menu teamlist">${A.teams.map(t => `<button class="li ${A.teamId === t.id ? 'on' : ''}" data-auth="pickTeam" data-id="${t.id}"><span class="dot" style="background:${cvar(t.color)}"></span><span class="lbl">${esc(t.name)}</span><span class="tick">${ic('check')}</span></button>`).join('') || '<div class="li sub">This property has no teams yet. Ask the main admin to add one.</div>'}</div>
        ${err}<div class="actions"><button class="btn primary block" data-auth="toDetails" ${A.teamId ? '' : 'disabled'}>Continue</button></div>`;
      break;
    case 'details': {
      const team = A.teams.find(t => t.id === A.teamId);
      c = `${back('team')}${identHtml('prop')}<h1>About You</h1><p class="sub">${esc(A.property.code)} · ${esc(team ? team.name : '')}</p>
        <div class="form"><input class="input" id="a-name" placeholder="Full name" value="${esc(A.name)}" autocomplete="name" aria-label="Full name">
        <input class="input" id="a-job" placeholder="Job title (optional)" value="${esc(A.jobTitle)}" aria-label="Job title">
        <input class="input" id="a-user" placeholder="Choose a username" value="${esc(A.username)}" autocapitalize="none" autocomplete="username" aria-label="Username"></div>${err}
        <div class="actions"><button class="btn primary block" data-auth="toNewPin">Continue</button></div>`;
      break;
    }
    case 'newpin': case 'newpin2':
      pinMode = true;
      c = `${identHtml('prop')}<h1>${A.step === 'newpin' ? 'Choose a PIN' : 'Confirm Your PIN'}</h1><p class="sub">${A.step === 'newpin' ? 'You’ll use these 4 digits to sign in.' : 'Enter the same 4 digits again.'}</p>
        <div class="pin-stage"><div class="pin-dots" id="dots">${'<i></i>'.repeat(4)}</div></div><div class="pin-msg ${A.err ? 'neg' : ''}" id="pinmsg">${esc(A.err)}</div>
        ${keypadHtml('Back', A.step === 'newpin' ? 'details' : 'newpin')}`;
      break;
    case 'sent': case 'pending':
      c = `${identHtml('clock')}<h1>${A.step === 'sent' ? 'Request Sent' : 'Waiting for Approval'}</h1>
        <p class="sub">${A.step === 'sent' ? 'Your department head or the main admin will approve your account. Once approved, sign in with your username and PIN.' : 'Your account hasn’t been approved yet. Ask your department head to approve it under Team › Requests.'}</p>
        <div class="actions"><button class="btn primary block" data-auth="toCreds">Back to Sign In</button></div>`;
      break;
  }
  root.innerHTML = `<div class="lock" id="lock"><div class="lock-bg"><i></i><i></i><i></i></div><div class="lock-card lock-scene ${A.dir < 0 ? 'back-in' : ''}" ${first ? 'style="animation:none"' : ''}>${c}</div></div>`;
  Motion.armHaptics(root);
  if (pinMode) wirePin();
  const f = $('#lock input');
  if (f && innerWidth >= 1024) setTimeout(() => f.focus(), 60);
}

/* The four PIN dots are the loader: they flow into a turning ring, peel back on a wrong PIN,
   and melt into one glow that opens into the app on success. */
function makeRing(dots) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); MP.i = (MP.i + (e.key === 'ArrowDown' ? 1 : MP.list.length - 1)) % MP.list.length; drawMentions(); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(MP.i); return; }
    if (e.key === 'Escape') { e.preventDefault(); $('#mpop').hidden = true; MP.list = []; return; }
  }
  if (e.key === 'Enter' && !e.shiftKey && t.dataset && t.dataset.enterSend && innerWidth >= 1024) { e.preventDefault(); ACT.sendComment(t); return; }
  if (e.key === 'Enter' && t.id === 'ttl') { e.preventDefault(); t.blur(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role=button][data-act]')) { e.preventDefault(); t.click(); return; }
  if (e.key === 'Escape') {
    if ($('#alert').innerHTML) return;
    if ($('#menu').innerHTML) { $('#menu').innerHTML = ''; return; }
    if (DLG) { closeDialog(); return; }
    if (S.addingCol) { S.addingCol = null; render(); return; }
    if (S.taskId) { const cur = taskById(S.taskId); if (cur && cur.parentId && taskById(cur.parentId)) ACT.taskBack({ dataset: { id: cur.parentId } }); else { S.taskId = null; render({ soft: true }); } }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const q = $('#q'); if (q && q.offsetParent) q.focus(); else ACT.go({ dataset: { v: 'search' } }); }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.change && ACT[t.dataset.change]) ACT[t.dataset.change](t); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.input === 'search') { S.q = t.value.trim(); renderContent(); }
  if (t.dataset.input === 'search2') { S.q = t.value.trim(); const r = $('#results'); if (r) r.innerHTML = S.q ? searchResultsHtml(S.q, true) : ''; }
  if (t.classList.contains('ttl-edit') || t.id === 'cmt') autosize();
  if (t.id === 'cmt') mentionCheck(t);
});
document.addEventListener('focusout', e => { if (e.target.id === 'addcol' && !e.target.value.trim()) setTimeout(() => { if (S.addingCol) { S.addingCol = null; render(); } }, 150); });
function autosize() { $$('.ttl-edit, #cmt').forEach(t => { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, t.id === 'cmt' ? 140 : 400) + 'px'; }); }
document.addEventListener('scroll', e => { if (e.target.id === 'sc') { const nb = $('#nav'); if (nb) nb.classList.toggle('scrolled', e.target.scrollTop > 34); } }, true);

/* board drag & drop */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return; dragId = c.dataset.drag; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) { } });
document.addEventListener('dragend', e => { const c = e.target.closest && e.target.closest('[data-drag]'); c && c.classList.remove('dragging'); $$('.col.drop').forEach(x => x.classList.remove('drop')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-col]'); if (!col || !dragId) return; e.preventDefault(); $$('.col.drop').forEach(x => x !== col && x.classList.remove('drop')); col.classList.add('drop'); });
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('[data-col]'); if (!col || !dragId) return; e.preventDefault();
  const t = taskById(dragId); const st = col.dataset.col; dragId = null; col.classList.remove('drop');
  const sg = t && stageList(projById(t.projectId)).find(s => s.id === st);
  if (t && t.status !== st) saveTask({ id: t.id, status: st, order: Date.now() }, 'Moved to ' + (sg ? sg.name : ''));
});

/* Keep changes safe when the app is closed while they're still saving. */
addEventListener('beforeunload', e => {
  if (Outbox.q.length || Outbox.busy) {
    Outbox.flush();
    e.preventDefault(); e.returnValue = 'Your latest changes are still saving. Wait a few seconds, then close.';
    return e.returnValue;
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (Outbox.q.length && !Outbox.busy) API.beacon({ action: 'batch', ops: Outbox.q.slice(0, 40) }); }
  else if (Session.token && S.data && API.live) { Outbox.flush(); sync({ soft: true }); }
});
addEventListener('online', () => { Outbox.kick(0); });

/* theme */
function applyTheme() { const t = store.get('orbit_theme', 'system'); if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }

/* boot */
(function boot() {
  ['insp-scrim:div', 'insp:aside', 'tabroot:div', 'lockroot:div'].forEach(s => { const [id, tag] = s.split(':'); if (!document.getElementById(id)) { const el = document.createElement(tag); el.id = id; if (id === 'insp') el.className = 'insp'; if (id === 'insp-scrim') { el.className = 'insp-scrim'; el.dataset.act = 'closeTask'; } document.body.appendChild(el); } });
  if (!$('#toast')) { const t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  applyTheme();
  setInterval(() => { if (!document.hidden && Session.token && S.data && API.live) sync({ soft: true }); }, 20000);
  if (Session.token) {
    applyAccent(store.get('orbit_last', {}).color);
    const cached = store.get('orbit_cache', null);
    if (cached && cached.me && Session.user && cached.me.id === Session.user.id) { acceptData(cached); S.welcomed = false; render(); setTimeout(() => { S.welcomed = true; }, 4000); }
    else app().innerHTML = `<div class="loading"><span class="spin"></span></div>`;
    sync().then(() => { if (!S.data && Session.token) app().innerHTML = `<div class="loading"><div style="text-align:center;padding:24px"><p class="sub" style="margin-bottom:14px">Couldn’t reach the server. Check your connection.</p><button class="btn primary sm" onclick="location.reload()">Try Again</button></div></div>`; });
    Outbox.kick(300);
  } else showLock();
})();
/* Keep a copy on this device so the app opens instantly next time. */
setInterval(() => { if (S.data && Session.token) store.set('orbit_cache', S.data); }, 15000);
addEventListener('pagehide', () => { if (S.data && Session.token) store.set('orbit_cache', S.data); });

</script>
<script>if('serviceWorker' in navigator && location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
