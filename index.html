<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Orbit Projects</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
[hidden]{display:none!important}
/* Orbit — same design language as My Budget: iOS 27 Liquid Glass on phones,
   a floating Mac-style sidebar and task panel on desktop. Accent follows the property's colour. */
:root{
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", sans-serif;
  --font-round:ui-rounded, -apple-system, "SF Pro Rounded", system-ui, sans-serif;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.36,.64,1); --glide:cubic-bezier(.22,.8,.22,1);
  --r-card:26px; --tab-h:62px; --side:0px; --insp-w:0px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#FFFFFF; --elev:#FFFFFF; --panel:#F6F6F9;
  --fill:rgba(120,120,128,.20); --fill-2:rgba(120,120,128,.16); --fill-3:rgba(118,118,128,.12); --fill-4:rgba(116,116,128,.08);
  --text:#000000; --text-2:rgba(60,60,67,.60); --text-3:#8E8E93; --text-4:rgba(60,60,67,.30);
  --sep:rgba(60,60,67,.22); --line:#E5E5EA;
  --blue:#0088FF; --green:#34C759; --red:#FF383C; --orange:#FF8D28; --yellow:#FFCC00; --teal:#00C3D0; --indigo:#6155F5; --pink:#FF2D55;
  --purple:#CB30E0; --mint:#00C8B3; --cyan:#00C0E8; --brown:#AC7F5E; --gray:#8E8E93;
  --accent:var(--blue); --on-accent:#FFFFFF;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.80); --glass-edge:rgba(255,255,255,.85);
  --glass-shadow:0 10px 30px -8px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.06);
  --seg-on:#FFFFFF; --dim:rgba(0,0,0,.28);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --elev:#1C1C1E; --panel:#121214;
  --fill:rgba(120,120,128,.36); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(118,118,128,.24); --fill-4:rgba(118,118,128,.18);
  --text:#FFFFFF; --text-2:rgba(235,235,245,.60); --text-3:#8E8E93; --text-4:rgba(235,235,245,.30);
  --sep:rgba(84,84,88,.55); --line:#38383A;
  --blue:#0091FF; --green:#30D158; --red:#FF4245; --orange:#FF9230; --yellow:#FFD600; --teal:#00D2E0; --indigo:#6D7CFF; --pink:#FF375F;
  --purple:#DB34F2; --mint:#00DAC3; --cyan:#3CD3FE; --brown:#B78A66; --gray:#98989D;
  --glass:rgba(40,40,42,.55); --glass-strong:rgba(44,44,46,.84); --glass-edge:rgba(255,255,255,.14);
  --glass-shadow:0 10px 30px -8px rgba(0,0,0,.6); --seg-on:#636366; --dim:rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --elev:#1C1C1E; --panel:#121214;
  --fill:rgba(120,120,128,.36); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(118,118,128,.24); --fill-4:rgba(118,118,128,.18);
  --text:#FFFFFF; --text-2:rgba(235,235,245,.60); --text-3:#8E8E93; --text-4:rgba(235,235,245,.30);
  --sep:rgba(84,84,88,.55); --line:#38383A;
  --blue:#0091FF; --green:#30D158; --red:#FF4245; --orange:#FF9230; --yellow:#FFD600; --teal:#00D2E0; --indigo:#6D7CFF; --pink:#FF375F;
  --purple:#DB34F2; --mint:#00DAC3; --cyan:#3CD3FE; --brown:#B78A66; --gray:#98989D;
  --glass:rgba(40,40,42,.55); --glass-strong:rgba(44,44,46,.84); --glass-edge:rgba(255,255,255,.14);
  --glass-shadow:0 10px 30px -8px rgba(0,0,0,.6); --seg-on:#636366; --dim:rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{ --accent-soft:color-mix(in srgb,var(--accent) 15%,transparent); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.29;letter-spacing:-.43px;
  -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
:focus:not(:focus-visible){outline:none}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
svg.i.s{width:16px;height:16px} svg.i.xs{width:13px;height:13px;stroke-width:2.3} svg.i.l{width:25px;height:25px}
.tnum,.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)} .sub{color:var(--text-2)} .faint{color:var(--text-3)}

/* Liquid Glass */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(190%);backdrop-filter:blur(16px) saturate(190%);
  box-shadow:inset 0 0 0 .5px var(--glass-edge),inset 0 1px 1px rgba(255,255,255,.35),var(--glass-shadow)}
:root[data-theme="dark"] .glass{box-shadow:inset 0 0 0 .5px var(--glass-edge),inset 0 1px 0 rgba(255,255,255,.08),var(--glass-shadow)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .glass{box-shadow:inset 0 0 0 .5px var(--glass-edge),inset 0 1px 0 rgba(255,255,255,.08),var(--glass-shadow)} }

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 22px;border-radius:999px;font-weight:600;font-size:17px;
  background:var(--fill-3);color:var(--accent);white-space:nowrap;transition:transform .35s var(--spring),opacity .15s;position:relative}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn.gray{background:var(--fill-3);color:var(--text)}
.btn.plain{background:none;padding:0 8px;height:34px;font-size:15px;letter-spacing:-.23px}
.btn.sm{height:34px;padding:0 14px;font-size:15px;letter-spacing:-.23px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text);position:relative;flex:none;transition:transform .35s var(--spring)}
.circle:active{transform:scale(.9)}
.circle.tint{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 1px 1px rgba(255,255,255,.35)}
.circle.flat{background:var(--fill-3)}
.circle.sm{width:34px;height:34px}
.seg{display:inline-flex;background:var(--fill-3);border-radius:999px;padding:2px;max-width:100%;overflow-x:auto;scrollbar-width:none;position:relative;flex:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;height:32px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;letter-spacing:-.15px;
  display:inline-flex;align-items:center;gap:6px;transition:background .2s}
.seg button.on{background:var(--seg-on);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg button.on.seg-hold{background:transparent;box-shadow:none}
.seg-ghost{position:absolute;z-index:0;border-radius:999px;background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);pointer-events:none}
.seg .count{font-size:11px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;display:inline-grid;place-items:center;padding:0 5px;font-weight:700}
.input{display:block;width:100%;height:50px;padding:0 16px;border-radius:14px;border:0;background:var(--surface);font-size:17px;outline:none;color:var(--text)}
.input::placeholder{color:var(--text-4)}
.input:focus{box-shadow:0 0 0 2px var(--accent)}
textarea.input{height:auto;min-height:96px;padding:13px 16px;resize:vertical;line-height:1.4}
.sheet .input,.insp .input{background:var(--fill-4)}
select.sel{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--text-2);text-align:right;text-align-last:right;font-size:17px;outline:none;cursor:pointer;max-width:58%;padding:0}
input.date{border:0;background:var(--fill-3);border-radius:10px;padding:6px 10px;font-size:15px;color:var(--text);outline:none;letter-spacing:-.23px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--text-2);margin:0 16px 6px;letter-spacing:-.08px}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;letter-spacing:-.08px;background:var(--fill-3);color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;letter-spacing:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.badge{min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;letter-spacing:0}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:600;flex:none;overflow:hidden;
  font-family:var(--font-round);letter-spacing:0;background:linear-gradient(180deg,#A5A5AA,#86868B)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:22px;height:22px;font-size:9px} .av.lg{width:44px;height:44px;font-size:17px} .av.xl{width:84px;height:84px;font-size:32px}
.avs{display:inline-flex}
.avs .av{box-shadow:0 0 0 2px var(--surface)}
.avs .av+.av{margin-left:-7px}
.check{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--text-4);display:grid;place-items:center;flex:none;color:transparent;position:relative;
  transition:background .2s,border-color .2s,transform .35s var(--spring)}
.check:active{transform:scale(.85)}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check svg{width:14px;height:14px;stroke-width:3}
.check.pop{animation:pop .4s var(--spring)}
@keyframes pop{40%{transform:scale(1.3)}}
.pdot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.pdot.lg{width:20px;height:20px}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg.i{width:17px;height:17px;stroke-width:2.1}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--fill);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
[data-haptic]{position:absolute;inset:0;z-index:5;border-radius:inherit;touch-action:manipulation;cursor:pointer}
[data-haptic] input{position:absolute;width:1px;height:1px;margin:0;padding:0;opacity:0;visibility:hidden;pointer-events:none}

/* ---------- grouped content ---------- */
.card{background:var(--surface);border-radius:var(--r-card);min-width:0}
.menu{background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;width:100%;text-align:left;min-width:0;position:relative;color:var(--text)}
.li+.li::before,.li+.trow::before,.trow+.li::before{content:"";position:absolute;top:0;right:0;left:var(--inset,58px);height:.5px;background:var(--sep)}
button.li:active,.li.tap:active{background:var(--fill-4)}
.li .lbl{flex:1;min-width:0}
.li .val{color:var(--text-2);display:flex;align-items:center;gap:6px;text-align:right;min-width:0;max-width:60%}
.li .val span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .chev{color:var(--text-4)}
.section-title{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.23px;margin:28px 16px 8px;display:flex;align-items:center;gap:8px}
.section-title .n{font-weight:400;color:var(--text-2)}
.section-title .sp{flex:1}
.section-title .link{font-size:15px;font-weight:400;color:var(--accent)}
.section-foot{font-size:13px;color:var(--text-2);margin:8px 16px 0;letter-spacing:-.08px;line-height:1.35}

/* ---------- app shell ---------- */
#app{height:100%;position:relative;z-index:1}
.shell{height:100%;display:flex}
.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;position:relative;transition:margin-right .55s var(--ease),transform .5s var(--ease),filter .5s var(--ease)}
.navbar{position:relative;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 4px) 16px 6px;min-height:calc(var(--safe-t) + 54px)}
.navbar::before{content:"";position:absolute;inset:0 0 -24px 0;z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom,var(--bg) 0%,color-mix(in srgb,var(--bg) 85%,transparent) 55%,transparent 100%);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent);mask-image:linear-gradient(to bottom,#000 60%,transparent);
  opacity:0;transition:opacity .25s}
.navbar.scrolled::before{opacity:1}
.navbar .nb-title{flex:1;min-width:0;text-align:center;font-size:17px;font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .25s var(--ease);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar.scrolled .nb-title{opacity:1;transform:none}
.navbar .nb-r{display:flex;gap:8px;align-items:center}
.sync-ic{position:relative}
.sync-ic[data-s="saving"] svg{color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.sync-ic[data-s="offline"] svg,.sync-ic[data-s="error"] svg{color:var(--orange)}
@keyframes pulse{50%{opacity:.35}}
.search{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--fill-3);width:240px;color:var(--text-2)}
.search input{border:0;outline:none;background:transparent;width:100%;font-size:15px;color:var(--text);letter-spacing:-.23px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
  padding:0 16px calc(var(--tab-h) + var(--safe-b) + 44px)}
.page{max-width:1000px;margin:0 auto;transition:transform .6s var(--spring)}
.page.wide{max-width:none}
.large-title{margin:2px 4px 4px;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.4px;text-wrap:balance;overflow-wrap:anywhere;transform-origin:left bottom}
.lt-sub{font-size:15px;color:var(--text-2);letter-spacing:-.23px;margin:0 4px 16px}
.eyebrow{font-size:15px;color:var(--text-2);letter-spacing:-.23px;margin:6px 4px 0;font-weight:500}
.hello .large-title{margin-top:0}
.prop-badge{display:inline-flex;align-items:center;gap:8px;margin:0 4px 16px;height:30px;padding:0 12px 0 4px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.08px}
.prop-badge .plogo{width:22px;height:22px}
.plogo{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;overflow:hidden;color:#fff;font-weight:700;font-size:11px;flex:none;background:var(--accent);font-family:var(--font-round)}
.plogo img{width:100%;height:100%;object-fit:contain;background:#fff}
.mob-only{display:none}
.scope-pill{display:none!important}

/* ---------- sidebar (desktop) ---------- */
.sidebar{display:none}
.sb-head{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}
.sb-head .plogo{width:36px;height:36px;border-radius:10px;font-size:14px}
.sb-title{font-weight:700;font-size:16px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sub{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.scope{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:12px;background:var(--fill-4);font-size:14px;font-weight:600;width:100%;margin-bottom:6px}
.scope .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.sb-nav{display:flex;flex-direction:column;gap:2px}
.sb-item{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:12px;color:var(--text);font-size:15px;font-weight:500;letter-spacing:-.2px;width:100%;text-align:left;transition:background .15s}
.sb-item svg.i{color:var(--accent)}
.sb-item:hover{background:var(--fill-4)}
.sb-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sb-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .n{font-size:13px;color:var(--text-2);font-weight:500}
.sb-sec{font-size:12px;font-weight:600;color:var(--text-2);padding:16px 12px 4px;display:flex;align-items:center;justify-content:space-between;letter-spacing:0}
.sb-foot{margin-top:auto;padding-top:10px;border-top:.5px solid var(--sep);display:flex;flex-direction:column;gap:4px}
.sb-sync{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--text-2);letter-spacing:0}
.sb-sync svg{width:15px;height:15px}
.sb-sync[data-s="saving"] svg{color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.sb-sync[data-s="offline"] svg,.sb-sync[data-s="error"] svg{color:var(--orange)}
.me-btn{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:14px;text-align:left}
.me-btn:hover{background:var(--fill-4)}
.me-btn b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.me-btn small{display:block;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}

/* ---------- floating tab bar (phones) ---------- */
.tab-fade{position:fixed;z-index:29;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--safe-b) + 46px);pointer-events:none;
  background:linear-gradient(to top,color-mix(in srgb,var(--bg) 80%,transparent) 35%,color-mix(in srgb,var(--bg) 0%,transparent));
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  -webkit-mask-image:linear-gradient(to top,#000 55%,transparent);mask-image:linear-gradient(to top,#000 55%,transparent);transition:opacity .4s}
.tabdock{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 8px);width:min(100% - 32px,560px);display:flex;align-items:center;gap:12px;
  pointer-events:none;transition:transform .5s var(--ease),opacity .35s}
.tabbar{pointer-events:auto;flex:1;height:var(--tab-h);border-radius:999px;padding:4px;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:600;letter-spacing:.1px;color:var(--text);border-radius:999px}
.tab svg.i{width:25px;height:25px}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;top:3px;left:calc(50% + 6px);height:17px;min-width:17px;font-size:11px;padding:0 4px}
.tab-pill{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 4);border-radius:999px;background:var(--fill-3);will-change:transform;transition:transform .55s var(--glide)}
.fab{pointer-events:auto;width:var(--tab-h);height:var(--tab-h);border-radius:50%;display:grid;place-items:center;color:var(--accent);position:relative;transition:transform .35s var(--spring)}
.fab:active{transform:scale(.9)}
.fab svg.i{width:28px;height:28px;stroke-width:2.3}
body.insp-open .tabdock{transform:translate(-50%,140%);opacity:0}
body.insp-open .tab-fade{opacity:0}

/* ---------- home ---------- */
.smart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.smart button{background:var(--surface);border-radius:22px;padding:12px 14px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .35s var(--spring);position:relative}
.smart button:active{transform:scale(.96)}
.smart .top{display:flex;align-items:center;justify-content:space-between}
.smart .ico{width:34px;height:34px;border-radius:50%}
.smart .num{font-family:var(--font-round);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.5px}
.smart .nm{font-size:15px;font-weight:600;color:var(--text-2);letter-spacing:-.23px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:color-mix(in srgb,var(--orange) 13%,var(--surface));margin-top:14px;width:100%;text-align:left;transition:transform .35s var(--spring)}
.banner:active{transform:scale(.98)}
.banner .t{font-weight:600;letter-spacing:-.3px}
.banner .d{font-size:15px;color:var(--text-2);letter-spacing:-.23px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0;transition:transform .35s var(--spring),box-shadow .25s;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--pc)}
.pcard:active{transform:scale(.97)}
.pcard .hd{display:flex;align-items:center;gap:10px;min-width:0}
.pcard .nm{font-weight:600;font-size:17px;letter-spacing:-.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.bar{height:6px;border-radius:3px;background:var(--fill-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .9s cubic-bezier(.34,1.15,.64,1)}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--text-2);gap:8px;letter-spacing:-.08px}

/* ---------- task rows ---------- */
.trow{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;position:relative;cursor:pointer;min-width:0;transition:background .15s}
.trow+.trow::before{content:"";position:absolute;top:0;right:0;left:52px;height:.5px;background:var(--sep)}
.trow:active{background:var(--fill-4)}
.trow.sel{background:var(--accent-soft)}
.trow .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.trow .ttl{font-size:17px;overflow-wrap:anywhere;letter-spacing:-.43px;transition:color .3s}
.trow.done .ttl{color:var(--text-3);text-decoration:line-through}
.trow .tsub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--text-2);letter-spacing:-.08px}
.trow .tsub span{display:inline-flex;align-items:center;gap:3px}
.trow .right{display:flex;align-items:center;gap:8px;flex:none;padding-top:1px}
.pending-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
.due.over{color:var(--red);font-weight:600} .due.today{color:var(--orange);font-weight:600}
.flag{display:inline-flex}
.addrow{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--accent);position:relative}
.addrow::before{content:"";position:absolute;top:0;right:0;left:52px;height:.5px;background:var(--sep)}
.addrow:first-child::before{display:none}
.addrow input{border:0;outline:none;background:transparent;flex:1;font-size:17px;color:var(--text);min-width:0}
.addrow input::placeholder{color:var(--accent)}
.sec-h{display:flex;align-items:center;gap:8px;margin:24px 8px 8px;font-weight:600;font-size:17px;width:calc(100% - 16px);text-align:left;letter-spacing:-.43px}
.sec-h .n{color:var(--text-2);font-weight:400}
.sec-h svg{transition:transform .35s var(--spring);color:var(--text-3)}
.sec-h.closed svg{transform:rotate(-90deg)}
.empty{padding:36px 20px;text-align:center;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;letter-spacing:-.23px}
.empty .ico{width:54px;height:54px;border-radius:50%}
.empty .ico svg.i{width:26px;height:26px}
.empty b{color:var(--text);font-size:17px;font-weight:600;letter-spacing:-.43px}

/* ---------- project ---------- */
.phead{display:flex;align-items:flex-start;gap:12px;margin:4px 4px 12px}
.phead .pdot{margin-top:12px}
.phead h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:.2px;margin:0;overflow-wrap:anywhere}
.phead .desc{color:var(--text-2);margin-top:4px;font-size:15px;letter-spacing:-.23px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 4px 6px}
.controls .sp{flex:1}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:14px;overflow-x:auto;padding:8px 2px 20px;align-items:start}
.col{background:var(--fill-4);border-radius:24px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px;transition:background .25s}
.col.drop{background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 2px;font-weight:600;font-size:15px;letter-spacing:-.23px}
.col-h .n{color:var(--text-2);font-weight:400}
.kcard{background:var(--surface);border-radius:18px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.05);
  transition:transform .35s var(--spring),box-shadow .25s;min-width:0}
.kcard:hover{box-shadow:0 8px 24px rgba(0,0,0,.08)}
.kcard.dragging{opacity:.5;transform:rotate(2deg) scale(.98)}
.kcard .ttl{font-weight:600;font-size:15px;overflow-wrap:anywhere;letter-spacing:-.23px}
.kcard.done .ttl{color:var(--text-3);text-decoration:line-through}
.kcard .ft{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);flex-wrap:wrap;letter-spacing:0}
.kcard .ft span{display:inline-flex;align-items:center;gap:3px}
.kcard .ft .sp{flex:1}
.col .addcard{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:15px;font-weight:500;padding:8px 10px;border-radius:12px}
.col .addcard:hover{background:var(--fill-4);color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--sep);border-radius:22px;overflow:hidden}
.cal .d{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.out{background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
.cal .d .n{font-size:13px;font-weight:600;color:var(--text-2);width:24px;height:24px;display:grid;place-items:center;border-radius:50%;letter-spacing:0}
.cal .d.today .n{background:var(--red);color:#fff}
.cal .wd{background:var(--surface);text-align:center;font-size:12px;font-weight:600;color:var(--text-2);padding:8px 0;letter-spacing:0}
.cal .ev{font-size:12px;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:600;text-align:left;letter-spacing:0}
.cal .more{font-size:11px;color:var(--text-2);padding-left:4px}

/* ---------- people & activity ---------- */
.person{display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative;width:100%;text-align:left;min-width:0}
.person+.person::before{content:"";position:absolute;top:0;right:0;left:72px;height:.5px;background:var(--sep)}
button.person:active{background:var(--fill-4)}
.person .who{flex:1;min-width:0}
.person .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.43px}
.person .jt{font-size:15px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.23px}
.person .acts{display:flex;gap:8px;flex:none}
.role-head{background:color-mix(in srgb,var(--indigo) 15%,transparent);color:var(--indigo)}
.role-admin{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.role-member{background:var(--fill-3);color:var(--text-2)}
.role-pending{background:color-mix(in srgb,var(--yellow) 24%,transparent);color:color-mix(in srgb,var(--orange) 85%,var(--text))}
.role-disabled{background:var(--fill-3);color:var(--text-3)}
.act{display:flex;gap:12px;padding:12px 16px;position:relative;align-items:flex-start;width:100%;text-align:left}
.act+.act::before{content:"";position:absolute;top:0;right:0;left:58px;height:.5px;background:var(--sep)}
.act:active{background:var(--fill-4)}
.act .tx{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere;letter-spacing:-.23px}
.act time{font-size:13px;color:var(--text-2);flex:none}
.act.me .tx b{color:var(--accent)}
.profile-card{display:flex;align-items:center;gap:16px;padding:16px}
.profile-card .nm{font-size:22px;font-weight:700;letter-spacing:-.3px}
.photo-pick{position:relative;border-radius:50%;flex:none}
.photo-pick .edit{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface)}
.photo-pick .edit svg{width:14px;height:14px;stroke-width:2.4}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:14px 16px}
.swatches button,.swatches label{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);transition:transform .35s var(--spring),box-shadow .2s;position:relative;cursor:pointer}
.swatches button.on,.swatches label.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text-3);transform:scale(1.06)}
.swatches label{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.swatches label input{position:absolute;inset:0;opacity:0;cursor:pointer}
.logo-box{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;overflow:hidden;background:var(--fill-4);color:#fff;font-size:28px;font-weight:700;font-family:var(--font-round)}
.logo-box img{width:100%;height:100%;object-fit:contain;background:#fff}

/* ---------- task panel ---------- */
.insp{position:fixed;z-index:50;display:flex;flex-direction:column;background:var(--panel);overflow:hidden;
  transform:translateX(calc(100% + 24px));transition:transform .55s var(--ease),box-shadow .4s;visibility:hidden}
.insp.open{transform:none;visibility:visible}
.insp.closing{visibility:visible}
.insp-bar{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;min-height:62px;flex:none}
.insp-bar .sp{flex:1}
.insp-bar .back{display:none;align-items:center;gap:2px;color:var(--accent);font-size:17px;height:44px;padding:0 8px 0 2px;border-radius:999px}
.insp-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 18px 28px}
.insp-scroll>*{animation:rise .5s var(--ease) backwards}
.insp-scroll>*:nth-child(2){animation-delay:.03s}.insp-scroll>*:nth-child(3){animation-delay:.06s}.insp-scroll>*:nth-child(4){animation-delay:.09s}.insp-scroll>*:nth-child(n+5){animation-delay:.12s}
.insp.steady .insp-scroll>*{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.ttl-edit{width:100%;border:0;outline:none;background:transparent;font-size:28px;font-weight:700;letter-spacing:.2px;resize:none;line-height:1.2;padding:4px 6px;overflow:hidden;border-radius:10px;color:var(--text)}
.ttl-edit:focus{background:var(--fill-4)}
.crumb{font-size:15px;color:var(--text-2);margin:0 6px 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;letter-spacing:-.23px}
.crumb button{color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.notes{width:100%;border:0;outline:none;background:var(--surface);border-radius:var(--r-card);padding:14px 16px;min-height:100px;resize:vertical;font-size:17px;line-height:1.4;color:var(--text)}
.sub-row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative}
.sub-row+.sub-row::before,.sub-row+.addrow::before{content:"";position:absolute;top:0;right:0;left:52px;height:.5px;background:var(--sep)}
.sub-row .t{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.sub-row.done .t{color:var(--text-3);text-decoration:line-through}
.file{display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative;min-width:0}
.file+.file::before{content:"";position:absolute;top:0;right:0;left:60px;height:.5px;background:var(--sep)}
.file .ft{width:32px;height:38px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:800;flex:none;letter-spacing:.03em}
.file .nm{flex:1;min-width:0}
.file .nm a{color:var(--text);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.43px}
.file .nm small{color:var(--text-2);font-size:13px;letter-spacing:-.08px}
.thread{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.cmt{display:flex;gap:10px;min-width:0;animation:rise .45s var(--ease) backwards}
.cmt .bubble{background:var(--surface);border-radius:20px;border-top-left-radius:6px;padding:9px 14px;min-width:0;flex:1}
.cmt .who{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:baseline;letter-spacing:-.08px}
.cmt .who time{font-weight:400;color:var(--text-2);font-size:12px}
.cmt .tx{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px;font-size:16px;letter-spacing:-.3px}
.cmt .del{color:var(--text-3);font-size:12px;margin-left:auto}
.cmt.mine .bubble{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.cmt.pending{opacity:.55}
.composer{padding:10px 12px calc(10px + var(--safe-b));display:flex;gap:8px;align-items:flex-end;flex:none;
  background:color-mix(in srgb,var(--panel) 85%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:.5px solid var(--sep)}
.composer textarea{flex:1;border:0;box-shadow:inset 0 0 0 .5px var(--sep);background:var(--surface);border-radius:22px;padding:10px 16px;min-height:44px;max-height:140px;resize:none;outline:none;font-size:17px;line-height:1.3;color:var(--text)}
.meta-line{font-size:12px;color:var(--text-3);margin:20px 4px 0;text-align:center;letter-spacing:0}
.insp-scrim{position:fixed;inset:0;z-index:49;background:var(--dim);opacity:0;pointer-events:none;transition:opacity .45s}
.grab-h{display:none}

/* ---------- sheets, alerts, menus, toast ---------- */
.sheet-back{position:fixed;inset:0;z-index:60;background:var(--dim);opacity:0;transition:opacity .35s}
.sheet-back.in{opacity:1}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;padding-bottom:var(--safe-b);max-height:calc(100% - var(--safe-t) - 40px);display:flex;flex-direction:column;
  background:var(--bg);border-radius:38px 38px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(110%);transition:transform .5s var(--ease);overflow:hidden}
.sheet.in{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:6px auto 0;flex:none}
.sh-h{display:grid;grid-template-columns:minmax(64px,auto) 1fr minmax(64px,auto);align-items:center;gap:8px;padding:6px 14px 4px;flex:none}
.sh-h h2{margin:0;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.43px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-h .l{justify-self:start} .sh-h .r{justify-self:end}
.sh-b{padding:12px 16px 22px;overflow-y:auto;overscroll-behavior:contain}
.sheet.in .sh-b>*{animation:rise .5s var(--ease) backwards}
.sheet.in .sh-b>*:nth-child(2){animation-delay:.03s}.sheet.in .sh-b>*:nth-child(3){animation-delay:.06s}.sheet.in .sh-b>*:nth-child(4){animation-delay:.09s}.sheet.in .sh-b>*:nth-child(n+5){animation-delay:.12s}
.alert{position:fixed;z-index:91;left:50%;top:50%;width:min(300px,calc(100vw - 48px));transform:translate(-50%,-50%) scale(1.12);opacity:0;transition:transform .35s var(--spring),opacity .2s;
  border-radius:34px;padding:22px 18px 16px;text-align:center;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  box-shadow:0 20px 50px rgba(0,0,0,.25),inset 0 0 0 .5px var(--glass-edge)}
.alert.in{transform:translate(-50%,-50%) scale(1);opacity:1}
.alert h2{margin:0 0 6px;font-size:17px;font-weight:600}
.alert p{margin:0 0 18px;font-size:15px;line-height:1.35;letter-spacing:-.23px}
.alert .acts{display:flex;gap:8px}
.alert .acts .btn{flex:1;height:48px;padding:0 10px;background:var(--fill-3);color:var(--text)}
.alert .acts .btn.primary{background:var(--accent);color:#fff}
.alert .acts .btn.danger{background:var(--red);color:#fff}
.alert-back{position:fixed;inset:0;z-index:90;background:var(--dim);opacity:0;transition:opacity .25s}
.alert-back.in{opacity:1}
.menu-pop{position:fixed;z-index:95;min-width:230px;max-width:300px;border-radius:22px;padding:6px;display:flex;flex-direction:column;max-height:60vh;overflow:auto;
  transform-origin:top left;animation:menu .32s var(--spring);background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  box-shadow:0 20px 50px rgba(0,0,0,.22),inset 0 0 0 .5px var(--glass-edge)}
@keyframes menu{from{opacity:0;transform:scale(.85)}}
.menu-pop button{display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 12px;border-radius:14px;text-align:left;font-size:17px}
.menu-pop button:hover,.menu-pop button:active{background:var(--fill-3)}
.menu-pop button.danger{color:var(--red)}
.menu-pop .tick{width:18px;color:var(--accent);flex:none;display:grid;place-items:center}
.menu-pop hr{border:0;border-top:.5px solid var(--sep);margin:4px 8px}
.menu-pop .mlbl{flex:1;min-width:0}
.menu-pop .mh{font-size:13px;color:var(--text-2);padding:8px 12px 2px;font-weight:600;letter-spacing:-.08px}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 10px);transform:translate(-50%,-30px) scale(.9);z-index:99;color:var(--text);padding:12px 18px;border-radius:999px;font-size:15px;font-weight:600;
  opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .25s;max-width:calc(100vw - 32px);width:max-content;text-align:center;letter-spacing:-.23px;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);box-shadow:inset 0 0 0 .5px var(--glass-edge),0 10px 30px rgba(0,0,0,.18);
  display:flex;align-items:center;gap:8px}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.err{color:var(--red)}

/* ---------- motion helpers ---------- */
.reveal{opacity:0;transform:translateY(22px) scale(.985);transition:opacity .5s var(--ease),transform .75s cubic-bezier(.34,1.2,.64,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- pull to refresh glow ---------- */
#aurora{position:fixed;z-index:19;top:0;left:0;right:0;height:0;opacity:0;overflow:hidden;pointer-events:none;contain:strict;
  -webkit-mask-image:linear-gradient(180deg,#000 45%,transparent);mask-image:linear-gradient(180deg,#000 45%,transparent);
  --a1:var(--accent);--a2:color-mix(in oklch,var(--accent) 55%,#fff);--a5:var(--indigo);--a6:var(--teal)}
@supports (color: oklch(from red l c h)){#aurora{--a5:oklch(from var(--accent) calc(l + .04) c calc(h + 60));--a6:oklch(from var(--accent) l c calc(h - 70))}}
#aurora .glow{position:absolute;inset:-40% -15% -10%;filter:blur(26px) saturate(1.15)}
#aurora .glow i{position:absolute;top:18%;width:46%;height:70%;border-radius:50%;opacity:.6;will-change:transform;background:radial-gradient(closest-side,var(--c),color-mix(in srgb,var(--c) 40%,transparent) 60%,transparent)}
#aurora .glow i:nth-child(1){--c:var(--a6);left:-6%}
#aurora .glow i:nth-child(2){--c:var(--a1);left:16%;top:26%}
#aurora .glow i:nth-child(3){--c:var(--a5);left:38%}
#aurora .glow i:nth-child(4){--c:var(--a2);left:58%;top:28%}
#aurora .glow i:nth-child(5){--c:var(--a1);left:78%;top:14%}
#aurora.live .glow i{animation:wave 3.2s ease-in-out infinite}
#aurora.live .glow i:nth-child(2){animation-delay:-.5s}#aurora.live .glow i:nth-child(3){animation-delay:-1s}
#aurora.live .glow i:nth-child(4){animation-delay:-1.5s}#aurora.live .glow i:nth-child(5){animation-delay:-2s}
#aurora.live .glow{animation:tide 9s ease-in-out infinite alternate}
#aurora.busy .glow i{animation-duration:2.4s}
@keyframes wave{0%,100%{transform:translateY(-14%) scale(1,.9)}50%{transform:translateY(16%) scale(1.12,1.08)}}
@keyframes tide{0%{transform:translateX(-4%)}100%{transform:translateX(4%)}}

/* ---------- sign-in ---------- */
.lock{position:fixed;inset:0;z-index:100;display:flex;overflow:hidden;background:var(--bg);touch-action:manipulation}

<script>
/* =====================================================================
   ORBIT CORE — shared business logic.
   The same code runs in the browser (demo mode, data on this device)
   and inside Google Apps Script (live mode, data in Google Sheets).
   A storage adapter "DB" is passed in with:
     all(t) get(t,id) find(t,fn) insert(t,o) update(t,id,patch) remove(t,id)
     saveFile(name,type,base64) -> {url,fileId}
   ===================================================================== */

var TABLES = {
  properties: ['id','code','name','createdAt','color','logo'],
  teams:      ['id','propertyCode','name','color','createdAt'],
  users:      ['id','propertyCode','teamId','username','name','jobTitle','role','status','pinHash','salt','failed','lockedUntil','avatarColor','createdAt','approvedBy','approvedAt','photo','photoV'],
  sessions:   ['id','userId','createdAt','lastSeen'],
  projects:   ['id','teamId','name','color','icon','description','ownerId','status','due','createdBy','createdAt','updatedAt','archived'],
  tasks:      ['id','teamId','projectId','parentId','title','notes','status','priority','assignees','due','createdBy','createdAt','updatedAt','completedAt','order','attachments'],
  comments:   ['id','teamId','taskId','userId','text','createdAt'],
  activity:   ['id','teamId','userId','type','refId','text','targets','createdAt']
};
var JSON_COLS = { assignees: 1, attachments: 1, targets: 1 };
var STATUSES = ['todo','doing','review','done'];
var PRIORITIES = ['none','low','medium','high','urgent'];
var PROJECT_STATUSES = ['on_track','at_risk','off_track','on_hold','complete'];
var AVATAR_COLORS = ['blue','indigo','purple','pink','red','orange','green','teal','brown'];
var MAX_UPLOAD_BYTES = 10 * 1024 * 1024;
var MAX_IMAGE_CHARS = 48000; // one Google Sheets cell holds 50,000 characters
var ID_RE = /^[a-z][a-z0-9]{6,40}$/;
function cleanId(id, prefix) { return ID_RE.test(String(id || '')) ? String(id) : uid(prefix); }
function cleanImage(v) {
  v = String(v || '');
  if (!v) return '';
  if (!/^data:image\/(png|jpeg|webp|gif);base64,/.test(v)) fail('Choose a PNG, JPG or WebP image.');
  if (v.length > MAX_IMAGE_CHARS) fail('That image is too large. Try a smaller one.');
  return v;
}
function publicProperty(p) { return { id: p.id, code: p.code, name: p.name, color: p.color || 'blue', logo: p.logo || '' }; }

function sha256(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  var mp = Math.pow, maxWord = mp(2, 32), i, j, result = '';
  var words = [], bitLen = ascii.length * 8;
  var hash = [], k = [], pc = 0, isComposite = {};
  for (var c = 2; pc < 64; c++) {
    if (!isComposite[c]) {
      for (i = 0; i < 313; i += c) isComposite[i] = c;
      hash[pc] = (mp(c, .5) * maxWord) | 0;
      k[pc++] = (mp(c, 1 / 3) * maxWord) | 0;
    }
  }
  hash = hash.slice(0, 8);
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) {
    j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((bitLen / maxWord) | 0);
  words[words.length] = (bitLen);
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16), old = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
        (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash);
      hash[4] = (hash[4] + t1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? 0 : '') + b.toString(16); }
  return result;
}

function uid(p) { return (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function nowISO() { return new Date().toISOString(); }
function fail(m) { throw new Error(m); }
function str(v, max) { v = (v == null ? '' : String(v)).trim(); return max ? v.slice(0, max) : v; }
function lc(v) { return str(v).toLowerCase(); }
function truthy(v) { return v === true || v === 'true' || v === 1 || v === '1'; }
function pinHash(salt, username, pin) { return sha256(String(salt) + '|' + lc(username) + '|' + String(pin)); }
function makeToken() { return 't' + sha256(uid() + Math.random() + Date.now()).slice(0, 40); }

function publicUser(u) {
  return { id: u.id, propertyCode: u.propertyCode, teamId: u.teamId, username: u.username, name: u.name,
    jobTitle: u.jobTitle, role: u.role, status: u.status, avatarColor: u.avatarColor, createdAt: u.createdAt,
    approvedBy: u.approvedBy || '', approvedAt: u.approvedAt || '', photoV: u.photo ? String(u.photoV || '1') : '' };
}
function isAdmin(u) { return u.role === 'admin'; }
function canSeeTeam(u, teamId) { return isAdmin(u) || u.teamId === teamId; }
function canManageTeam(u, teamId) { return isAdmin(u) || (u.role === 'head' && u.teamId === teamId); }
function findProperty(DB, code) { code = str(code).toUpperCase(); return DB.find('properties', function (p) { return String(p.code).toUpperCase() === code; }); }

function auth(DB, token) {
  if (!token) fail('AUTH');
  var s = DB.get('sessions', token);
  if (!s) fail('AUTH');
  var u = DB.get('users', s.userId);
  if (!u || u.status !== 'active') fail('AUTH');
  return u;
}
function log(DB, u, teamId, type, refId, text, targets) {
  DB.insert('activity', { id: uid('a'), teamId: teamId, userId: u.id, type: type, refId: refId || '', text: text,
    targets: (targets || []).filter(function (t) { return t && t !== u.id; }), createdAt: nowISO() });
}
function headsOf(DB, teamId) {
  return DB.all('users').filter(function (x) { return x.status === 'active' && (x.role === 'admin' || (x.role === 'head' && x.teamId === teamId)); })
    .map(function (x) { return x.id; });
}
function taskOrFail(DB, u, id) {
  var t = DB.get('tasks', id);
  if (!t || !canSeeTeam(u, t.teamId)) fail('That task no longer exists.');
  return t;
}

var ACTIONS = {
  /* ---------- public: no login needed ---------- */
  teams: function (DB, r) {
    var p = findProperty(DB, r.propertyCode);
    if (!p) fail('We could not find property code "' + str(r.propertyCode).toUpperCase() + '". Check the code with your department head.');
    var teams = DB.all('teams').filter(function (t) { return t.propertyCode === p.code; })
      .map(function (t) { return { id: t.id, name: t.name, color: t.color }; })
      .sort(function (a, b) { return a.name < b.name ? -1 : 1; });
    return { property: publicProperty(p), teams: teams };
  },

  signup: function (DB, r) {
    var p = findProperty(DB, r.propertyCode);
    if (!p) fail('Unknown property code.');
    var team = DB.get('teams', r.teamId);
    if (!team || team.propertyCode !== p.code) fail('Choose a team for this property.');
    var name = str(r.name, 60), username = lc(r.username), jobTitle = str(r.jobTitle, 60), pin = str(r.pin);
    if (name.length < 2) fail('Enter your full name.');
    if (!/^[a-z0-9._-]{3,20}$/.test(username)) fail('Username must be 3–20 letters, numbers, dots or dashes.');
    if (!/^\d{4}$/.test(pin)) fail('Your PIN must be exactly 4 digits.');
    var taken = DB.find('users', function (x) { return x.propertyCode === p.code && lc(x.username) === username; });
    if (taken) fail('That username is already taken at ' + p.code + '. Try another.');
    var salt = uid('s');
    var u = { id: uid('u'), propertyCode: p.code, teamId: team.id, username: username, name: name, jobTitle: jobTitle,
      role: 'member', status: 'pending', pinHash: pinHash(salt, username, pin), salt: salt, failed: 0, lockedUntil: '',
      avatarColor: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)], createdAt: nowISO(), approvedBy: '', approvedAt: '' };
    DB.insert('users', u);
    DB.insert('activity', { id: uid('a'), teamId: team.id, userId: u.id, type: 'signup', refId: u.id,
      text: 'asked to join ' + team.name, targets: headsOf(DB, team.id), createdAt: nowISO() });
    return { status: 'pending', team: team.name, property: p.code };
  },

  login: function (DB, r) {
    var p = findProperty(DB, r.propertyCode);
    var username = lc(r.username), pin = str(r.pin);
    if (!p) fail('Unknown property code.');
    var u = DB.find('users', function (x) { return x.propertyCode === p.code && lc(x.username) === username; });
    if (!u) fail('Username or PIN is incorrect.');
    if (u.lockedUntil && new Date(u.lockedUntil) > new Date()) fail('Too many wrong PINs. Try again after 15 minutes, or ask your department head to reset your PIN.');
    if (pinHash(u.salt, u.username, pin) !== u.pinHash) {
      var f = (Number(u.failed) || 0) + 1;
      DB.update('users', u.id, { failed: f, lockedUntil: f >= 5 ? new Date(Date.now() + 15 * 60000).toISOString() : '' });
      fail(f >= 5 ? 'Too many wrong PINs. Your account is locked for 15 minutes.' : 'Username or PIN is incorrect.');
    }
    if (u.status === 'pending') fail('PENDING');
    if (u.status === 'disabled') fail('Your account has been turned off. Contact your department head.');
    DB.update('users', u.id, { failed: 0, lockedUntil: '' });
    var token = makeToken();
    DB.insert('sessions', { id: token, userId: u.id, createdAt: nowISO(), lastSeen: nowISO() });
    return { token: token, user: publicUser(u), photo: u.photo || '', data: ACTIONS.sync(DB, { token: token }) };
  },

  logout: function (DB, r) {
    if (r.token && DB.get('sessions', r.token)) DB.remove('sessions', r.token);
    return { ok: true };
  },

  /* ---------- everything the signed-in person can see ---------- */
  sync: function (DB, r) {
    var u = auth(DB, r.token);
    var admin = isAdmin(u);
    var teams = DB.all('teams').filter(function (t) { return admin || t.id === u.teamId; });
    var teamIds = {}; teams.forEach(function (t) { teamIds[t.id] = 1; });
    var inScope = function (x) { return !!teamIds[x.teamId]; };
    var users = DB.all('users').filter(function (x) {
      if (admin) return true;

/* ---------------- demo storage (this device only) ---------------- */
const LocalDB = (() => {
  const KEY = 'orbit_demo_v1';
  let T = null, mem = false;
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
  function load() {
    if (T) return;
    T = store.get(KEY, null);
    if (!T) { T = {}; seedDemo(api); save(); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(T)); } catch (e) { mem = true; } }
  const api = {
    all: t => { load(); return clone(T[t] || []); },
    get: (t, id) => { load(); return clone((T[t] || []).find(x => x.id === id) || null); },
    find: (t, f) => { load(); return clone((T[t] || []).find(f) || null); },
    insert: (t, o) => { load(); (T[t] = T[t] || []).push(clone(o)); save(); },
    update: (t, id, p) => { load(); const r = (T[t] || []).find(x => x.id === id); if (r) { Object.assign(r, clone(p)); save(); } },
    remove: (t, id) => { load(); T[t] = (T[t] || []).filter(x => x.id !== id); save(); },
    saveFile: (name, type, b64) => ({ url: 'data:' + (type || 'application/octet-stream') + ';base64,' + b64 }),
    reset: () => { T = {}; seedDemo(api); save(); },
    get memoryOnly() { return mem; }
  };
  return api;
})();

const Session = {
  get token() { return (store.get('orbit_session', {}) || {}).token || ''; },
  get user() { return (store.get('orbit_session', {}) || {}).user || null; },
  set(token, user) { store.set('orbit_session', { token, user }); },
  clear() { store.del('orbit_session'); }
};
const API = {
  live: !!CONFIG.API_URL,
  async call(action, payload = {}) {
    const req = Object.assign({ action, token: Session.token }, payload);
    let res;
    if (!this.live) {
      await sleep(40);
      res = coreHandle(LocalDB, JSON.parse(JSON.stringify(req)));
    } else {
      let r;
      try { r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) }); }
      catch (e) { const er = new Error('Can’t reach the server. Check your connection.'); er.net = true; throw er; }
      if (!r.ok) { const er = new Error('The server is busy (' + r.status + '). Trying again shortly.'); er.net = true; throw er; }
      res = await r.json();
    }
    if (!res.ok) {
      if (res.error === 'AUTH' && action !== 'login') signedOut('You were signed out. Sign in again to continue.');
      throw new Error(res.error);
    }
    return res.data;
  },
  /* Last-chance save while the page is closing: the browser finishes this request even after the page is gone. */
  beacon(payload) {
    if (!this.live) return;
    const body = JSON.stringify(Object.assign({ token: Session.token }, payload));
    if (body.length > 60000) return;
    try { fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, keepalive: true }); } catch (e) { }
  }
};

/* ---------------- saving: changes apply on screen at once, then go to the server in the background ---------------- */
const Outbox = {
  q: store.get('orbit_outbox', []),
  busy: false, timer: null, state: 'idle', retry: 0,
  save() { store.set('orbit_outbox', this.q); },
  pendingIds() { const s = new Set(); this.q.forEach(o => { const x = o.task || o.project; if (x && x.id) s.add(x.id); if (o.action === 'addComment') s.add(o.id); }); return s; },
  push(op) {
    this.q.push(op); this.save();
    applyLocal(op);
    this.setState('saving');
    this.kick(120);
  },
  kick(ms) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms || 0); },
  async flush() {
    if (this.busy || !Session.token) return;
    if (!this.q.length) { if (this.state === 'saving') this.setState('idle'); return; }
    this.busy = true; this.setState('saving');
    const batch = this.q.slice(0, 40);
    let res;
    try {
      if (API.noBatch) { res = []; for (const o of batch) { try { res.push({ ok: true, data: await API.call(o.action, o) }); } catch (er) { if (er.net) throw er; res.push({ ok: false, error: er.message }); } } }
      else res = await API.call('batch', { ops: batch });
    }
    catch (e) {

/* Show a change straight away, before the server confirms it. */
function applyLocal(o) {

  switch (o.action) {
    case 'saveTask': {
      const p = o.task, t = taskById(p.id);
      if (t) {
        if (p.status !== undefined && p.status !== t.status) t.completedAt = p.status === 'done' ? now : '';

      } else D().tasks.push(Object.assign({ parentId: '', projectId: '', notes: '', status: 'todo', priority: 'none', assignees: [], due: '', order: Date.now(),
        attachments: [], completedAt: '', createdBy: me().id, createdAt: now, updatedAt: now }, p));

    }
    case 'saveProject': {
      const p = o.project, x = projById(p.id);

      kill(o.id); break;

    case 'deleteProject': {

      S.data.tasks = D().tasks.filter(t => t.projectId !== o.id); S.data.comments = D().comments.filter(c => !ids.includes(c.taskId));
      S.data.projects = D().projects.filter(p => p.id !== o.id); break;
    }
    case 'addComment': {
      if (D().comments.find(c => c.id === o.id)) break;
      const t = taskById(o.taskId);
      D().comments.push({ id: o.id, teamId: t ? t.teamId : '', taskId: o.taskId, userId: me().id, text: o.text, createdAt: now }); break;
    }
    case 'deleteComment': S.data.comments = D().comments.filter(c => c.id !== o.id); break;
    case 'removeAttachment': { const t = taskById(o.taskId); if (t) t.attachments = (t.attachments || []).filter(a => a.id !== o.attId); break; }
    case 'updateUser': {
      const u = D().users.find(x => x.id === o.userId); if (!u) break;

}

function myTasksHtml() {

  const segs = [['open', 'All Open'], ['today', 'Today'], ['overdue', 'Overdue'], ['done', 'Completed']];
  let body = '';
  const sortDue = (a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : (PRIOR(b) - PRIOR(a));
  if (f === 'done') {
    const list = mine.filter(isDone).sort((a, b) => (a.completedAt < b.completedAt ? 1 : -1));
    body = `<div class="menu" style="margin-top:14px">${list.length ? list.map(t => taskRow(t, { showProject: true, pend })).join('') : emptyState('done', 'green', 'Nothing completed yet', 'Tasks you finish will collect here.')}</div>`;
  } else {
    const open = mine.filter(t => !isDone(t)).sort(sortDue);
    const buckets = [['Overdue', t => t.due && dayDiff(t.due) < 0], ['Today', t => t.due && dayDiff(t.due) === 0], ['Tomorrow', t => t.due && dayDiff(t.due) === 1],

/* ---------------- task panel: slides in from the right ---------------- */
function renderInsp(opts = {}) {
  const el = $('#insp');
  const t = S.taskId && S.data ? taskById(S.taskId) : null;
  if (t) {
    const a = document.activeElement;
    if (opts.soft && a && el.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    const same = el.dataset.id === t.id && el.classList.contains('open');
    const sc = $('.insp-scroll', el), keep = same && sc ? sc.scrollTop : 0;
    const draft = $('#cmt', el) ? $('#cmt', el).value : '';
    el.innerHTML = inspectorHtml(t);
    el.dataset.id = t.id;
    el.classList.toggle('steady', same);
    if (same) { $('.insp-scroll', el).scrollTop = keep; if (draft) $('#cmt', el).value = draft; }
    if (!el.classList.contains('open')) {
      el.classList.remove('closing'); el.style.transform = '';
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('open')));
    }
    document.body.classList.add('insp-open');
    autosize();
  } else if (el.classList.contains('open') || el.dataset.id) {
    el.classList.remove('open'); el.classList.add('closing'); el.style.transform = '';
    document.body.classList.remove('insp-open');
    el.dataset.id = '';
    clearTimeout(el._t);
    el._t = setTimeout(() => { if (!el.classList.contains('open')) { el.classList.remove('closing'); el.innerHTML = ''; } }, 600);
  }
}
function inspectorHtml(t) {

  const creator = userById(t.createdBy), pend = Outbox.pendingIds();
  const ass = (t.assignees || []).map(userById).filter(Boolean);

function fileRow(t, a) {

  const by = userById(a.by);

/* On phones the task opens as a sheet from the bottom; drag the top bar down to close it. */
(function dragDown() {
  let y0 = null, dy = 0, el = null, going = false;
  document.addEventListener('touchstart', e => {
    el = $('#insp');
    if (!el || !el.classList.contains('open') || innerWidth >= 1024) return;
    const bar = e.target.closest && e.target.closest('.insp-bar'); const sc = $('#iscroll');
    if (!bar && !(sc && sc.contains(e.target) && sc.scrollTop <= 0)) return;
    if (e.target.closest('button, input, textarea, select')) return;
    y0 = e.touches[0].clientY; dy = 0; going = false;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (!going) { if (dy < 6) return; going = true; }
    el.style.transition = 'none'; el.style.transform = 'translateY(' + dy + 'px)';
  }, { passive: true });
  const end = () => {
    if (y0 === null) return; y0 = null; el.style.transition = '';
    if (going && dy > 110) { S.taskId = null; render({ soft: true }); } else el.style.transform = '';
  };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });
})();

let DLG = null;
function openDialog({ title, body, ok = 'Save', onOk, onOpen, cancel = 'Cancel' }) {
  const root = $('#ov');

  DLG = { onOk };
  root.innerHTML = `<div class="sheet-back" data-dact="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div>

    <div class="sh-b">${body}</div></div>`;

  const f = $('.sheet [autofocus]', root); if (f && innerWidth >= 1024) setTimeout(() => f.focus(), 120);

function closeDialog(now) {
  const root = $('#ov'); DLG = null;
  if (now) { root.innerHTML = ''; return; }
  $$('.sheet-back,.sheet', root).forEach(x => x.classList.remove('in'));

document.addEventListener('click', async e => {

    catch (err) { toast(err.message, true); }
    finally { if (el.isConnected) el.disabled = false; }

});
function confirmBox({ title, msg = '', ok = 'OK', danger = false, cancel = 'Cancel', single = false }) {
  return new Promise(res => {
    const root = $('#alert');
    root.innerHTML = `<div class="alert-back"></div><div class="alert" role="alertdialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${msg ? `<p>${esc(msg)}</p>` : ''}
      <div class="acts">${single ? '' : `<button class="btn" data-r="0">${cancel}</button>`}<button class="btn ${danger ? 'danger' : 'primary'}" data-r="1">${ok}</button></div></div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => $$('.alert-back,.alert', root).forEach(x => x.classList.add('in'))));
    const done = v => { $$('.alert-back,.alert', root).forEach(x => x.classList.remove('in')); setTimeout(() => { root.innerHTML = ''; }, 260); res(v); };
    $$('[data-r]', root).forEach(b => b.onclick = () => done(b.dataset.r === '1'));
    $('.alert-back', root).onclick = () => done(false);
    setTimeout(() => { const b = $('[data-r="1"]', root); b && b.focus(); }, 40);
  });
}
function openMenu(anchor, items) {
  const root = $('#menu');
  const r = anchor.getBoundingClientRect();
  root.innerHTML = `<div style="position:fixed;inset:0;z-index:94" data-mclose="1"></div><div class="menu-pop" role="menu">${items.map((it, i) =>
    it === '-' ? '<hr>' : it.header ? `<div class="mh">${esc(it.header)}</div>` :
      `<button role="menuitem" data-mi="${i}" class="${it.danger ? 'danger' : ''}"><span class="tick">${it.checked ? ic('check', 's') : it.icon ? it.icon : ''}</span><span class="mlbl">${it.html || esc(it.label)}</span></button>`).join('')}</div>`;
  const m = $('.menu-pop', root);

  let left = Math.min(r.left, innerWidth - w - 12), top = r.bottom + 6;
  if (top + h > innerHeight - 12) { top = Math.max(12, r.top - h - 6); m.style.transformOrigin = 'bottom left'; }
  if (left > r.left - 1 && r.right > innerWidth / 2) { left = Math.max(12, r.right - w); m.style.transformOrigin = top < r.top ? 'bottom right' : 'top right'; }
  m.style.left = Math.max(12, left) + 'px'; m.style.top = top + 'px';
  root.onclick = e => {

let toastT;
function toast(msg, err = false, spin = false) {
  const el = $('#toast');

/* ---------------- images: shrink on this device before saving ---------------- */
function readImage(file, { max = 256, square = false, keepAlpha = false, limit = 45000 } = {}) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('Choose an image file (JPG, PNG or WebP).'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
      if (square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; w = h = m; }
      const k = Math.min(1, max / Math.max(w, h)), cw = Math.round(w * k), chh = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = cw; c.height = chh;
      const x = c.getContext('2d');
      if (!keepAlpha) { x.fillStyle = '#fff'; x.fillRect(0, 0, cw, chh); }
      x.imageSmoothingQuality = 'high'; x.drawImage(img, sx, sy, sw, sh, 0, 0, cw, chh);
      let out = keepAlpha ? c.toDataURL('image/png') : '';
      if (!out || out.length > limit) out = c.toDataURL('image/webp', 0.86);
      if (!/^data:image\/webp/.test(out) || out.length > limit) { if (keepAlpha) { x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, cw, chh); } out = c.toDataURL('image/jpeg', 0.84); }
      for (let q = 0.75; out.length > limit && q > 0.3; q -= 0.12) out = c.toDataURL('image/jpeg', q);
      if (out.length > limit) return rej(new Error('That image is too detailed. Try a simpler one.'));
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That image couldn’t be opened.')); };
    img.src = url;
  });
}
function pickImage(opts) {
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => { const f = inp.files[0]; if (!f) return res(null); try { res(await readImage(f, opts)); } catch (e) { toast(e.message, true); res(null); } };
    inp.click();
  });
}

  async delComment(el) { if (!await confirmBox({ title: 'Delete comment?', ok: 'Delete', danger: true })) return; op({ action: 'deleteComment', id: el.dataset.id }); render(); },
  async upload(el) {
    const files = [...el.files]; el.value = '';
    const limit = API.live ? 10 * 1048576 : 1.5 * 1048576, taskId = el.dataset.id;
    for (const f of files) {
      if (f.size > limit) { toast(`${f.name} is larger than ${API.live ? '10 MB' : '1.5 MB (demo limit)'}.`, true); continue; }
      const t = taskById(taskId); if (!t) return;
      const tmp = { id: uidC('f'), name: f.name, size: f.size, uploading: true };
      t.attachments = (t.attachments || []).concat([tmp]); renderInsp();
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
      try {
        if (Outbox.q.length) { await Outbox.flush(); }
        const att = await API.call('upload', { taskId, name: f.name, type: f.type, size: f.size, data });
        const t2 = taskById(taskId); if (t2) t2.attachments = (t2.attachments || []).filter(a => a.id !== tmp.id).concat([att]);
        toast('Uploaded ' + f.name);

        const t2 = taskById(taskId); if (t2) t2.attachments = (t2.attachments || []).filter(a => a.id !== tmp.id);

function swatchesHtml(sel, name) {
  const custom = sel && sel[0] === '#';
  return `<div class="swatches" data-sw-group="${name}">${PCOLORS.map(c => `<button type="button" data-sw="${c}" class="${sel === c ? 'on' : ''}" style="background:${cvar(c)}" aria-label="${c}"></button>`).join('')}
    <label class="${custom ? 'on' : ''}" title="Custom colour" style="${custom ? 'background:' + sel : ''}"><input type="color" value="${custom ? sel : '#1e3a8a'}" aria-label="Custom colour"></label></div>`;
}
function wireSwatches(root, onPick) {
  const box = $('[data-sw-group]', root);
  $$('[data-sw]', box).forEach(b => b.onclick = () => { $$('.on', box).forEach(x => x.classList.remove('on')); b.classList.add('on'); Motion.haptic(); onPick(b.dataset.sw); });
  const lab = $('label', box), inp = $('input', lab);
  inp.oninput = () => { $$('.on', box).forEach(x => x.classList.remove('on')); lab.classList.add('on'); lab.style.background = inp.value; onPick(inp.value); };
}

  openDialog({ title: approving ? 'Approve Request' : 'Team Member', ok: manage ? (approving ? 'Approve' : 'Save') : '', cancel: manage ? 'Cancel' : 'Close', body,
