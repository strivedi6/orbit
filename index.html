    items.push({ label: 'Copy Title', icon: ic('doc', 's'), onClick: () => navigator.clipboard.writeText(t.title).then(() => toast('Copied'), () => toast('Couldn’t copy on this device', true)) });
    if (t.createdBy === me().id || canManage(t.teamId)) items.push('-', { label: 'Delete Task', danger: true, icon: ic('trash', 's'), onClick: async () => {
      if (!await confirmBox({ title: 'Delete this task?', msg: `“${t.title}”, its subtasks, comments and files will be removed for everyone.`, ok: 'Delete', danger: true })) return;
      await run('deleteTask', { id: t.id }, 'Task deleted'); S.taskId = t.parentId || null; await sync();
    } });
    openMenu(el, items);
  },
  async saveTitle(el) { const v = el.value.trim(); const t = taskById(el.dataset.id); if (!v) { el.value = t.title; return; } if (v !== t.title) await saveTask({ id: t.id, title: v }); },
  async saveNotes(el) { const t = taskById(el.dataset.id); if (el.value !== (t.notes || '')) await saveTask({ id: t.id, notes: el.value }); },
  async saveDue(el) { await saveTask({ id: el.dataset.id, due: el.value }); },
  async clearDue(el) { await saveTask({ id: el.dataset.id, due: '' }); },
  pickAssignees(el) {
    const t = taskById(el.dataset.id);
    const people = D().users.filter(u => u.status === 'active' && (u.teamId === t.teamId || u.role === 'admin'));
    const sel = new Set(t.assignees || []);
    openDialog({ title: 'Assign To', ok: 'Done', body: `<p class="label-sm" style="margin-top:4px">Choose one or more people from ${esc(teamLabel(teamById(t.teamId)))}.</p>
      <div class="group teamlist">${people.map(u => `<button class="row ${sel.has(u.id) ? 'on' : ''}" data-pick="${u.id}" style="--inset:60px">${av(u)}<span class="lbl"><div style="font-weight:600">${esc(u.name)}</div><div class="muted" style="font-size:13px">${esc(u.jobTitle || ROLE[u.role])}</div></span><span class="tick">${ic('check')}</span></button>`).join('')}</div>`,
      onOpen: root => $$('[data-pick]', root).forEach(b => b.onclick = () => { b.classList.toggle('on'); }),
      onOk: async root => { const ids = $$('[data-pick].on', root).map(b => b.dataset.pick); await saveTask({ id: t.id, assignees: ids }); } });
  },
  async addSub(el) { const v = el.value.trim(); if (!v) return; el.value = ''; const r = await run('saveTask', { task: { parentId: el.dataset.id, title: v } }); upsert('tasks', r); render(); setTimeout(() => $('#addsub') && $('#addsub').focus(), 0); },
  async quickAdd(el) {
    const v = el.value.trim(); if (!v) return; el.value = '';
    const p = projById(S.projectId);
    const r = await run('saveTask', { task: { projectId: p.id, title: v, status: el.dataset.s, assignees: S.mine ? [me().id] : [] } });
    upsert('tasks', r); const keepId = el.id; render();
    setTimeout(() => { const n = document.getElementById(keepId); n && n.focus(); }, 0);
  },
  addCard(el) { S.addingCol = el.dataset.s; render(); setTimeout(() => $('#addcol') && $('#addcol').focus(), 0); },
  async sendComment(el) {
    const box = $('#cmt'); const v = box.value.trim(); if (!v) return;
    box.value = ''; const r = await run('addComment', { taskId: el.dataset.id, text: v }); upsert('comments', r); render();
    const is = $('.insp-scroll'); if (is) is.scrollTop = is.scrollHeight;
  },
  async delComment(el) { if (!await confirmBox({ title: 'Delete comment?', ok: 'Delete', danger: true })) return; await run('deleteComment', { id: el.dataset.id }); D().comments = D().comments.filter(c => c.id !== el.dataset.id); render(); },
  async upload(el) {
    const files = [...el.files]; el.value = '';
    const limit = API.live ? 10 * 1048576 : 1.5 * 1048576;
    for (const f of files) {
      if (f.size > limit) { toast(`${f.name} is larger than ${API.live ? '10 MB' : '1.5 MB (demo limit)'}.`, true); continue; }
      toast('Uploading ' + f.name + '…');
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
      try { const att = await run('upload', { taskId: el.dataset.id, name: f.name, type: f.type, size: f.size, data }, 'Uploaded ' + f.name); const t = taskById(el.dataset.id); t.attachments = (t.attachments || []).concat([att]); render(); } catch (e) { }
    }
  },
  async removeFile(el) {
    if (!await confirmBox({ title: 'Remove this file?', msg: 'It will be removed from the task for everyone.', ok: 'Remove', danger: true })) return;
    await run('removeAttachment', { taskId: el.dataset.id, attId: el.dataset.f }); const t = taskById(el.dataset.id); t.attachments = t.attachments.filter(a => a.id !== el.dataset.f); render();
  },
  newTask() {
    const pid = S.view === 'project' ? S.projectId : '';
    const projs = projects();
    openDialog({ title: 'New Task', ok: 'Add', body: `<div class="fields" style="margin-top:4px">
      <input class="field" id="nt-title" placeholder="Task title" autofocus aria-label="Task title">
      <textarea class="field" id="nt-notes" placeholder="Notes (optional)" style="min-height:70px" aria-label="Notes"></textarea></div>
      <div class="group" style="margin-top:14px">
        <div class="row"><span class="ico" style="background:var(--indigo)">${ic('folder')}</span><span class="lbl">Project</span><select class="sel" id="nt-proj" aria-label="Project"><option value="">No Project</option>${projs.map(p => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc((p.icon ? p.icon + ' ' : '') + p.name)}</option>`).join('')}</select></div>
        <div class="row"><span class="ico" style="background:var(--orange)">${ic('person')}</span><span class="lbl">Assign to</span><select class="sel" id="nt-who" aria-label="Assign to"></select></div>
        <div class="row"><span class="ico" style="background:var(--red)">${ic('cal')}</span><span class="lbl">Due date</span><input type="date" class="date" id="nt-due" aria-label="Due date"></div>
        <div class="row"><span class="ico" style="background:var(--yellow)">${ic('flag')}</span><span class="lbl">Priority</span><select class="sel" id="nt-prio" aria-label="Priority">${['none', 'low', 'medium', 'high', 'urgent'].map(k => `<option value="${k}">${PRIO[k].l}</option>`).join('')}</select></div>
      </div>`,
      onOpen: root => {
        const fill = () => { const p = projById($('#nt-proj', root).value); const tid = p ? p.teamId : scopeTeamId();
          const people = D().users.filter(u => u.status === 'active' && (u.teamId === tid || u.role === 'admin'));
          $('#nt-who', root).innerHTML = `<option value="">Nobody</option>` + people.map(u => `<option value="${u.id}" ${u.id === me().id ? 'selected' : ''}>${esc(u.name)}${u.id === me().id ? ' (Me)' : ''}</option>`).join(''); };
        fill(); $('#nt-proj', root).onchange = fill;
        $('#nt-title', root).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('[data-dact="ok"]', root).click(); } });
      },
      onOk: async root => {
        const title = $('#nt-title', root).value.trim(); if (!title) { toast('Give the task a title.', true); return false; }
        const who = $('#nt-who', root).value;
        const r = await run('saveTask', { task: { title, notes: $('#nt-notes', root).value, projectId: $('#nt-proj', root).value, teamId: scopeTeamId(),
          assignees: who ? [who] : [], due: $('#nt-due', root).value, priority: $('#nt-prio', root).value } }, 'Task added');
        upsert('tasks', r); S.taskId = r.id; render();
      } });
  },
  newProject() { projectDialog(null); },
  projStatus(el) { const p = projById(S.projectId); openMenu(el, Object.keys(PSTATUS).map(k => ({ html: pillHtml(PSTATUS[k]), checked: p.status === k, onClick: async () => { const r = await run('saveProject', { project: Object.assign({}, p, { status: k }) }); upsert('projects', r); render(); } }))); },
  projMenu(el) {
    const p = projById(S.projectId);
    const items = [{ label: 'Edit Project', icon: ic('pencil', 's'), onClick: () => projectDialog(p) },
      { label: p.archived ? 'Restore Project' : 'Archive Project', icon: ic('archive', 's'), onClick: async () => { const r = await run('saveProject', { project: Object.assign({}, p, { archived: !p.archived }) }, p.archived ? 'Project restored' : 'Project archived'); upsert('projects', r); render(); } }];
    if (p.createdBy === me().id || canManage(p.teamId)) items.push('-', { label: 'Delete Project', danger: true, icon: ic('trash', 's'), onClick: async () => {
      if (!await confirmBox({ title: 'Delete “' + p.name + '”?', msg: 'All of its tasks, comments and file links will be removed for everyone. This can’t be undone.', ok: 'Delete', danger: true })) return;
      await run('deleteProject', { id: p.id }, 'Project deleted'); S.view = 'projects'; S.taskId = null; await sync();
    } });
    openMenu(el, items);
  },
  openActivity(el) {
    const a = D().activity.find(x => x.id === el.dataset.id); if (!a) return;
    if (a.type === 'signup') { S.view = 'team'; S.teamTab = 'requests'; render(); return; }
    if (a.type === 'project' && projById(a.refId)) { S.view = 'project'; S.projectId = a.refId; render(); return; }
    if (taskById(a.refId)) { S.taskId = a.refId; render({ keepInsp: false }); return; }
    toast('That item no longer exists.', true);
  },
  openUser(el) { const u = userById(el.dataset.id); if (u) userDialog(u, false); },
  approveUser(el) { const u = userById(el.dataset.id); if (u) userDialog(u, true); },
  async declineUser(el) {
    const u = userById(el.dataset.id);
    if (!await confirmBox({ title: 'Decline ' + u.name + '?', msg: 'Their request will be removed. They can sign up again later.', ok: 'Decline', danger: true })) return;
    await run('removeUser', { userId: u.id }, 'Request declined'); await sync();
  },
  changePin() {
    openDialog({ title: 'Change PIN', ok: 'Save', body: `<div class="fields" style="margin-top:6px">
      <label class="label-sm" for="cp-old">Current PIN</label><input class="field" id="cp-old" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" autofocus>
      <label class="label-sm" for="cp-new" style="margin-top:8px">New 4-digit PIN</label><input class="field" id="cp-new" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password">
      <label class="label-sm" for="cp-new2" style="margin-top:8px">Confirm new PIN</label><input class="field" id="cp-new2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></div>`,
      onOk: async root => {
        const o = $('#cp-old', root).value, n = $('#cp-new', root).value, n2 = $('#cp-new2', root).value;
        if (n !== n2) { toast('The new PINs don’t match.', true); return false; }
        await run('resetPin', { userId: me().id, oldPin: o, pin: n }, 'PIN changed');
      } });
  },
  theme(el) { const t = el.dataset.t; store.set('orbit_theme', t); applyTheme(); render(); },
  async resetDemo() { if (!await confirmBox({ title: 'Reset demo data?', msg: 'All demo projects and changes on this device go back to the starting example.', ok: 'Reset', danger: true })) return; LocalDB.reset(); signedOut('Demo data reset. Sign in again.'); },
  async signOut() {
    if (!await confirmBox({ title: 'Sign out of ' + CONFIG.APP_NAME + '?', msg: 'You’ll need your property code, username and PIN to sign in again.', ok: 'Sign Out', danger: true })) return;
    try { await API.call('logout'); } catch (e) { }
    signedOut('');
  },
  manageOrg() { orgDialog(); }
};

function projectDialog(p) {
  const isNew = !p; p = p || { name: '', description: '', color: 'blue', icon: '📁', status: 'on_track', due: '' };
  const teams = D().teams;
  openDialog({ title: isNew ? 'New Project' : 'Edit Project', ok: isNew ? 'Create' : 'Save', body: `
    <div style="display:flex;justify-content:center;margin:6px 0 14px"><span class="picon lg" id="pj-prev" style="background:${cvar(p.color)};width:72px;height:72px;border-radius:20px;font-size:36px">${esc(p.icon || '📁')}</span></div>
    <div class="fields"><input class="field" id="pj-name" placeholder="Project name" value="${esc(p.name)}" autofocus aria-label="Project name">
    <textarea class="field" id="pj-desc" placeholder="What is this project about?" style="min-height:70px" aria-label="Description">${esc(p.description || '')}</textarea></div>
    <div class="group-title">Look</div>
    <div class="group"><div class="swatches">${PCOLORS.map(c => `<button data-sw="${c}" class="${p.color === c ? 'on' : ''}" style="background:${cvar(c)}" aria-label="${c}"></button>`).join('')}</div>
      <div class="emojis">${PICONS.map(e => `<button data-em="${e}" class="${p.icon === e ? 'on' : ''}" aria-label="Icon ${e}">${e}</button>`).join('')}</div></div>
    <div class="group-title">Details</div>
    <div class="group">
      ${isNew && isAdminU() ? `<div class="row"><span class="ico" style="background:var(--indigo)">${ic('people')}</span><span class="lbl">Team</span><select class="sel" id="pj-team" aria-label="Team">${teams.map(t => `<option value="${t.id}" ${t.id === scopeTeamId() ? 'selected' : ''}>${esc(teamLabel(t))}</option>`).join('')}</select></div>` : ''}
      <div class="row"><span class="ico" style="background:var(--green)">${ic('flag')}</span><span class="lbl">Status</span><select class="sel" id="pj-status" aria-label="Status">${Object.keys(PSTATUS).map(k => `<option value="${k}" ${p.status === k ? 'selected' : ''}>${PSTATUS[k].l}</option>`).join('')}</select></div>
      <div class="row"><span class="ico" style="background:var(--red)">${ic('cal')}</span><span class="lbl">Deadline</span><input type="date" class="date" id="pj-due" value="${esc(p.due || '')}" aria-label="Deadline"></div>
    </div>`,
    onOpen: root => {
      let color = p.color, icon = p.icon;
      const prev = $('#pj-prev', root);
      $$('[data-sw]', root).forEach(b => b.onclick = () => { $$('[data-sw]', root).forEach(x => x.classList.remove('on')); b.classList.add('on'); color = b.dataset.sw; prev.style.background = cvar(color); root.dataset.color = color; });
      $$('[data-em]', root).forEach(b => b.onclick = () => { $$('[data-em]', root).forEach(x => x.classList.remove('on')); b.classList.add('on'); icon = b.dataset.em; prev.textContent = icon; root.dataset.icon = icon; });
      root.dataset.color = color; root.dataset.icon = icon;
    },
    onOk: async root => {
      const name = $('#pj-name', root).value.trim(); if (!name) { toast('Give the project a name.', true); return false; }
      const obj = Object.assign({}, isNew ? {} : p, { name, description: $('#pj-desc', root).value, color: root.dataset.color, icon: root.dataset.icon,
        status: $('#pj-status', root).value, due: $('#pj-due', root).value });
      if (isNew) obj.teamId = $('#pj-team', root) ? $('#pj-team', root).value : scopeTeamId();
      const r = await run('saveProject', { project: obj }, isNew ? 'Project created' : 'Project saved');
      upsert('projects', r);
      if (isNew) { S.view = 'project'; S.projectId = r.id; S.mode = S.mode || 'list'; }
      render();
    } });
}

function userDialog(u, approving) {
  const manage = canManage(u.teamId) && !(u.role === 'admin' && !isAdminU());
  const self = u.id === me().id;
  const roles = isAdminU() ? ['member', 'head', 'admin'] : ['member', 'head'];
  const body = `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 10px;text-align:center">${av(u, 'xl')}
      <div style="font-size:22px;font-weight:700">${esc(u.name)}</div><div class="muted">@${esc(u.username)} · ${esc(teamLabel(teamById(u.teamId)))}</div>${roleChip(u)}</div>
    ${manage ? `<div class="group-title">Job Title</div><input class="field" id="ud-job" value="${esc(u.jobTitle || '')}" placeholder="e.g. Graphic Designer" aria-label="Job title">
      ${self ? '' : `<div class="group-title">Role</div><div class="seg" id="ud-role" style="display:flex">${roles.map(r => `<button data-role="${r}" class="${(u.role || 'member') === r ? 'on' : ''}" style="flex:1">${ROLE[r]}</button>`).join('')}</div>
      <p class="group-foot">Department heads can approve people, assign roles and manage their team.${isAdminU() ? ' Main admins see every team.' : ''}</p>`}
      ${isAdminU() && !self ? `<div class="group-title">Team</div><div class="group"><div class="row"><span class="lbl">Team</span><select class="sel" id="ud-team" aria-label="Team" style="max-width:240px">${D().teams.map(t => `<option value="${t.id}" ${t.id === u.teamId ? 'selected' : ''}>${esc(teamLabel(t))}</option>`).join('')}</select></div></div>` : ''}
      ${approving || self ? '' : `<div class="group-title">Access</div><div class="group">
        <div class="row"><span class="ico" style="background:var(--blue)">${ic('lock')}</span><span class="lbl">Reset PIN</span><input class="field gray" id="ud-pin" type="password" inputmode="numeric" maxlength="4" placeholder="New PIN" style="width:110px;height:34px;font-size:15px" aria-label="New PIN"><button class="btn tinted" data-act-local="pin" style="height:32px">Set</button></div>
        <button class="row" data-act-local="toggle"><span class="ico" style="background:var(--gray)">${ic('power')}</span><span class="lbl">${u.status === 'disabled' ? 'Turn On Account' : 'Turn Off Account'}</span></button>
        <button class="row" data-act-local="remove" style="color:var(--red)"><span class="ico" style="background:var(--red)">${ic('trash')}</span><span class="lbl">Remove from ${CONFIG.APP_NAME}</span></button></div>`}`
    : `<div class="group" style="margin-top:12px"><div class="row"><span class="lbl">Job title</span><span class="val"><span>${esc(u.jobTitle || '—')}</span></span></div>
       <div class="row"><span class="lbl">Open tasks</span><span class="val tnum">${D().tasks.filter(t => (t.assignees || []).includes(u.id) && !isDone(t)).length}</span></div></div>`}`;
  openDialog({ title: approving ? 'Approve Request' : 'Team Member', ok: manage ? (approving ? 'Approve' : 'Save') : '', cancel: manage ? 'Cancel' : 'Close', body,
    onOpen: root => {
      $$('[data-role]', root).forEach(b => b.onclick = () => { $$('[data-role]', root).forEach(x => x.classList.remove('on')); b.classList.add('on'); });
      $$('[data-act-local]', root).forEach(b => b.onclick = async () => {
        const k = b.dataset.actLocal;
        try {
          if (k === 'pin') { const pin = $('#ud-pin', root).value; await run('resetPin', { userId: u.id, pin }, 'PIN reset for ' + u.name.split(' ')[0]); $('#ud-pin', root).value = ''; }
          if (k === 'toggle') { await run('updateUser', { userId: u.id, patch: { status: u.status === 'disabled' ? 'active' : 'disabled' } }, u.status === 'disabled' ? 'Account turned on' : 'Account turned off'); closeDialog(); sync(); }
          if (k === 'remove') { if (!await confirmBox({ title: 'Remove ' + u.name + '?', msg: 'They’ll be signed out and lose access. Their tasks and comments stay.', ok: 'Remove', danger: true })) return;
            await run('removeUser', { userId: u.id }, 'Removed ' + u.name); closeDialog(); sync(); }
        } catch (e) { }
      });
    },
    onOk: async root => {
      const patch = { jobTitle: $('#ud-job', root).value };
      const r = $('#ud-role .on', root); if (r) patch.role = r.dataset.role;
      const tm = $('#ud-team', root); if (tm) patch.teamId = tm.value;
      if (approving) patch.status = 'active';
      await run('updateUser', { userId: u.id, patch }, approving ? u.name.split(' ')[0] + ' can now sign in' : 'Saved');
      await sync();
    } });
}

function orgDialog() {
  const body = () => D().properties.map(p => `<div class="group-title">${esc(p.code)} · ${esc(p.name)}</div><div class="group">
      ${D().teams.filter(t => t.propertyCode === p.code).map(t => { const n = D().users.filter(u => u.teamId === t.id).length;
        return `<div class="row"><span class="dot" style="background:${cvar(t.color)}"></span><span class="lbl">${esc(t.name)}</span><span class="val tnum">${n} ${n === 1 ? 'person' : 'people'}</span>
        ${n ? '' : `<button class="ibtn" data-org="delteam" data-id="${t.id}" aria-label="Delete team ${esc(t.name)}">${ic('trash', 's')}</button>`}</div>`; }).join('')}
      <div class="addrow">${ic('plus')}<input placeholder="Add team" data-org-add="${esc(p.code)}" aria-label="Add team to ${esc(p.code)}"></div></div>`).join('') +
    `<div class="group-title">Add Property</div><div class="fields"><input class="field" id="op-code" placeholder="Property code, e.g. DXBPI" style="text-transform:uppercase" aria-label="Property code">
      <input class="field" id="op-name" placeholder="Property name" aria-label="Property name"><button class="btn primary" data-org="addprop" style="height:44px">Add Property</button></div>
      <p class="group-foot">People type the property code when they sign up, then choose their team.</p>`;
  const wire = root => {
    $$('[data-org-add]', root).forEach(i => i.onkeydown = async e => { if (e.key !== 'Enter' || !i.value.trim()) return;
      try { await run('saveTeam', { team: { propertyCode: i.dataset.orgAdd, name: i.value.trim(), color: PCOLORS[Math.floor(Math.random() * 10)] } }, 'Team added'); await sync(); $('.dlg-body', root).innerHTML = body(); wire(root); } catch (e) { } });
    $$('[data-org="delteam"]', root).forEach(b => b.onclick = async () => { try { await run('deleteTeam', { id: b.dataset.id }, 'Team deleted'); await sync(); $('.dlg-body', root).innerHTML = body(); wire(root); } catch (e) { } });
    const ap = $('[data-org="addprop"]', root); if (ap) ap.onclick = async () => { try { await run('saveProperty', { property: { code: $('#op-code', root).value, name: $('#op-name', root).value } }, 'Property added'); await sync(); $('.dlg-body', root).innerHTML = body(); wire(root); } catch (e) { } };
  };
  openDialog({ title: 'Properties & Teams', ok: '', cancel: 'Done', body: body(), onOpen: wire });
}

/* ---------------- auth screens ---------------- */
const last = store.get('orbit_last', {});
const A = { step: last.code ? 'signin' : 'welcome', code: last.code || '', username: last.username || '', pin: '', name: '', jobTitle: '', pin2: '', property: null, teams: [], teamId: '', err: '', busy: false };
function pinField(id, label) {
  return `<div class="pin-wrap"><label class="label-sm" for="${id}">${label}</label><div class="pin" data-pinbox="${id}">${'<i></i>'.repeat(4)}
    <input id="${id}" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" data-input="pin" aria-label="${label}"></div></div>`;
}
function renderAuth() {
  const demo = !API.live ? `<div class="demo"><b>Preview with sample data.</b> Property <code>DXBAI</code> · <code>shri</code> / <code>1234</code> (main admin), <code>aisha</code> / <code>1111</code> (department head), <code>rahul</code> / <code>2222</code> (team member).</div>` : '';
  const back = to => `<button class="btn plain back" data-auth="${to}">${ic('chevL', 's')} Back</button>`;
  const err = A.err ? `<div class="err" role="alert">${esc(A.err)}</div>` : '';
  let c = '';
  switch (A.step) {
    case 'welcome':
      c = `<div class="auth-hero"><span class="app-icon">${ic('orbit')}</span><h1>${CONFIG.APP_NAME}</h1><p>Projects, tasks and deadlines for every team at your property.</p></div>
        <button class="btn primary large" data-auth="signin">Sign In</button><button class="btn gray large" data-auth="code">Create Account</button>${demo}`;
      break;
    case 'signin':
      c = `${back('welcome')}<div class="auth-hero" style="padding-top:0"><h1>Sign In</h1><p>Use your property code, username and PIN.</p></div>
        <div class="fields"><input class="field" id="a-code" placeholder="Property code" value="${esc(A.code)}" autocapitalize="characters" autocomplete="organization" aria-label="Property code" style="text-transform:uppercase">
        <input class="field" id="a-user" placeholder="Username" value="${esc(A.username)}" autocapitalize="none" autocomplete="username" aria-label="Username"></div>
        ${pinField('a-pin', 'PIN')}${err}
        <button class="btn primary large" data-auth="doSignin" ${A.busy ? 'disabled' : ''}>${A.busy ? '<span class="spin" style="border-top-color:#fff;width:18px;height:18px"></span>' : 'Sign In'}</button>
        <p class="fine">Forgot your PIN? Ask your department head to reset it.</p>${demo}`;
      break;
    case 'code':
      c = `${back('welcome')}<div class="auth-hero" style="padding-top:0"><span class="app-icon" style="width:64px;height:64px;border-radius:17px">${ic('building')}</span><h1>Your Property</h1><p>Enter the code your department head shared, such as DXBAI.</p></div>
        <input class="field" id="a-code" placeholder="Property code" value="${esc(A.code)}" autocapitalize="characters" aria-label="Property code" style="text-transform:uppercase;text-align:center;letter-spacing:.12em;font-weight:600">
        ${err}<button class="btn primary large" data-auth="doCode" ${A.busy ? 'disabled' : ''}>${A.busy ? 'Checking…' : 'Continue'}</button>${demo}`;
      break;
    case 'team':
      c = `${back('code')}<div class="auth-hero" style="padding-top:0"><h1>Choose Your Team</h1><p>${esc(A.property.name)}</p></div>
        <div class="group teamlist">${A.teams.map(t => `<button class="row ${A.teamId === t.id ? 'on' : ''}" data-auth="pickTeam" data-id="${t.id}"><span class="dot" style="background:${cvar(t.color)}"></span><span class="lbl">${esc(t.name)}</span><span class="tick">${ic('check')}</span></button>`).join('') || '<div class="row muted">This property has no teams yet. Ask the main admin to add one.</div>'}</div>
        ${err}<button class="btn primary large" data-auth="toDetails" ${A.teamId ? '' : 'disabled'}>Continue</button>`;
      break;
    case 'details': {
      const team = A.teams.find(t => t.id === A.teamId);
      c = `${back('team')}<div class="auth-hero" style="padding-top:0"><h1>Create Account</h1><p>${esc(A.property.code)} · ${esc(team ? team.name : '')}</p></div>
        <div class="fields"><input class="field" id="a-name" placeholder="Full name" value="${esc(A.name)}" autocomplete="name" aria-label="Full name">
        <input class="field" id="a-job" placeholder="Job title (optional)" value="${esc(A.jobTitle)}" aria-label="Job title">
        <input class="field" id="a-user" placeholder="Choose a username" value="${esc(A.username)}" autocapitalize="none" autocomplete="username" aria-label="Username"></div>
        ${pinField('a-pin', 'Choose a 4-digit PIN')}${pinField('a-pin2', 'Confirm PIN')}${err}
        <button class="btn primary large" data-auth="doSignup" ${A.busy ? 'disabled' : ''}>${A.busy ? 'Sending…' : 'Request Access'}</button>
        <p class="fine">Your department head or the main admin approves new accounts.</p>`;
      break;
    }
    case 'sent':
    case 'pending':
      c = `<div class="auth-hero"><span class="app-icon" style="background:linear-gradient(150deg,var(--orange),var(--pink))">${ic('clock')}</span>
        <h1>${A.step === 'sent' ? 'Request Sent' : 'Waiting for Approval'}</h1>
        <p>${A.step === 'sent' ? 'Your department head or the main admin will approve your account. Once approved, sign in with your username and PIN.' : 'Your account hasn’t been approved yet. Ask your department head to approve it under Team › Requests.'}</p></div>
        <button class="btn primary large" data-auth="signin">Back to Sign In</button>`;
      break;
  }
  app().innerHTML = `<div class="auth"><div class="auth-card glass">${c}</div></div>`;
  $$('[data-pinbox]').forEach(b => { const inp = $('input', b); dots(b, inp.value); });
  const f = $('.auth input:not([type=tel])') || $('.auth input');
  if (f && window.innerWidth > 899) f.focus();
}
function dots(box, v) { $$('i', box).forEach((d, i) => d.classList.toggle('on', i < v.length)); }
function shakePins() { $$('.pin').forEach(p => { p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); }); }
const AUTH = {
  welcome() { A.step = 'welcome'; A.err = ''; renderAuth(); },
  signin() { A.step = 'signin'; A.err = ''; renderAuth(); },
  code() { A.step = 'code'; A.err = ''; renderAuth(); },
  team() { A.step = 'team'; A.err = ''; renderAuth(); },
  async doSignin() {
    A.code = $('#a-code').value.trim().toUpperCase(); A.username = $('#a-user').value.trim().toLowerCase(); const pin = $('#a-pin').value;
    if (!A.code || !A.username) { A.err = 'Enter your property code and username.'; renderAuth(); return; }
    if (pin.length !== 4) { A.err = 'Enter your 4-digit PIN.'; renderAuth(); shakePins(); return; }
    A.busy = true; A.err = ''; renderAuth();
    try {
      const r = await API.call('login', { propertyCode: A.code, username: A.username, pin });
      store.set('orbit_last', { code: A.code, username: A.username });
      Session.set(r.token, r.user); A.busy = false; S.view = 'home'; S.scope = store.get('orbit_scope', 'all');
      render(); await sync();
    } catch (e) {
      A.busy = false;
      if (e.message === 'PENDING') { A.step = 'pending'; A.err = ''; renderAuth(); return; }
      A.err = e.message; renderAuth(); shakePins();
    }
  },
  async doCode() {
    A.code = $('#a-code').value.trim().toUpperCase();
    if (!A.code) { A.err = 'Enter your property code.'; renderAuth(); return; }
    A.busy = true; A.err = ''; renderAuth();
    try { const r = await API.call('teams', { propertyCode: A.code }); A.property = r.property; A.teams = r.teams; A.teamId = ''; A.step = 'team'; }
    catch (e) { A.err = e.message; }
    A.busy = false; renderAuth();
  },
  pickTeam(el) { A.teamId = el.dataset.id; renderAuth(); },
  toDetails() { if (!A.teamId) return; A.step = 'details'; A.err = ''; A.username = ''; renderAuth(); },
  async doSignup() {
    A.name = $('#a-name').value.trim(); A.jobTitle = $('#a-job').value.trim(); A.username = $('#a-user').value.trim().toLowerCase();
    const pin = $('#a-pin').value, pin2 = $('#a-pin2').value;
    if (pin.length !== 4) { A.err = 'Choose a 4-digit PIN.'; renderAuth(); shakePins(); return; }
    if (pin !== pin2) { A.err = 'The two PINs don’t match.'; renderAuth(); shakePins(); return; }
    A.busy = true; A.err = ''; renderAuth();
    try { await API.call('signup', { propertyCode: A.code, teamId: A.teamId, name: A.name, jobTitle: A.jobTitle, username: A.username, pin });
      store.set('orbit_last', { code: A.code, username: A.username }); A.step = 'sent'; }
    catch (e) { A.err = e.message; }
    A.busy = false; renderAuth();
  }
};

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-auth]');
  if (a) { AUTH[a.dataset.auth](a, e); return; }
  if (e.target.closest('#ov [data-dact], #menu, #alert')) return;
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.closest('#ov') && !['openTask', 'openProject'].includes(el.dataset.act)) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.stopPropagation(); Promise.resolve().then(() => fn(el, e)).catch(() => { }); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.enter && ACT[t.dataset.enter]) { e.preventDefault(); ACT[t.dataset.enter](t); return; }
  if (e.key === 'Enter' && !e.shiftKey && t.dataset && t.dataset.enterSend && window.innerWidth > 899) { e.preventDefault(); ACT.sendComment(t); return; }
  if (e.key === 'Enter' && t.id === 'ttl') { e.preventDefault(); t.blur(); return; }
  if (e.key === 'Enter' && t.closest && t.closest('.auth') && t.tagName === 'INPUT') {
    const btn = $('.auth .btn.primary'); if (btn && !btn.disabled) btn.click(); return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role=button][data-act]')) { e.preventDefault(); t.click(); return; }
  if (e.key === 'Escape') {
    if ($('#alert').innerHTML) { $('#alert').innerHTML = ''; return; }
    if ($('#menu').innerHTML) { $('#menu').innerHTML = ''; return; }
    if (DLG) { closeDialog(); return; }
    if (S.addingCol) { S.addingCol = null; render(); return; }
    if (S.taskId) { S.taskId = null; render(); }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const q = $('#q'); if (q && q.offsetParent) q.focus(); else ACT.go({ dataset: { v: 'search' } }); }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.change && ACT[t.dataset.change]) ACT[t.dataset.change](t); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.input === 'pin') { t.value = t.value.replace(/\D/g, '').slice(0, 4); dots(t.closest('.pin'), t.value);
    if (t.value.length === 4 && A.step === 'signin') AUTH.doSignin();
    if (t.value.length === 4 && t.id === 'a-pin' && A.step === 'details') $('#a-pin2') && $('#a-pin2').focus(); }
  if (t.dataset.input === 'search') { S.q = t.value.trim(); renderContent(); }
  if (t.dataset.input === 'search2') { S.q = t.value.trim(); const r = $('#results'); if (r) r.innerHTML = S.q ? searchResultsHtml(S.q, true) : ''; }
  if (t.classList.contains('ttl-edit') || t.id === 'cmt') autosize();
});
document.addEventListener('focusout', e => { if (e.target.id === 'addcol' && !e.target.value.trim()) setTimeout(() => { if (S.addingCol) { S.addingCol = null; render(); } }, 150); });
function autosize() { $$('.ttl-edit, #cmt').forEach(t => { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, t.id === 'cmt' ? 140 : 400) + 'px'; }); }
function onScrollTitle() { const sc = $('#sc'), tb = $('#tb'); if (sc && tb) tb.classList.toggle('scrolled', sc.scrollTop > 44); }
document.addEventListener('scroll', e => { if (e.target.id === 'sc') onScrollTitle(); }, true);

/* board drag & drop */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return; dragId = c.dataset.drag; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) { } });
document.addEventListener('dragend', e => { const c = e.target.closest && e.target.closest('[data-drag]'); c && c.classList.remove('dragging'); $$('.col.drop').forEach(x => x.classList.remove('drop')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-col]'); if (!col || !dragId) return; e.preventDefault(); $$('.col.drop').forEach(x => x !== col && x.classList.remove('drop')); col.classList.add('drop'); });
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('[data-col]'); if (!col || !dragId) return; e.preventDefault();
  const t = taskById(dragId); const st = col.dataset.col; dragId = null; col.classList.remove('drop');
  if (t && t.status !== st) saveTask({ id: t.id, status: st, order: Date.now() }, 'Moved to ' + STATUS[st].l);
});

/* theme */
function applyTheme() { const t = store.get('orbit_theme', 'system'); if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }

/* boot */
applyTheme();
document.addEventListener('visibilitychange', () => { if (!document.hidden && Session.token && API.live) sync({ soft: true }); });
setInterval(() => { if (!document.hidden && Session.token && API.live) sync({ soft: true }); }, 30000);
render();
if (Session.token) sync();

</script>
<script>if('serviceWorker' in navigator && location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
