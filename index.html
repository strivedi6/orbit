<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit Projects</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
[hidden]{display:none!important}
/* Layout concept: macOS Tahoe window on desktop (floating Liquid Glass sidebar · content · inspector),
   iOS 27 on phones (large titles · floating glass tab bar · bottom sheets). Apple system colors & SF type. */
:root{
  --blue:#0088FF; --red:#FF383C; --orange:#FF8D28; --yellow:#FFCC00; --green:#34C759; --mint:#00C8B3;
  --teal:#00C3D0; --cyan:#00C0E8; --indigo:#6155F5; --purple:#CB30E0; --pink:#FF2D55; --brown:#AC7F5E; --gray:#8E8E93;
  --accent:var(--blue);
  --bg:#F2F2F7; --bg2:#FFFFFF; --bg3:#F2F2F7; --elev:#FFFFFF;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --label4:rgba(60,60,67,.18);
  --sep:rgba(60,60,67,.18); --sep-strong:rgba(60,60,67,.29);
  --fill:rgba(120,120,128,.2); --fill2:rgba(120,120,128,.16); --fill3:rgba(118,118,128,.12); --fill4:rgba(116,116,128,.08);
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.82); --glass-edge:rgba(255,255,255,.75);
  --glass-shadow:0 10px 40px rgba(20,20,40,.12), 0 1px 2px rgba(20,20,40,.06);
  --sidebar:rgba(240,240,246,.66);
  --wall-a:rgba(0,136,255,.16); --wall-b:rgba(203,48,224,.12); --wall-c:rgba(0,200,179,.12);
  --scrim:rgba(0,0,0,.22);
  --on-accent:#FFFFFF;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-round:ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --r-xl:34px; --r-lg:26px; --r-md:18px; --r-sm:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --blue:#0091FF; --red:#FF4245; --orange:#FF9230; --yellow:#FFD600; --green:#30D158; --mint:#00DAC3;
  --teal:#00D2E0; --cyan:#3CD3FE; --indigo:#6D7CFF; --purple:#DB34F2; --pink:#FF375F; --brown:#B78A66; --gray:#98989D;
  --bg:#000000; --bg2:#1C1C1E; --bg3:#2C2C2E; --elev:#1C1C1E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --label4:rgba(235,235,245,.16);
  --sep:rgba(84,84,88,.45); --sep-strong:rgba(84,84,88,.65);
  --fill:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.32); --fill3:rgba(118,118,128,.24); --fill4:rgba(116,116,128,.18);
  --glass:rgba(44,44,48,.55); --glass-hi:rgba(58,58,62,.78); --glass-edge:rgba(255,255,255,.12);
  --glass-shadow:0 10px 40px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);
  --sidebar:rgba(28,28,30,.66);
  --wall-a:rgba(0,145,255,.18); --wall-b:rgba(219,52,242,.12); --wall-c:rgba(0,218,195,.10);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --blue:#0091FF; --red:#FF4245; --orange:#FF9230; --yellow:#FFD600; --green:#30D158; --mint:#00DAC3;
  --teal:#00D2E0; --cyan:#3CD3FE; --indigo:#6D7CFF; --purple:#DB34F2; --pink:#FF375F; --brown:#B78A66; --gray:#98989D;
  --bg:#000000; --bg2:#1C1C1E; --bg3:#2C2C2E; --elev:#1C1C1E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --label4:rgba(235,235,245,.16);
  --sep:rgba(84,84,88,.45); --sep-strong:rgba(84,84,88,.65);
  --fill:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.32); --fill3:rgba(118,118,128,.24); --fill4:rgba(116,116,128,.18);
  --glass:rgba(44,44,48,.55); --glass-hi:rgba(58,58,62,.78); --glass-edge:rgba(255,255,255,.12);
  --glass-shadow:0 10px 40px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);
  --sidebar:rgba(28,28,30,.66);
  --wall-a:rgba(0,145,255,.18); --wall-b:rgba(219,52,242,.12); --wall-c:rgba(0,218,195,.10);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}
svg.i.xs{width:13px;height:13px;stroke-width:2.2}
svg.i.l{width:24px;height:24px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--label2)}
.faint{color:var(--label3)}

/* ---------- wallpaper ---------- */
.wall{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60vw 50vh at 8% 0%, var(--wall-a), transparent 70%),
    radial-gradient(50vw 50vh at 100% 20%, var(--wall-b), transparent 70%),
    radial-gradient(60vw 50vh at 40% 110%, var(--wall-c), transparent 70%), var(--bg)}

/* ---------- glass ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);
  border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.35)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;
  font-weight:600;font-size:15px;white-space:nowrap;transition:transform .12s ease, background .2s, opacity .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.tinted{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.btn.gray{background:var(--fill3);color:var(--label)}
.btn.plain{color:var(--accent);padding:0 8px}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn.large{height:50px;font-size:17px;padding:0 22px;width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.glassy{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border:.5px solid var(--glass-edge);box-shadow:0 2px 12px rgba(0,0,0,.08);color:var(--label)}
.ibtn{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:var(--label);transition:transform .12s, background .2s}
.ibtn:hover{background:var(--fill4)}
.ibtn:active{transform:scale(.92)}
.ibtn.glassy{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border:.5px solid var(--glass-edge);box-shadow:0 2px 12px rgba(0,0,0,.08);width:44px;height:44px}
.ibtn.accent{background:var(--accent);color:var(--on-accent)}
.ibtn.accent:hover{background:var(--accent)}

/* ---------- segmented ---------- */
.seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--fill3);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:30px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--label);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--elev);box-shadow:0 2px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg .count{font-size:11px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;display:inline-grid;place-items:center;padding:0 5px}

/* ---------- grouped lists ---------- */
.group{background:var(--bg2);border-radius:var(--r-lg);overflow:hidden}
.group-title{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;margin:22px 18px 7px;display:flex;align-items:center;gap:8px}
.group-title .sp{flex:1}
.group-foot{font-size:13px;color:var(--label2);margin:7px 18px 0}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 16px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
button.row:hover,.row.tap:hover{background:var(--fill4)}
.row .lbl{flex:1;min-width:0}
.row .val{color:var(--label2);display:flex;align-items:center;gap:6px;text-align:right;min-width:0}
.row .val span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--label3)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg.i{width:17px;height:17px;stroke-width:2}

/* ---------- inputs ---------- */
.field{display:block;width:100%;height:50px;padding:0 16px;border-radius:var(--r-sm);border:0;background:var(--bg2);font-size:17px;outline:none}
.field:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.field.gray{background:var(--fill4)}
textarea.field{height:auto;min-height:90px;padding:12px 16px;resize:vertical;line-height:1.4}
.inline-input{border:0;outline:none;background:transparent;width:100%;font-size:inherit;padding:0}
select.sel{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--label2);text-align:right;text-align-last:right;
  font-size:15px;padding-right:2px;outline:none;cursor:pointer;max-width:200px}
input.date{border:0;background:var(--fill3);border-radius:8px;padding:5px 9px;font-size:15px;color:var(--label);outline:none}
.label-sm{font-size:13px;color:var(--label2);margin:0 4px 6px;display:block}

/* ---------- avatars & chips ---------- */
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none;
  font-family:var(--font-round);letter-spacing:.02em;box-shadow:inset 0 -6px 12px rgba(0,0,0,.12)}
.av.lg{width:44px;height:44px;font-size:16px}
.av.xl{width:72px;height:72px;font-size:26px}
.av.sm{width:22px;height:22px;font-size:9px}
.avs{display:inline-flex}
.avs .av{box-shadow:0 0 0 2px var(--bg2)}
.avs .av + .av{margin-left:-7px}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.badge{min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.badge.gray{background:var(--fill);color:var(--label2)}

/* ---------- check circle (Reminders) ---------- */
.check{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--label3);display:grid;place-items:center;flex:none;color:transparent;transition:all .18s}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check svg{width:14px;height:14px;stroke-width:3}
.check.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.25)}}

/* ---------- app shell ---------- */
#app{position:relative;z-index:1;height:100%}
.shell{height:100%;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:276px minmax(0,1fr);transition:grid-template-columns .3s ease}
.shell.with-insp{grid-template-columns:276px minmax(0,1fr) 420px}
.sidebar{margin:10px 0 10px 10px;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;
  background:var(--sidebar);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%);
  border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.sb-head{padding:16px 14px 8px;display:flex;align-items:center;gap:10px}
.appmark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(150deg,var(--blue),var(--indigo));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.15)}
.appmark svg{width:18px;height:18px;stroke-width:2.2}
.sb-title{font-weight:700;font-size:16px;letter-spacing:-.02em}
.sb-sub{font-size:12px;color:var(--label2)}
.sb-scroll{flex:1;overflow:auto;padding:4px 10px 10px;scrollbar-width:thin}
.sb-sec{font-size:12px;font-weight:600;color:var(--label2);padding:14px 10px 5px;display:flex;align-items:center;justify-content:space-between}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:10px;font-size:14px;text-align:left;color:var(--label)}
.sb-item:hover{background:var(--fill4)}
.sb-item.on{background:var(--fill2);font-weight:600}
.sb-item .i{color:var(--accent)}
.sb-item .n{margin-left:auto;font-size:13px;color:var(--label2)}
.sb-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdot{width:12px;height:12px;border-radius:4px;flex:none}
.scope{margin:2px 10px 4px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;background:var(--fill4);font-size:13px;font-weight:600;width:calc(100% - 20px)}
.scope .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.sb-foot{padding:10px;border-top:.5px solid var(--sep)}
.me-btn{display:flex;align-items:center;gap:10px;width:100%;padding:6px;border-radius:12px;text-align:left}
.me-btn:hover{background:var(--fill4)}
.me-btn .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn .jt{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{min-width:0;display:flex;flex-direction:column;height:100%;position:relative}
.toolbar{display:flex;align-items:center;gap:10px;padding:14px 22px 10px;min-height:62px}
.toolbar .tt{font-size:20px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.toolbar .tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--fill3);width:220px;color:var(--label2)}
.search input{border:0;outline:none;background:transparent;width:100%;font-size:14px;color:var(--label)}
.scroll{flex:1;overflow:auto;padding:0 22px 40px;scroll-behavior:smooth}
.page{max-width:980px;margin:0 auto}
.page.wide{max-width:none}
.large-title{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:6px 4px 4px;text-wrap:balance}
.subhead{color:var(--label2);margin:0 4px 18px;font-size:15px}
.mob-only{display:none}
.desk-only{}
.scope-pill{display:none!important}

/* ---------- home ---------- */
.smart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.smart button{background:var(--bg2);border-radius:20px;padding:12px 14px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .15s}
.smart button:active{transform:scale(.97)}
.smart .top{display:flex;align-items:center;justify-content:space-between}
.smart .ico{width:34px;height:34px;border-radius:50%}
.smart .num{font-family:var(--font-round);font-size:28px;font-weight:700;line-height:1}
.smart .nm{font-size:15px;font-weight:600;color:var(--label2)}
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:color-mix(in srgb,var(--orange) 14%,var(--bg2));margin-top:14px;width:100%;text-align:left}
.banner .t{font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{background:var(--bg2);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0;transition:transform .15s, box-shadow .2s}
.pcard:hover{box-shadow:0 6px 24px rgba(0,0,0,.08)}
.pcard:active{transform:scale(.98)}
.pcard .hd{display:flex;align-items:center;gap:10px;min-width:0}
.pcard .nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.picon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:19px;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.picon.lg{width:52px;height:52px;border-radius:15px;font-size:26px}
.bar{height:6px;border-radius:3px;background:var(--fill3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--label2);gap:8px}

/* ---------- task rows ---------- */
.trow{display:flex;align-items:flex-start;gap:12px;padding:11px 16px;position:relative;cursor:pointer;min-width:0}
.trow + .trow::before{content:"";position:absolute;top:0;right:0;left:52px;border-top:.5px solid var(--sep)}
.trow:hover{background:var(--fill4)}
.trow.sel{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.trow .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.trow .ttl{font-size:16px;overflow-wrap:anywhere}
.trow.done .ttl{color:var(--label3);text-decoration:line-through}
.trow .sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--label2)}
.trow .sub span{display:inline-flex;align-items:center;gap:3px}
.trow .right{display:flex;align-items:center;gap:8px;flex:none;padding-top:1px}
.due.over{color:var(--red);font-weight:600}
.due.today{color:var(--orange);font-weight:600}
.flag{display:inline-flex}
.addrow{display:flex;align-items:center;gap:12px;padding:10px 16px;color:var(--accent);position:relative}
.addrow::before{content:"";position:absolute;top:0;right:0;left:52px;border-top:.5px solid var(--sep)}
.addrow:first-child::before{display:none}
.addrow input{border:0;outline:none;background:transparent;flex:1;font-size:16px;color:var(--label)}
.addrow input::placeholder{color:var(--accent)}
.sec-h{display:flex;align-items:center;gap:8px;margin:22px 6px 8px;font-weight:700;font-size:17px;width:calc(100% - 12px);text-align:left}
.sec-h .n{color:var(--label2);font-weight:500;font-size:15px}
.sec-h svg{transition:transform .2s;color:var(--label2)}
.sec-h.closed svg{transform:rotate(-90deg)}
.empty{padding:36px 20px;text-align:center;color:var(--label2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ico{width:52px;height:52px;border-radius:50%}
.empty .ico svg.i{width:26px;height:26px}
.empty b{color:var(--label);font-size:17px}

/* ---------- project header & board ---------- */
.phead{display:flex;align-items:center;gap:14px;margin:4px 4px 14px;flex-wrap:wrap}
.phead .info{flex:1;min-width:200px}
.phead h1{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.15;overflow-wrap:anywhere}
.phead .desc{color:var(--label2);margin-top:3px;font-size:14px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 4px 6px}
.controls .sp{flex:1}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:14px;overflow-x:auto;padding:6px 2px 20px;align-items:start}

<script>
/* =====================================================================
   ORBIT CORE — shared business logic.
   The same code runs in the browser (demo mode, data on this device)
   and inside Google Apps Script (live mode, data in Google Sheets).
   A storage adapter "DB" is passed in with:
     all(t) get(t,id) find(t,fn) insert(t,o) update(t,id,patch) remove(t,id)
     saveFile(name,type,base64) -> {url,fileId}

var TABLES = {
  properties: ['id','code','name','createdAt'],
  teams:      ['id','propertyCode','name','color','createdAt'],
  users:      ['id','propertyCode','teamId','username','name','jobTitle','role','status','pinHash','salt','failed','lockedUntil','avatarColor','createdAt','approvedBy','approvedAt'],
  sessions:   ['id','userId','createdAt','lastSeen'],
  projects:   ['id','teamId','name','color','icon','description','ownerId','status','due','createdBy','createdAt','updatedAt','archived'],
  tasks:      ['id','teamId','projectId','parentId','title','notes','status','priority','assignees','due','createdBy','createdAt','updatedAt','completedAt','order','attachments'],
  comments:   ['id','teamId','taskId','userId','text','createdAt'],
  activity:   ['id','teamId','userId','type','refId','text','targets','createdAt']
};
var JSON_COLS = { assignees: 1, attachments: 1, targets: 1 };
var STATUSES = ['todo','doing','review','done'];
var PRIORITIES = ['none','low','medium','high','urgent'];
var PROJECT_STATUSES = ['on_track','at_risk','off_track','on_hold','complete'];
var AVATAR_COLORS = ['blue','indigo','purple','pink','red','orange','green','teal','brown'];
var MAX_UPLOAD_BYTES = 10 * 1024 * 1024;

function sha256(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  var mp = Math.pow, maxWord = mp(2, 32), i, j, result = '';
  var words = [], bitLen = ascii.length * 8;

      hash[pc] = (mp(c, .5) * maxWord) | 0;
      k[pc++] = (mp(c, 1 / 3) * maxWord) | 0;

  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';

    j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }

    hash = hash.slice(0, 8);

      var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +

      var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash);

  return result;
}

function uid(p) { return (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function nowISO() { return new Date().toISOString(); }
function fail(m) { throw new Error(m); }
function str(v, max) { v = (v == null ? '' : String(v)).trim(); return max ? v.slice(0, max) : v; }
function lc(v) { return str(v).toLowerCase(); }
function truthy(v) { return v === true || v === 'true' || v === 1 || v === '1'; }
function pinHash(salt, username, pin) { return sha256(String(salt) + '|' + lc(username) + '|' + String(pin)); }
function makeToken() { return 't' + sha256(uid() + Math.random() + Date.now()).slice(0, 40); }

function publicUser(u) {
  return { id: u.id, propertyCode: u.propertyCode, teamId: u.teamId, username: u.username, name: u.name,
    jobTitle: u.jobTitle, role: u.role, status: u.status, avatarColor: u.avatarColor, createdAt: u.createdAt,
    approvedBy: u.approvedBy || '', approvedAt: u.approvedAt || '' };
}
function isAdmin(u) { return u.role === 'admin'; }
function canSeeTeam(u, teamId) { return isAdmin(u) || u.teamId === teamId; }
function canManageTeam(u, teamId) { return isAdmin(u) || (u.role === 'head' && u.teamId === teamId); }
function findProperty(DB, code) { code = str(code).toUpperCase(); return DB.find('properties', function (p) { return String(p.code).toUpperCase() === code; }); }

function auth(DB, token) {
  if (!token) fail('AUTH');
  var s = DB.get('sessions', token);
  if (!s) fail('AUTH');
  var u = DB.get('users', s.userId);
  if (!u || u.status !== 'active') fail('AUTH');
  return u;
}
function log(DB, u, teamId, type, refId, text, targets) {
  DB.insert('activity', { id: uid('a'), teamId: teamId, userId: u.id, type: type, refId: refId || '', text: text,
    targets: (targets || []).filter(function (t) { return t && t !== u.id; }), createdAt: nowISO() });
}
function headsOf(DB, teamId) {
  return DB.all('users').filter(function (x) { return x.status === 'active' && (x.role === 'admin' || (x.role === 'head' && x.teamId === teamId)); })
    .map(function (x) { return x.id; });
}
function taskOrFail(DB, u, id) {
  var t = DB.get('tasks', id);
  if (!t || !canSeeTeam(u, t.teamId)) fail('That task no longer exists.');
  return t;
}

var ACTIONS = {
  /* ---------- public: no login needed ---------- */
  teams: function (DB, r) {
    var p = findProperty(DB, r.propertyCode);
    if (!p) fail('We could not find property code "' + str(r.propertyCode).toUpperCase() + '". Check the code with your department head.');
    var teams = DB.all('teams').filter(function (t) { return t.propertyCode === p.code; })
      .map(function (t) { return { id: t.id, name: t.name, color: t.color }; })
      .sort(function (a, b) { return a.name < b.name ? -1 : 1; });
    return { property: { code: p.code, name: p.name }, teams: teams };
  },

  signup: function (DB, r) {
    var p = findProperty(DB, r.propertyCode);
    if (!p) fail('Unknown property code.');
    var team = DB.get('teams', r.teamId);
    if (!team || team.propertyCode !== p.code) fail('Choose a team for this property.');
    var name = str(r.name, 60), username = lc(r.username), jobTitle = str(r.jobTitle, 60), pin = str(r.pin);
    if (name.length < 2) fail('Enter your full name.');
    if (!/^[a-z0-9._-]{3,20}$/.test(username)) fail('Username must be 3–20 letters, numbers, dots or dashes.');
    if (!/^\d{4}$/.test(pin)) fail('Your PIN must be exactly 4 digits.');
    var taken = DB.find('users', function (x) { return x.propertyCode === p.code && lc(x.username) === username; });
    if (taken) fail('That username is already taken at ' + p.code + '. Try another.');
    var salt = uid('s');
    var u = { id: uid('u'), propertyCode: p.code, teamId: team.id, username: username, name: name, jobTitle: jobTitle,
      role: 'member', status: 'pending', pinHash: pinHash(salt, username, pin), salt: salt, failed: 0, lockedUntil: '',
      avatarColor: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)], createdAt: nowISO(), approvedBy: '', approvedAt: '' };
    DB.insert('users', u);
    DB.insert('activity', { id: uid('a'), teamId: team.id, userId: u.id, type: 'signup', refId: u.id,
      text: 'asked to join ' + team.name, targets: headsOf(DB, team.id), createdAt: nowISO() });
    return { status: 'pending', team: team.name, property: p.code };
  },

  login: function (DB, r) {
    var p = findProperty(DB, r.propertyCode);
    var username = lc(r.username), pin = str(r.pin);
    if (!p) fail('Unknown property code.');
    var u = DB.find('users', function (x) { return x.propertyCode === p.code && lc(x.username) === username; });
    if (!u) fail('Username or PIN is incorrect.');
    if (u.lockedUntil && new Date(u.lockedUntil) > new Date()) fail('Too many wrong PINs. Try again after 15 minutes, or ask your department head to reset your PIN.');
    if (pinHash(u.salt, u.username, pin) !== u.pinHash) {
      var f = (Number(u.failed) || 0) + 1;
      DB.update('users', u.id, { failed: f, lockedUntil: f >= 5 ? new Date(Date.now() + 15 * 60000).toISOString() : '' });
      fail(f >= 5 ? 'Too many wrong PINs. Your account is locked for 15 minutes.' : 'Username or PIN is incorrect.');
    }
    if (u.status === 'pending') fail('PENDING');
    if (u.status === 'disabled') fail('Your account has been turned off. Contact your department head.');
    DB.update('users', u.id, { failed: 0, lockedUntil: '' });
    var token = makeToken();
    DB.insert('sessions', { id: token, userId: u.id, createdAt: nowISO(), lastSeen: nowISO() });
    return { token: token, user: publicUser(u) };
  },

  logout: function (DB, r) {
    if (r.token && DB.get('sessions', r.token)) DB.remove('sessions', r.token);
    return { ok: true };
  },

  /* ---------- everything the signed-in person can see ---------- */
  sync: function (DB, r) {
    var u = auth(DB, r.token);
    var admin = isAdmin(u);
    var teams = DB.all('teams').filter(function (t) { return admin || t.id === u.teamId; });
    var teamIds = {}; teams.forEach(function (t) { teamIds[t.id] = 1; });
    var inScope = function (x) { return !!teamIds[x.teamId]; };
    var users = DB.all('users').filter(function (x) {
      if (admin) return true;
      if (x.teamId !== u.teamId) return false;
      return x.status === 'active' || u.role === 'head';
    }).map(publicUser);
    var activity = DB.all('activity').filter(inScope)
      .sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; }).slice(0, 250);
    return {
      me: publicUser(u),
      properties: DB.all('properties').filter(function (p) { return admin || p.code === u.propertyCode; })
        .map(function (p) { return { id: p.id, code: p.code, name: p.name }; }),
      teams: teams, users: users,
      projects: DB.all('projects').filter(inScope),
      tasks: DB.all('tasks').filter(inScope),
      comments: DB.all('comments').filter(inScope),
      activity: activity,
      serverTime: nowISO()
    };
  },

  /* ---------- projects ---------- */
  saveProject: function (DB, r) {
    var u = auth(DB, r.token), p = r.project || {};
    var fields = { name: str(p.name, 80), color: str(p.color, 20) || 'blue', icon: str(p.icon, 8), description: str(p.description, 2000),
      ownerId: str(p.ownerId), status: PROJECT_STATUSES.indexOf(p.status) >= 0 ? p.status : 'on_track', due: str(p.due, 10),
      archived: truthy(p.archived), updatedAt: nowISO() };
    if (!fields.name) fail('Give the project a name.');
    var existing = p.id ? DB.get('projects', p.id) : null;
    if (existing) {
      if (!canSeeTeam(u, existing.teamId)) fail('You can’t edit this project.');
      DB.update('projects', existing.id, fields);
      return DB.get('projects', existing.id);
    }
    var teamId = isAdmin(u) && p.teamId ? p.teamId : u.teamId;
    if (!DB.get('teams', teamId)) fail('Choose a team for this project.');
    var obj = Object.assign({ id: uid('p'), teamId: teamId, createdBy: u.id, createdAt: nowISO() }, fields);
    if (!obj.ownerId) obj.ownerId = u.id;
    DB.insert('projects', obj);
    log(DB, u, teamId, 'project', obj.id, 'created the project ' + obj.name, []);
    return obj;
  },

  deleteProject: function (DB, r) {
    var u = auth(DB, r.token), p = DB.get('projects', r.id);
    if (!p || !canSeeTeam(u, p.teamId)) fail('That project no longer exists.');
    if (!(canManageTeam(u, p.teamId) || p.createdBy === u.id)) fail('Only the person who created this project or a department head can delete it.');
    DB.all('tasks').filter(function (t) { return t.projectId === p.id; }).forEach(function (t) {
      DB.all('comments').filter(function (c) { return c.taskId === t.id; }).forEach(function (c) { DB.remove('comments', c.id); });
      DB.remove('tasks', t.id);
    });
    DB.remove('projects', p.id);
    log(DB, u, p.teamId, 'project', '', 'deleted the project ' + p.name, []);
    return { ok: true };
  },

  /* ---------- tasks & subtasks ---------- */
  saveTask: function (DB, r) {
    var u = auth(DB, r.token), t = r.task || {};
    var existing = t.id ? DB.get('tasks', t.id) : null;
    if (existing) { if (!canSeeTeam(u, existing.teamId)) fail('That task no longer exists.'); existing = JSON.parse(JSON.stringify(existing)); }
    var base = existing || {};
    var projectId = t.projectId !== undefined ? str(t.projectId) : base.projectId;
    var project = projectId ? DB.get('projects', projectId) : null;
    if (projectId && (!project || !canSeeTeam(u, project.teamId))) fail('Choose a project you belong to.');
    var parent = t.parentId || base.parentId ? DB.get('tasks', t.parentId || base.parentId) : null;
    var teamId = project ? project.teamId : (parent ? parent.teamId : (existing ? existing.teamId : u.teamId));
    if (isAdmin(u) && !project && !parent && !existing && t.teamId) teamId = t.teamId;
    if (!canSeeTeam(u, teamId)) fail('You can’t add tasks to that team.');
    var team = DB.all('users').filter(function (x) { return x.teamId === teamId && x.status === 'active'; }).map(function (x) { return x.id; });
    var admins = DB.all('users').filter(function (x) { return x.role === 'admin'; }).map(function (x) { return x.id; });

    var f = {};
    if (t.title !== undefined) f.title = str(t.title, 300);
    if (t.notes !== undefined) f.notes = str(t.notes, 10000);
    if (t.status !== undefined) f.status = STATUSES.indexOf(t.status) >= 0 ? t.status : 'todo';
    if (t.priority !== undefined) f.priority = PRIORITIES.indexOf(t.priority) >= 0 ? t.priority : 'none';
    if (t.due !== undefined) f.due = str(t.due, 10);
    if (t.order !== undefined) f.order = Number(t.order) || 0;
    if (t.projectId !== undefined) f.projectId = projectId || '';
    if (t.assignees !== undefined) f.assignees = (t.assignees || []).filter(function (id) { return team.indexOf(id) >= 0 || admins.indexOf(id) >= 0; });
    f.teamId = teamId; f.updatedAt = nowISO();
    if (f.status) f.completedAt = f.status === 'done' ? (base.status === 'done' ? base.completedAt : nowISO()) : '';

    if (existing) {
      if (f.title === '') fail('A task needs a title.');
      DB.update('tasks', existing.id, f);
      var after = DB.get('tasks', existing.id);
      var added = (f.assignees || []).filter(function (id) { return (existing.assignees || []).indexOf(id) < 0; });
      if (added.length) log(DB, u, teamId, 'assign', existing.id, 'assigned “' + after.title + '”', added);
      if (f.status && f.status !== existing.status && f.status === 'done')
        log(DB, u, teamId, 'complete', existing.id, 'completed “' + after.title + '”', [after.createdBy].concat(after.assignees || []));
      return after;
    }
    if (!f.title) fail('A task needs a title.');
    var obj = Object.assign({ id: uid('t'), parentId: parent ? parent.id : '', projectId: projectId || '', notes: '', status: 'todo',
      priority: 'none', assignees: [], due: '', order: Date.now(), attachments: [], completedAt: '',
      createdBy: u.id, createdAt: nowISO() }, f);
    DB.insert('tasks', obj);
    if ((obj.assignees || []).length) log(DB, u, teamId, 'assign', obj.id, 'assigned “' + obj.title + '”', obj.assignees);
    else if (!parent) log(DB, u, teamId, 'task', obj.id, 'added “' + obj.title + '”', []);
    return obj;
  },

  deleteTask: function (DB, r) {
    var u = auth(DB, r.token), t = taskOrFail(DB, u, r.id);
    if (!(canManageTeam(u, t.teamId) || t.createdBy === u.id)) fail('Only the person who created this task or a department head can delete it.');
    var kill = function (id) {
      DB.all('tasks').filter(function (x) { return x.parentId === id; }).forEach(function (x) { kill(x.id); });
      DB.all('comments').filter(function (c) { return c.taskId === id; }).forEach(function (c) { DB.remove('comments', c.id); });
      DB.remove('tasks', id);
    };
    kill(t.id);
    return { ok: true };
  },

  addComment: function (DB, r) {
    var u = auth(DB, r.token), t = taskOrFail(DB, u, r.taskId), text = str(r.text, 4000);
    if (!text) fail('Write a comment first.');
    var c = { id: uid('c'), teamId: t.teamId, taskId: t.id, userId: u.id, text: text, createdAt: nowISO() };
    DB.insert('comments', c);
    log(DB, u, t.teamId, 'comment', t.id, 'commented on “' + t.title + '”', [t.createdBy].concat(t.assignees || []));
    return c;
  },

  deleteComment: function (DB, r) {
    var u = auth(DB, r.token), c = DB.get('comments', r.id);
    if (!c) return { ok: true };
    if (!(c.userId === u.id || canManageTeam(u, c.teamId))) fail('You can only delete your own comments.');
    DB.remove('comments', c.id);
    return { ok: true };
  },

  upload: function (DB, r) {
    var u = auth(DB, r.token), t = taskOrFail(DB, u, r.taskId);
    var data = String(r.data || '');
    if (!data) fail('No file received.');
    if (data.length * 0.75 > MAX_UPLOAD_BYTES) fail('Files can be up to 10 MB.');
    var name = str(r.name, 120) || 'file';
    var saved = DB.saveFile(name, str(r.type, 100) || 'application/octet-stream', data);
    var att = { id: uid('f'), name: name, type: str(r.type, 100), size: Number(r.size) || Math.round(data.length * 0.75),
      url: saved.url, fileId: saved.fileId || '', by: u.id, at: nowISO() };
    var list = (t.attachments || []).concat([att]);
    DB.update('tasks', t.id, { attachments: list, updatedAt: nowISO() });
    log(DB, u, t.teamId, 'file', t.id, 'attached ' + name + ' to “' + t.title + '”', [t.createdBy].concat(t.assignees || []));
    return att;
  },

  removeAttachment: function (DB, r) {
    var u = auth(DB, r.token), t = taskOrFail(DB, u, r.taskId);
    var att = (t.attachments || []).filter(function (a) { return a.id === r.attId; })[0];
    if (!att) return { ok: true };
    if (!(att.by === u.id || canManageTeam(u, t.teamId))) fail('Only the person who added this file or a department head can remove it.');
    DB.update('tasks', t.id, { attachments: (t.attachments || []).filter(function (a) { return a.id !== r.attId; }) });
    return { ok: true };
  },

  /* ---------- people & approvals ---------- */
  updateUser: function (DB, r) {
    var u = auth(DB, r.token), target = DB.get('users', r.userId), patch = r.patch || {};
    if (!target) fail('That person no longer exists.');
    if (!canManageTeam(u, target.teamId)) fail('Only the main admin or this team’s department head can change this.');
    if (target.role === 'admin' && !isAdmin(u)) fail('You can’t change the main admin.');
    var f = {};
    if (patch.name !== undefined) f.name = str(patch.name, 60) || target.name;
    if (patch.jobTitle !== undefined) f.jobTitle = str(patch.jobTitle, 60);
    if (patch.role !== undefined) {
      var allowed = isAdmin(u) ? ['member', 'head', 'admin'] : ['member', 'head'];
      if (allowed.indexOf(patch.role) < 0) fail('You can’t give that role.');
      if (target.id === u.id && patch.role !== u.role) fail('You can’t change your own role.');
      f.role = patch.role;
    }
    if (patch.teamId !== undefined && patch.teamId !== target.teamId) {
      if (!isAdmin(u)) fail('Only the main admin can move people between teams.');
      var nt = DB.get('teams', patch.teamId); if (!nt) fail('Choose a team.');
      f.teamId = nt.id; f.propertyCode = nt.propertyCode;
    }
    if (patch.status !== undefined) {
      if (['active', 'disabled'].indexOf(patch.status) < 0) fail('Unknown status.');
      if (target.id === u.id) fail('You can’t turn off your own account.');
      f.status = patch.status;
      if (patch.status === 'active' && target.status === 'pending') { f.approvedBy = u.id; f.approvedAt = nowISO(); }
    }
    DB.update('users', target.id, f);
    if (f.status === 'active' && target.status === 'pending')
      log(DB, u, f.teamId || target.teamId, 'approved', target.id, 'approved ' + target.name + ' to join the team', [target.id]);
    if (f.status === 'disabled') DB.all('sessions').filter(function (s) { return s.userId === target.id; }).forEach(function (s) { DB.remove('sessions', s.id); });
    return publicUser(DB.get('users', target.id));
  },

  removeUser: function (DB, r) {
    var u = auth(DB, r.token), target = DB.get('users', r.userId);
    if (!target) return { ok: true };
    if (target.id === u.id) fail('You can’t remove yourself.');
    if (!canManageTeam(u, target.teamId) || (target.role === 'admin' && !isAdmin(u))) fail('You can’t remove this person.');
    DB.all('sessions').filter(function (s) { return s.userId === target.id; }).forEach(function (s) { DB.remove('sessions', s.id); });
    DB.remove('users', target.id);
    return { ok: true };
  },

  resetPin: function (DB, r) {
    var u = auth(DB, r.token), target = DB.get('users', r.userId), pin = str(r.pin);
    if (!target) fail('That person no longer exists.');
    if (!/^\d{4}$/.test(pin)) fail('The PIN must be exactly 4 digits.');
    if (target.id !== u.id && (!canManageTeam(u, target.teamId) || (target.role === 'admin' && !isAdmin(u)))) fail('You can’t reset this PIN.');
    if (target.id === u.id && pinHash(u.salt, u.username, str(r.oldPin)) !== u.pinHash) fail('Your current PIN is incorrect.');
    var salt = uid('s');
    DB.update('users', target.id, { salt: salt, pinHash: pinHash(salt, target.username, pin), failed: 0, lockedUntil: '' });
    return { ok: true };
  },

  /* ---------- properties & teams (main admin) ---------- */
  saveProperty: function (DB, r) {
    var u = auth(DB, r.token); if (!isAdmin(u)) fail('Only the main admin can add properties.');
    var code = str(r.property && r.property.code, 12).toUpperCase().replace(/[^A-Z0-9]/g, '');
    var name = str(r.property && r.property.name, 100);
    if (code.length < 3) fail('Property codes need at least 3 letters or numbers.');
    if (!name) fail('Enter the property name.');
    var ex = findProperty(DB, code);
    if (ex) { DB.update('properties', ex.id, { name: name }); return DB.get('properties', ex.id); }
    var p = { id: uid('h'), code: code, name: name, createdAt: nowISO() };
    DB.insert('properties', p);
    return p;
  },

  saveTeam: function (DB, r) {
    var u = auth(DB, r.token); if (!isAdmin(u)) fail('Only the main admin can add teams.');
    var t = r.team || {}, name = str(t.name, 60);
    if (!name) fail('Enter a team name.');
    if (t.id) { DB.update('teams', t.id, { name: name, color: str(t.color, 20) || 'blue' }); return DB.get('teams', t.id); }
    var p = findProperty(DB, t.propertyCode); if (!p) fail('Choose a property.');
    var obj = { id: uid('g'), propertyCode: p.code, name: name, color: str(t.color, 20) || 'blue', createdAt: nowISO() };
    DB.insert('teams', obj);
    return obj;
  },

  deleteTeam: function (DB, r) {
    var u = auth(DB, r.token); if (!isAdmin(u)) fail('Only the main admin can delete teams.');
    if (DB.find('users', function (x) { return x.teamId === r.id; })) fail('Move or remove everyone in this team first.');
    if (DB.find('projects', function (x) { return x.teamId === r.id; })) fail('Delete this team’s projects first.');
    DB.remove('teams', r.id);
    return { ok: true };
  }
};

function coreHandle(DB, req) {
  try {
    var fn = ACTIONS[req && req.action];
    if (!fn) fail('Unknown request.');
    return { ok: true, data: fn(DB, req) };
  } catch (e) {
    return { ok: false, error: String(e && e.message || e) };
  }
}

function seedAdmin(DB, cfg) {
  var p = findProperty(DB, cfg.propertyCode);
  if (!p) { p = { id: uid('h'), code: cfg.propertyCode, name: cfg.propertyName, createdAt: nowISO() }; DB.insert('properties', p); }
  var team = DB.find('teams', function (t) { return t.propertyCode === p.code && t.name === cfg.teamName; });
  if (!team) { team = { id: uid('g'), propertyCode: p.code, name: cfg.teamName, color: 'blue', createdAt: nowISO() }; DB.insert('teams', team); }
  var ex = DB.find('users', function (x) { return x.propertyCode === p.code && lc(x.username) === lc(cfg.username); });
  if (ex) return ex;
  var salt = uid('s');
  var u = { id: uid('u'), propertyCode: p.code, teamId: team.id, username: lc(cfg.username), name: cfg.name, jobTitle: cfg.jobTitle,
    role: 'admin', status: 'active', pinHash: pinHash(salt, cfg.username, cfg.pin), salt: salt, failed: 0, lockedUntil: '',
    avatarColor: 'indigo', createdAt: nowISO(), approvedBy: '', approvedAt: '' };
  DB.insert('users', u);
  return u;
}

function fmtDay(s) {

}
function ago(iso) {

const LocalDB = (() => {
  const KEY = 'orbit_demo_v1';
  let T = null, mem = false;
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
  function load() {
    if (T) return;
    T = store.get(KEY, null);
    if (!T) { T = {}; seedDemo(api); save(); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(T)); } catch (e) { mem = true; } }
  const api = {
    all: t => { load(); return clone(T[t] || []); },
    get: (t, id) => { load(); return clone((T[t] || []).find(x => x.id === id) || null); },
    find: (t, f) => { load(); return clone((T[t] || []).find(f) || null); },
    insert: (t, o) => { load(); (T[t] = T[t] || []).push(clone(o)); save(); },
    update: (t, id, p) => { load(); const r = (T[t] || []).find(x => x.id === id); if (r) { Object.assign(r, clone(p)); save(); } },
    remove: (t, id) => { load(); T[t] = (T[t] || []).filter(x => x.id !== id); save(); },
    saveFile: (name, type, b64) => ({ url: 'data:' + (type || 'application/octet-stream') + ';base64,' + b64 }),
    reset: () => { T = {}; seedDemo(api); save(); },
    get memoryOnly() { return mem; }
  };
  return api;
})();

const Session = {
  get token() { return (store.get('orbit_session', {}) || {}).token || ''; },
  get user() { return (store.get('orbit_session', {}) || {}).user || null; },
  set(token, user) { store.set('orbit_session', { token, user }); },
  clear() { store.del('orbit_session'); }
};
const API = {
  live: !!CONFIG.API_URL,
  async call(action, payload = {}) {
    const req = Object.assign({ action, token: Session.token }, payload);
    let res;
    if (!this.live) {
      await sleep(60);
      res = coreHandle(LocalDB, JSON.parse(JSON.stringify(req)));
    } else {
      let r;
      try {
        r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) });
      } catch (e) { throw new Error('Can’t reach the server. Check your connection and try again.'); }
      if (!r.ok) throw new Error('The server returned an error (' + r.status + '). Try again in a moment.');
      res = await r.json();
    }
    if (!res.ok) {
      if (res.error === 'AUTH' && action !== 'login') { signedOut('You were signed out. Sign in again to continue.'); }
      throw new Error(res.error);
    }
    return res.data;
  }
};

function myTasksHtml() {
  const mine = myTasks(), f = S.myFilter;
  const segs = [['open', 'All Open'], ['today', 'Today'], ['overdue', 'Overdue'], ['done', 'Completed']];
  let body = '';
  const sortDue = (a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : (PRIOR(b) - PRIOR(a));
  if (f === 'done') {
    const list = mine.filter(isDone).sort((a, b) => (a.completedAt < b.completedAt ? 1 : -1));
    body = list.length ? `<div class="group">${list.map(t => taskRow(t, { showProject: true })).join('')}</div>` : `<div class="group">${emptyState('done', 'green', 'Nothing completed yet', 'Tasks you finish will collect here.')}</div>`;
  } else {

    const buckets = [['Overdue', t => t.due && dayDiff(t.due) < 0], ['Today', t => t.due && dayDiff(t.due) === 0], ['Tomorrow', t => t.due && dayDiff(t.due) === 1],

function calendarHtml(p) {

  return `<div class="file"><span class="ft" style="background:${cvar(col)}">${esc(ext)}</span><div class="nm"><a href="${esc(a.url)}" target="_blank" rel="noopener" ${a.url.startsWith('data:') ? `download="${esc(a.name)}"` : ''}>${esc(a.name)}</a>

/* ---------------- overlays: dialogs, alerts, menus, toasts ---------------- */
const ov = () => $('#ov');
let DLG = null;
function openDialog({ title, body, ok = 'Save', okClass = 'primary', onOk, onOpen, cancel = 'Cancel' }) {
  DLG = { onOk };
  ov().innerHTML = `<div class="scrim" data-dact="close"></div><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="dlg-bar"><button class="btn plain" data-dact="close">${cancel}</button><h2>${esc(title)}</h2>${ok ? `<button class="btn ${okClass}" data-dact="ok">${ok}</button>` : '<span style="width:70px"></span>'}</div>
    <div class="dlg-body">${body}</div></div>`;
  onOpen && onOpen(ov());
  const f = $('.dialog [autofocus]', ov()); if (f && window.innerWidth > 899) setTimeout(() => f.focus(), 50);
}
function closeDialog() { DLG = null; ov().innerHTML = ''; }
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-dact]'); if (!el) return;
  if (el.dataset.dact === 'close') return closeDialog();
  if (el.dataset.dact === 'ok' && DLG && DLG.onOk) {
    el.disabled = true;
    try { const r = await DLG.onOk(ov()); if (r !== false) closeDialog(); }
    catch (err) { toast(err.message, true); }
    finally { if (el.isConnected) el.disabled = false; }
  }
});
function confirmBox({ title, msg = '', ok = 'OK', danger = false, cancel = 'Cancel' }) {
  return new Promise(res => {
    const root = $('#alert');
    root.innerHTML = `<div class="scrim alert-scrim"></div><div class="alert glass" role="alertdialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p>${esc(msg)}</p>
      <div class="btns"><button class="btn gray" data-r="0">${cancel}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-r="1">${ok}</button></div></div>`;
    $$('[data-r]', root).forEach(b => b.onclick = () => { root.innerHTML = ''; res(b.dataset.r === '1'); });
    $('.alert-scrim', root).onclick = () => { root.innerHTML = ''; res(false); };
    setTimeout(() => $('[data-r="1"]', root).focus(), 30);
  });
}
function openMenu(anchor, items) {
  const root = $('#menu');
  const r = anchor.getBoundingClientRect();
  root.innerHTML = `<div class="scrim" style="background:transparent" data-mclose="1"></div><div class="menu glass" role="menu">${items.map((it, i) =>
    it === '-' ? '<hr>' : it.header ? `<div class="mh">${esc(it.header)}</div>` :
      `<button role="menuitem" data-mi="${i}" class="${it.danger ? 'danger' : ''}"><span class="tick">${it.checked ? ic('check', 's') : it.icon ? it.icon : ''}</span><span class="mlbl">${it.html || esc(it.label)}</span></button>`).join('')}</div>`;
  const m = $('.menu', root);
  const w = m.offsetWidth, h = m.offsetHeight;
  let left = Math.min(r.left, window.innerWidth - w - 12), top = r.bottom + 6;
  if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 6);
  m.style.left = Math.max(12, left) + 'px'; m.style.top = top + 'px';
  root.onclick = e => {
    if (e.target.dataset.mclose) { root.innerHTML = ''; return; }
    const b = e.target.closest('[data-mi]'); if (!b) return;
    root.innerHTML = ''; items[+b.dataset.mi].onClick();
  };
  const first = $('[data-mi]', m); first && first.focus();
}
let toastT;
function toast(msg, err = false) {
  const root = $('#toast');
  root.innerHTML = `<div class="toast glass ${err ? 'err' : ''}" role="status">${ic(err ? 'alert' : 'check', 's')}<span>${esc(msg)}</span></div>`;
  clearTimeout(toastT); toastT = setTimeout(() => root.innerHTML = '', err ? 4500 : 2200);
}

/* ---------------- data sync ---------------- */
let syncing = false;
async function sync(opts = {}) {
  if (syncing || !Session.token) return;
  syncing = true;
  try {
    const data = await API.call('sync');
    S.data = data;
    Session.set(Session.token, data.me);
    if (data.me.role !== 'admin') S.scope = 'all';
    else if (S.scope !== 'all' && !data.teams.find(t => t.id === S.scope)) S.scope = 'all';
    render({ soft: opts.soft });
  } catch (e) {
    if (Session.token && !opts.soft) toast(e.message, true);
  } finally { syncing = false; }
}
async function run(action, payload, okMsg) {
  try { const r = await API.call(action, payload); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); sync({ soft: true }); throw e; }
}
async function saveTask(patch, msg) {
  const t = patch.id ? taskById(patch.id) : null;
  if (t) { Object.assign(t, patch); if (patch.status) t.completedAt = patch.status === 'done' ? new Date().toISOString() : ''; render(); }
  const res = await run('saveTask', { task: patch }, msg);
  upsert('tasks', res);
  render();
  return res;
}
function signedOut(msg) {
  Session.clear(); S.data = null; S.taskId = null; S.view = 'home';
  A.step = 'signin'; A.err = msg || ''; render();
}

  back() { S.view = S.view === 'project' ? 'projects' : 'home'; S.q = ''; render(); },

  openTask(el) { S.taskId = el.dataset.id; render({ keepInsp: false }); const is = $('.insp-scroll'); if (is) is.scrollTop = 0; },
  closeTask() { S.taskId = null; render(); },
  scopeMenu(el) {
    const items = [{ label: 'All Teams', checked: S.scope === 'all', onClick: () => { S.scope = 'all'; store.set('orbit_scope', 'all'); render(); } }];
    D().properties.forEach(p => {

      items.push('-', { header: p.code + ' · ' + p.name });
      ts.forEach(t => items.push({ label: t.name, checked: S.scope === t.id, onClick: () => { S.scope = t.id; store.set('orbit_scope', t.id); if (S.view === 'project') S.view = 'projects'; render(); } }));
    });

  },
  async toggleDone(el) {

    const nowDone = !isDone(t);
    el.classList.add('pop');
    await saveTask({ id: t.id, status: nowDone ? 'done' : 'todo' }, nowDone ? 'Marked complete' : null);
  },
  statusMenu(el) { const t = taskById(el.dataset.id); openMenu(el, Object.keys(STATUS).map(k => ({ html: pillHtml(STATUS[k]), checked: t.status === k, onClick: () => saveTask({ id: t.id, status: k }) }))); },
  prioMenu(el) { const t = taskById(el.dataset.id); openMenu(el, ['urgent', 'high', 'medium', 'low', 'none'].map(k => ({ label: PRIO[k].l, icon: `<span style="color:${cvar(PRIO[k].c)}">${ic('flag', 's')}</span>`, checked: (t.priority || 'none') === k, onClick: () => saveTask({ id: t.id, priority: k }) }))); },
  moveMenu(el) {
    const t = taskById(el.dataset.id);
    const list = D().projects.filter(p => p.teamId === t.teamId && !p.archived);
    openMenu(el, [{ label: 'No Project', checked: !t.projectId, onClick: () => saveTask({ id: t.id, projectId: '' }) }, '-',
      ...list.map(p => ({ label: (p.icon ? p.icon + ' ' : '') + p.name, checked: t.projectId === p.id, onClick: () => saveTask({ id: t.id, projectId: p.id }, 'Moved to ' + p.name) }))]);
  },
  taskMenu(el) {
    const t = taskById(el.dataset.id);
